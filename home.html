<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#701b39">
<title>FreeTube — Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --bg:#351b2b;
  --panel:rgba(29,35,36,.58);
  --panel2:rgba(255,255,255,.09);
  --green:#00f59b;
  --text:#ffffff;
  --muted:#d3dcd7;
  --border:rgba(255,255,255,.16);
  --red:#ff626b;
  --glass:rgba(20,27,28,.56);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:#173d30}
body{
  background:linear-gradient(135deg,#a90f31 0%,#681d3d 27%,#3d2940 48%,#17563c 73%,#008a4b 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.55;cursor:not-allowed}
[hidden]{display:none!important}
.app{
  max-width:650px;
  margin:auto;
  min-height:100dvh;
  padding-bottom:90px;
  background:linear-gradient(160deg,rgba(110,17,48,.18),rgba(0,105,61,.16));
}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px;
  background:rgba(29,25,34,.62);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  box-shadow:0 5px 22px rgba(0,0,0,.08);
}
.brand{font-size:26px;font-weight:900;letter-spacing:-1px}
.brand i{color:#ff6675}
.brand span{color:var(--green)}
.top-actions{display:flex;gap:10px}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.10);
  border:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.icon-btn:active,.fake-input:active,.action:active{transform:scale(.97)}
.create-box{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:rgba(28,32,34,.45);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.avatar{
  width:42px;height:42px;object-fit:cover;border-radius:50%;
  background:var(--panel2);flex-shrink:0;
  border:1px solid rgba(255,255,255,.22);
}
.fake-input{
  flex:1;min-width:0;text-align:left;
  padding:13px 15px;border-radius:28px;
  color:var(--muted);
  background:rgba(255,255,255,.09);
  border:1px solid var(--border);
}
.fake-input i{float:right;color:var(--green)}
.stories{
  display:flex;gap:10px;overflow-x:auto;
  padding:13px 14px;
  background:rgba(31,29,37,.38);
  scrollbar-width:none;border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.stories::-webkit-scrollbar{display:none}
.story{
  flex:0 0 100px;height:150px;position:relative;
  overflow:hidden;border-radius:13px;
  display:flex;align-items:flex-end;padding:9px;
  background:linear-gradient(145deg,rgba(193,28,66,.76),rgba(0,119,69,.8));
  border:1px solid var(--border);
  box-shadow:0 5px 16px rgba(0,0,0,.12);
}
.story img.cover{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:.75;
}
.story .story-avatar{
  position:absolute;top:8px;left:8px;
  width:32px;height:32px;border-radius:50%;
  border:2px solid var(--green);object-fit:cover;
}
.story span{position:relative;z-index:1;font-size:12px;font-weight:bold;text-shadow:0 1px 5px #000}
.story-create{
  align-items:center;justify-content:center;flex-direction:column;
  gap:12px;text-align:center;
  background:linear-gradient(145deg,rgba(194,25,64,.45),rgba(0,125,72,.42));
}
.story-create i{font-size:27px;color:var(--green)}
#feed{padding-top:8px}
.post{
  background:rgba(28,32,34,.57);
  margin-bottom:10px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  overflow:hidden;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  box-shadow:0 6px 22px rgba(0,0,0,.08);
}
.post-header{
  display:flex;align-items:center;gap:10px;
  padding:13px 14px;
}
.post-user{flex:1;min-width:0}
.post-name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.post-time{font-size:12px;color:var(--muted);margin-top:4px}
.post-menu{background:transparent;padding:10px;color:var(--muted);border:0}
.post-text{
  padding:0 15px 13px;white-space:pre-wrap;
  overflow-wrap:anywhere;line-height:1.5;font-size:15px;
}
.media{
  width:100%;background:#000;display:flex;
  align-items:center;justify-content:center;position:relative;
}
.media img,.media video{
  width:100%;max-height:480px;object-fit:contain;display:block;
}
.media video{background:#000}
.sound-btn{
  position:absolute;right:12px;top:12px;
  width:42px;height:42px;border-radius:50%;
  background:#000b;border:1px solid #ffffff55;
}
.post-stats{
  display:flex;justify-content:space-between;gap:8px;
  padding:10px 14px;color:var(--muted);font-size:12px;
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.post-actions{
  display:flex;align-items:center;justify-content:space-around;
  padding:4px 2px;gap:2px;
}
.action{
  flex:1;min-width:0;background:transparent;border:0;
  padding:12px 3px;color:#edf6f0;
  font-size:12px;display:flex;gap:6px;
  align-items:center;justify-content:center;
}
.action.liked{color:var(--green)}
.action.delete{color:#ff9999}
.ad-card{
  margin:10px 0;padding:10px 8px;
  text-align:center;background:rgba(25,31,32,.48);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.ad-label{font-size:10px;color:var(--muted);margin-bottom:6px}
.ad-slot{
  width:320px;max-width:100%;min-height:50px;
  margin:auto;display:flex;justify-content:center;
  align-items:center;overflow:hidden;
}
.ad-slot iframe{max-width:100%;border:0}
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  z-index:30;width:100%;max-width:650px;
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 5px calc(10px + env(safe-area-inset-bottom));
  background:rgba(36,29,39,.48);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.20);
  box-shadow:0 -8px 30px rgba(0,0,0,.12);
}
.nav-item{
  flex:1;min-width:0;display:flex;flex-direction:column;
  align-items:center;gap:5px;background:transparent;
  border:0;color:rgba(255,255,255,.76);font-size:11px;
  transition:color .2s,transform .2s;
}
.nav-item i{font-size:21px}
.nav-item.active{color:var(--green)}
.nav-item.active i{filter:drop-shadow(0 0 6px rgba(0,245,155,.3))}
.loading,.empty{
  padding:35px 18px;text-align:center;color:var(--muted);
  background:rgba(30,33,34,.3);
}
.modal{
  display:none;position:fixed;inset:0;z-index:60;
  background:#000a;align-items:flex-end;justify-content:center;
  padding:10px;
}
.modal.open{display:flex}
.modal-content{
  width:100%;max-width:600px;max-height:90dvh;overflow:auto;
  background:linear-gradient(145deg,rgba(104,26,56,.97),rgba(16,77,49,.97));
  border:1px solid var(--border);
  border-radius:20px;padding:17px;
  backdrop-filter:blur(20px);
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:15px;
}
.close-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.1);border:1px solid var(--border);
}
.field{
  width:100%;margin:7px 0;padding:12px;
  border:1px solid var(--border);border-radius:10px;
  color:white;background:rgba(13,30,23,.65);outline:none;
}
.field::placeholder{color:#c8d2cc}
textarea.field{min-height:110px;resize:vertical}
.primary,.secondary{
  padding:11px 14px;border-radius:10px;border:1px solid var(--border);
}
.primary{
  background:linear-gradient(110deg,#c91f4b,#008b52);
  color:white;font-weight:bold;
}
.secondary{background:rgba(255,255,255,.1);color:white}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1}
.comment{
  padding:10px 0;border-bottom:1px solid var(--border);
  overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px;
}
.toast{
  position:fixed;z-index:100;bottom:90px;left:50%;
  transform:translateX(-50%);max-width:90%;
  background:rgba(35,45,40,.95);
  border:1px solid var(--border);
  padding:12px 16px;border-radius:12px;
  display:none;font-size:13px;text-align:center;
  backdrop-filter:blur(16px);
}
.toast.show{display:block}
@media(min-width:651px){
  body{background:linear-gradient(135deg,#a90f31 0%,#681d3d 27%,#3d2940 48%,#17563c 73%,#008a4b 100%);background-attachment:fixed}
  .app{border-left:1px solid var(--border);border-right:1px solid var(--border)}
}
@media(max-width:360px){
  .brand{font-size:23px}
  .action{font-size:10px;gap:4px}
  .nav-item{font-size:10px}
  .nav-item i{font-size:19px}
}
</style>
</head>

<body>

    <div class="top-actions">

<div id="toast" class="toast" role="status"></div>

<script>
"use strict";

const API_BASE = "https://freetube-backend-a222.onrender.com/api";
const TOKEN_KEY = "freetube_access_token";
const FALLBACK_AVATAR = "https://placehold.co/120x120/244b37/ffffff?text=FT";

const ADSTERRA_KEY = "ab837cf0ea9c26ae43b7bc4e05a0b5de";
const ADSTERRA_SCRIPT = "https://bicea.org/22/ab837cf0ea9c26ae43b7bc4e05a0b5de";
const AD_EVERY_POSTS = 3;

let currentUser = null;
let videos = [];
let activeCommentId = null;
let toastTimer = null;

function token(){
  try{return localStorage.getItem(TOKEN_KEY)||"";}
  catch(_){return "";}
}

function go(page){
  location.href = page;
}

function goCreate(){
  if(!requireLogin())return;
  go("create.html");
}

function requireLogin(){
  if(token())return true;
  location.href = "auth.html?mode=login";
  return false;
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

function number(value){
  const n = Number(value);
  return Number.isFinite(n) ? Math.max(0,n) : 0;
}

function formatCount(value){
  return number(value).toLocaleString();
}

function showToast(message){
  const el = document.getElementById("toast");
  el.textContent = String(message || "Something went wrong.");
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"),3000);
}

async function api(path, options={}){
  const headers = new Headers(options.headers || {});
  const accessToken = token();

  if(accessToken)headers.set("Authorization","Bearer "+accessToken);

  const hasFormData = options.body instanceof FormData;
  if(options.body && !hasFormData && !headers.has("Content-Type")){
    headers.set("Content-Type","application/json");
  }

  let response;
  try{
    response = await fetch(API_BASE + path,{
      ...options,
      headers,
      cache:"no-store"
    });
  }catch(_){
    throw new Error("Backend-এর সঙ্গে সংযোগ হচ্ছে না। একটু পরে আবার চেষ্টা করো।");
  }

  const raw = await response.text();
  let data = {};
  try{data = raw ? JSON.parse(raw) : {};}
  catch(_){data = {message:raw};}

  if(response.status === 401){
    try{localStorage.removeItem(TOKEN_KEY);}catch(_){}
    location.href = "auth.html?mode=login";
    throw new Error("Login session শেষ হয়েছে। আবার লগইন করো।");
  }

  if(!response.ok){
    throw new Error(data.message || data.error || ("API error: "+response.status));
  }

  return data;
}

async function loadMe(){
  const data = await api("/auth/me");
  currentUser = data.user || data;
  const avatar = currentUser.avatar_url ||
    currentUser.avatar || FALLBACK_AVATAR;

  document.getElementById("composerAvatar").src = avatar;
  document.getElementById("composerAvatar").onerror = function(){
    this.onerror = null;
    this.src = FALLBACK_AVATAR;
  };

  if(String(currentUser.role || "").toLowerCase() === "admin"){
    document.getElementById("adminButton").hidden = false;
  }
}

function normalizePost(post){
  const mediaUrl = post.media_url || post.mediaUrl || post.src || "";
  let mediaType = String(post.media_type || post.type || "").toLowerCase();

  if(!mediaType && mediaUrl){
    mediaType = /\.(mp4|webm|mov|m4v)(\?|$)/i.test(mediaUrl) ? "video" : "image";
  }
  if(mediaType === "photo")mediaType = "image";

  return {
    id:String(post.id ?? post.post_id ?? ""),
    userId:String(post.user_id ?? post.author_id ?? post.owner_id ?? ""),
    username:post.display_name || post.username || post.author_name || "FreeTube User",
    avatar:post.avatar_url || post.avatar || post.profile_picture || FALLBACK_AVATAR,
    content:post.content || post.text || "",
    src:mediaUrl,
    type:mediaType,
    likes:number(post.like_count ?? post.likes_count ?? post.likes),
    comments:number(post.comment_count ?? post.comments_count ?? post.comments),
    views:number(post.view_count ?? post.views_count ?? post.views),
    liked:Boolean(post.liked ?? post.is_liked ?? post.user_liked),
    createdAt:post.created_at || post.createdAt || post.time || ""
  };
}

function formatTime(value){
  if(!value)return "Recently";
  const date = new Date(value);
  if(Number.isNaN(date.getTime()))return String(value);
  const diff = Math.max(0,Date.now()-date.getTime());
  const mins = Math.floor(diff/60000);
  if(mins<1)return "Just now";
  if(mins<60)return mins+"m ago";
  const hours = Math.floor(mins/60);
  if(hours<24)return hours+"h ago";
  const days = Math.floor(hours/24);
  if(days<7)return days+"d ago";
  return date.toLocaleDateString();
}

function isOwner(post){
  return currentUser &&
    String(currentUser.id ?? currentUser.user_id ?? "") === post.userId;
}

function isAdmin(){
  return String(currentUser?.role || "").toLowerCase() === "admin";
}

function adBannerHTML(index){
  return `
    <aside class="ad-card" aria-label="Advertisement">
      <div class="ad-label">ADVERTISEMENT</div>
      <div class="ad-slot" id="ad-slot-${index}">
        <span style="font-size:11px;color:var(--muted)">Ad loading…</span>
      </div>
    </aside>`;
}

function loadAdsterraBanner(slot){
  if(!slot || slot.dataset.loaded === "1")return;
  slot.dataset.loaded = "1";

  const frame = document.createElement("iframe");
  frame.title = "Advertisement";
  frame.width = "320";
  frame.height = "50";
  frame.loading = "lazy";
  frame.setAttribute("scrolling","no");
  frame.setAttribute("frameborder","0");
  frame.style.cssText = "width:320px;height:50px;max-width:100%;border:0;display:block";
  slot.replaceChildren(frame);

  frame.srcdoc =
    '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<style>html,body{margin:0;padding:0;width:320px;height:50px;overflow:hidden;background:transparent}</style>' +
    '</head><body><script>var atOptions={key:"' + ADSTERRA_KEY +
    '",format:"iframe",height:50,width:320,params:{}};<\\/script>' +
    '<script src="' + ADSTERRA_SCRIPT + '"><\\/script></body></html>';
}

function setupAdSlots(){
  document.querySelectorAll(".ad-slot").forEach(slot=>{
    if("IntersectionObserver" in window){
      const observer = new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            loadAdsterraBanner(entry.target);
            observer.unobserve(entry.target);
          }
        });
      },{rootMargin:"180px"});
      observer.observe(slot);
    }else{
      loadAdsterraBanner(slot);
    }
  });
}

function renderFeed(){
  const feed = document.getElementById("feed");

  if(!videos.length){
    feed.innerHTML = '<div class="empty">No posts yet. Be the first to share something!</div>';
    return;
  }

  feed.innerHTML = videos.map((post,index)=>{
    let media = "";

    if(post.src && post.type === "video"){
      media = `
        <div class="media">
          <video class="post-video" src="${esc(post.src)}" controls muted loop
            playsinline webkit-playsinline preload="metadata"></video>
          <button class="sound-btn" onclick="toggleSound(this)" aria-label="Toggle sound">
            <i class="fa-solid fa-volume-xmark"></i>
          </button>
        </div>`;
    }else if(post.src && post.type === "image"){
      media = `
        <div class="media">
          <img src="${esc(post.src)}" alt="Post image" loading="lazy"
            onerror="this.style.display='none'">
        </div>`;
    }

    const deleteButton = (isOwner(post) || isAdmin())
      ? `<button class="action delete" onclick="deletePost('${esc(post.id)}')">
           <i class="fa-solid fa-trash"></i><span>Delete</span>
         </button>`
      : `<button class="action" onclick="reportPost('${esc(post.id)}')">
           <i class="fa-regular fa-flag"></i><span>Report</span>
         </button>`;

    const card = `
      <article class="post" id="post-${esc(post.id)}">
        <header class="post-header">
          <img class="avatar" src="${esc(post.avatar)}" alt=""
            onerror="this.onerror=null;this.src='${FALLBACK_AVATAR}'">
          <div class="post-user">
            <div class="post-name">${esc(post.username)}</div>
            <div class="post-time">${esc(formatTime(post.createdAt))} ·
              <i class="fa-solid fa-earth-americas"></i>
            </div>
          </div>
          <button class="post-menu" onclick="postOptions('${esc(post.id)}')" aria-label="Post options">
            <i class="fa-solid fa-ellipsis"></i>
          </button>
        </header>
        ${post.content ? `<div class="post-text">${esc(post.content)}</div>` : ""}
        ${media}
        <div class="post-stats">
          <span><i class="fa-solid fa-thumbs-up"></i> ${formatCount(post.likes)} likes</span>
          <span><i class="fa-regular fa-eye"></i> ${formatCount(post.views)} views</span>
          <span>${formatCount(post.comments)} comments</span>
        </div>
        <div class="post-actions">
          <button class="action ${post.liked ? "liked" : ""}" onclick="likePost('${esc(post.id)}')">
            <i class="fa-solid fa-thumbs-up"></i><span>${post.liked ? "Liked" : "Like"}</span>
          </button>
          <button class="action" onclick="openComments('${esc(post.id)}')">
            <i class="fa-regular fa-comment"></i><span>Comment</span>
          </button>
          <button class="action" onclick="sharePost('${esc(post.id)}')">
            <i class="fa-solid fa-share"></i><span>Share</span>
          </button>
          ${deleteButton}
        </div>
      </article>`;

    return card + (
      (index+1) % AD_EVERY_POSTS === 0 && index < videos.length-1
        ? adBannerHTML(index+1) : ""
    );
  }).join("");

  setupAdSlots();
}

async function loadFeed(){
  const feed = document.getElementById("feed");
  feed.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading posts...</div>';

  try{
    const data = await api("/posts");
    const posts = Array.isArray(data) ? data : (data.posts || data.items || []);
    videos = posts.map(normalizePost).filter(post=>post.id);
    renderFeed();
  }catch(error){
    feed.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p style="margin:10px 0">${esc(error.message || "Could not load posts.")}</p>
        <button class="secondary" onclick="loadFeed()">Retry connection</button>
      </div>`;
  }
}

function toggleSound(button){
  const video = button.closest(".media")?.querySelector("video");
  if(!video)return;
  video.muted = !video.muted;
  button.innerHTML = video.muted
    ? '<i class="fa-solid fa-volume-xmark"></i>'
    : '<i class="fa-solid fa-volume-high"></i>';
}

function postOptions(id){
  const post = videos.find(item=>item.id===String(id));
  if(!post)return;

  if(isOwner(post) || isAdmin()){
    if(confirm("Delete this post?"))deletePost(id);
  }else{
    reportPost(id);
  }
}

async function likePost(id){
  if(!requireLogin())return;

  try{
    const data = await api("/posts/"+encodeURIComponent(id)+"/like",{
      method:"POST",body:JSON.stringify({})
    });

    const post = videos.find(item=>item.id===String(id));
    if(post){
      post.liked = Boolean(data.liked);
      post.likes = number(data.like_count ?? data.likes_count ?? post.likes);
      renderFeed();
    }
  }catch(error){
    showToast(error.message);
  }
}

async function deletePost(id){
  if(!requireLogin())return;
  if(!confirm("Delete this post? This cannot be undone."))return;

  try{
    await api("/posts/"+encodeURIComponent(id),{method:"DELETE"});
    videos = videos.filter(post=>post.id!==String(id));
    renderFeed();
    showToast("Post deleted.");
  }catch(error){
    showToast(error.message || "Could not delete post.");
  }
}

async function reportPost(id){
  if(!requireLogin())return;

  const reason = prompt("Why are you reporting this post?");
  if(reason === null)return;
  if(reason.trim().length < 3){
    showToast("Please enter a reason for the report.");
    return;
  }

  try{
    await api("/posts/"+encodeURIComponent(id)+"/report",{
      method:"POST",
      body:JSON.stringify({reason:reason.trim()})
    });
    showToast("Report sent to Admin.");
  }catch(error){
    showToast(error.message || "Could not submit report.");
  }
}

async function sharePost(id){
  const post = videos.find(item=>item.id===String(id));
  if(!post)return;

  const url = location.origin + location.pathname + "#post-" + encodeURIComponent(id);

  try{
    if(navigator.share){
      await navigator.share({
        title:"FreeTube — "+post.username,
        text:post.content || "Watch this post on FreeTube",
        url
      });
    }else if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(url);
      showToast("Post link copied.");
    }else{
      prompt("Copy this post link:",url);
    }
  }catch(error){
    if(error.name !== "AbortError")showToast("Unable to share post.");
  }
}

async function openComments(id){
  if(!requireLogin())return;

  activeCommentId = String(id);
  document.getElementById("commentList").innerHTML =
    '<div class="loading">Loading comments...</div>';
  document.getElementById("commentInput").value = "";
  document.getElementById("commentModal").classList.add("open");

  try{
    const data = await api("/posts/"+encodeURIComponent(id)+"/comments");
    const comments = data.comments || [];

    document.getElementById("commentList").innerHTML = comments.length
      ? comments.map(comment=>`
          <div class="comment">
            <strong>${esc(comment.display_name || comment.username || "User")}</strong>
            <div>${esc(comment.content || comment.text || "")}</div>
          </div>`).join("")
      : '<div class="empty">No comments yet.</div>';
  }catch(error){
    document.getElementById("commentList").innerHTML =
      `<div class="empty">${esc(error.message)}</div>`;
  }
}

document.getElementById("commentForm").addEventListener("submit",async event=>{
  event.preventDefault();
  if(!requireLogin() || !activeCommentId)return;

  const input = document.getElementById("commentInput");
  const content = input.value.trim();
  if(!content)return;

  const button = event.submitter;
  if(button)button.disabled = true;

  try{
    await api("/posts/"+encodeURIComponent(activeCommentId)+"/comments",{
      method:"POST",body:JSON.stringify({content})
    });
    const post = videos.find(item=>item.id===activeCommentId);
    if(post)post.comments++;
    input.value = "";
    await openComments(activeCommentId);
    renderFeed();
    showToast("Comment added.");
  }catch(error){
    showToast(error.message || "Could not add comment.");
  }finally{
    if(button)button.disabled = false;
  }
});

function closeModal(id){
  document.getElementById(id)?.classList.remove("open");
}

function openAdmin(){
  if(!requireLogin())return;
  if(!isAdmin()){
    showToast("Admin access required.");
    return;
  }
  go("admin.html");
}

async function initialize(){
  if(!token()){
    location.replace("auth.html?mode=login");
    return;
  }

  try{
    await loadMe();
    await loadFeed();
  }catch(error){
    showToast(error.message || "Unable to initialize FreeTube.");
  }
}

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    document.querySelectorAll(".post-video").forEach(video=>video.pause());
  }
});

initialize();
</script>
</body>
