
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171329">
<title>Boys vs Girls - Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --green: #35c7ff;
  --red: #f22e9b;
  --panel: rgba(25,23,48,.96);
  --border: rgba(255,255,255,.14);
  --muted: rgba(224,220,245,.76);
  --blue: #278bff;
  --pink: #f22e9b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", Tahoma, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: linear-gradient(135deg,#11172e,#251536,#40163b,#111329);
  background-attachment: fixed;
  color: #fff;
  min-height: 100vh;
}

button,input,textarea {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
  border: 0;
}

button:focus-visible,
a:focus-visible {
  outline: 2px solid #35c7ff;
  outline-offset: 2px;
}

.app {
  max-width: 480px;
  margin: auto;
  min-height: 100dvh;
  padding-bottom: 90px;
  background: #17132922;
  box-shadow: 0 0 40px #0005;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(20,18,39,.97);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
}

.brand {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -.6px;
  white-space: nowrap;
}

.brand i {
  color: var(--pink);
  margin-right: 4px;
}

.brand span {
  color: var(--red);
}

.top-actions {
  display: flex;
  gap: 10px;
}

.icon-btn {
  position: relative;
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border-radius: 50%;
  background: linear-gradient(145deg,#ffffff12,#a33cff20);
  border: 1px solid #ffffff2a;
  display: grid;
  place-items: center;
  font-size: 18px;
}

.heart-btn {
  color: #f22e9b;
}

.badge {
  position: absolute;
  top: -3px;
  right: -3px;
  background: var(--red);
  font-size: 9px;
  font-weight: bold;
  padding: 2px 5px;
  border-radius: 12px;
  border: 1px solid #171329;
}

.composer {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.fake-input {
  flex: 1;
  padding: 11px 15px;
  border: 1px solid var(--border);
  border-radius: 24px;
  background: #ffffff0b;
  color: var(--muted);
  font-size: 14px;
}

.fake-input i {
  float: right;
  color: var(--pink);
  font-size: 18px;
}

.stories {
  display: flex;
  gap: 10px;
  padding: 12px 15px;
  overflow-x: auto;
  background: rgba(30,26,55,.72);
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}

.stories::-webkit-scrollbar {
  display: none;
}

.story {
  position: relative;
  flex: 0 0 145px;
  height: 210px;
  border-radius: 22px;
  overflow: hidden;
  background: linear-gradient(145deg,#2947c7,#b21a92);
  border: 1px solid #d66cff99;
  display: flex;
  align-items: flex-end;
  padding: 12px;
  text-align: left;
  color: #fff;
}

.story > img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.story:after {
  content: "";
  position: absolute;
  inset: 35% 0 0;
  background: linear-gradient(transparent,#09071bdc);
}

.story > span:last-child {
  position: relative;
  z-index: 1;
  font-size: 15px;
  font-weight: 800;
  text-shadow: 0 1px 4px #000;
}

.story .story-avatar {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  padding: 3px;
  background: #f22e9b;
  z-index: 2;
}

.story .story-avatar img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.story.create {
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 12px;
  text-align: center;
  background: linear-gradient(145deg,#2947c7,#b21a92);
  cursor: pointer;
}

.story.create:after {
  display: none;
}

.story.create .story-plus {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #fff;
  color: #5c2bb4;
  font-size: 25px;
}

.story.create .story-plus i {
  font-size: 25px;
}

.feed {
  padding-top: 8px;
}

.post-card {
  background: var(--panel);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}

.post-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 15px 8px;
}

.post-user-info {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.post-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.post-author {
  font-size: 14px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.blue-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #278bff;
  font-size: 13px;
  margin-left: 4px;
  vertical-align: middle;
  filter: drop-shadow(0 0 3px #278bff35);
}

.comment-author {
  font-weight: 700;
}

.post-time {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}

.profile-clickable {
  cursor: pointer;
}

.profile-clickable:active {
  opacity: .75;
}

.post-options {
  background: none;
  color: var(--muted);
  font-size: 19px;
  padding: 6px 8px;
}

.post-body-text {
  padding: 0 15px 11px;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.post-media-container {
  width: 100%;
  background: #000;
  max-height: 480px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.post-media-container img,
.post-media-container video {
  width: 100%;
  max-height: 480px;
  object-fit: contain;
  display: block;
}

.post-media-container video {
  background: #000;
}

.sound-toggle {
  position: absolute;
  z-index: 3;
  right: 12px;
  top: 12px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #000c;
  border: 1px solid #ffffff70;
  font-size: 17px;
}

.video-error-message {
  padding: 8px 15px;
  color: #ffb5b5;
  font-size: 12px;
}

.post-stats {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto auto;
  align-items: center;
  gap: 7px;
  padding: 10px 12px;
  font-size: 11px;
  color: var(--muted);
  border-bottom: 1px solid #ffffff10;
}

.post-stats > span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.post-stats .comment-count {
  text-align: center;
}

.post-stats .view-count {
  text-align: right;
}

.reaction-summary {
  display: flex;
  align-items: center;
  gap: 3px;
  min-width: 0;
}

.reaction-emoji {
  font-size: 13px;
}

.post-actions-bar {
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 4px 3px;
}

.post-action-btn {
  background: none;
  color: #ffffffd9;
  font-size: 12px;
  font-weight: 600;
  padding: 10px 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: 7px;
  min-width: 0;
  flex: 1;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

.post-action-btn:active {
  background: #ffffff10;
}

.post-action-btn.selected {
  color: #54a8ff;
}

.post-action-btn.reaction-love {
  color: #ff687e;
}

.post-action-btn.reaction-sad,
.post-action-btn.reaction-haha {
  color: #ffd166;
}

.post-action-btn.reaction-angry {
  color: #ff785c;
}

.reaction-wrap {
  position: relative;
  display: flex;
  flex: 1;
  min-width: 0;
}

.reaction-wrap > .post-action-btn {
  width: 100%;
}

.reaction-picker {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  z-index: 35;
  background: #211b38;
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 6px;
  gap: 3px;
  box-shadow: 0 5px 20px #0009;
  max-width: calc(100vw - 25px);
}

.reaction-wrap.open .reaction-picker {
  display: flex;
}

.reaction-choice {
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  border-radius: 50%;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  touch-action: manipulation;
}

.reaction-choice:active {
  background: #ffffff20;
  transform: scale(1.06);
}

.reaction-choice .emoji {
  font-size: 23px;
  line-height: 25px;
}

.reaction-choice small {
  font-size: 8px;
  color: #fff;
}

/* Updated navigation */
.bottom-nav {
  position: fixed;
  z-index: 25;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  display: flex;
  justify-content: space-around;
  align-items: center;

    110deg,
    rgba(22,20,48,.98),
    rgba(55,20,57,.98)
  );
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
}

.nav-item {
  flex: 1;
  min-width: 0;
  background: none;
  color: #c3bfd2;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 12px;
  position: relative;
  padding: 4px 0;
}

.nav-item i {
  font-size: 24px;
}

.nav-item.active {
  color: var(--pink);
}

.nav-item:active {
  opacity: .75;
}

.modal {
  display: none;
  position: fixed;
  z-index: 60;
  inset: 0;
  background: #0009;
  backdrop-filter: blur(4px);
  align-items: flex-end;
  justify-content: center;
  padding: 10px;
}

.modal.open {
  display: flex;
}

.modal-content {
  width: 100%;
  max-width: 460px;
  max-height: 88dvh;
  overflow: auto;
  background: #19172f;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 17px;
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.close {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #ffffff12;
  border: 1px solid var(--border);
}

.field {
  display: block;
  width: 100%;
  padding: 11px 12px;
  background: #ffffff0a;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: #fff;
  margin: 8px 0;
  outline: none;
  font-size: 13px;
}

.field::placeholder {
  color: #ffffff75;
}

textarea.field {
  min-height: 100px;
  resize: vertical;
}

.secondary {
  padding: 10px 13px;
  border-radius: 10px;
  background: #ffffff12;
  border: 1px solid var(--border);
  color: #fff;
  font-size: 13px;
}

.primary {
  padding: 11px 15px;
  border-radius: 10px;
  background: linear-gradient(135deg,#278bff,#9b35ff,#f22e9b);
  color: #fff;
  font-weight: 700;
}

.row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.row .field {
  flex: 1;
  min-width: 0;
}

.comment {
  padding: 10px 0;
  border-bottom: 1px solid #ffffff12;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.toast {
  position: fixed;
  z-index: 100;
  left: 50%;
  bottom: 78px;
  transform: translateX(-50%);
  display: none;
  background: #211b38;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 12px;
  text-align: center;
  max-width: 90%;
}

.toast.show {
  display: block;
}

.empty-state,
.loading {
  padding: 32px 18px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

@media (max-width: 350px) {
  .nav-item {
    font-size: 10px;
  }

  .nav-item i {
    font-size: 21px;
  }

  .post-stats {
    font-size: 9px;
    gap: 4px;
    padding: 8px 7px;
  }

  .post-action-btn {
    font-size: 11px;
    padding: 9px 3px;
  }

  .reaction-choice {
    width: 36px;
    flex-basis: 36px;
  }

  .brand {
    font-size: 18px;
  }

  .top-actions {
    gap: 5px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
  }
}
</style>
</head>

<script>
"use strict";

const API_BASE = "https://freetube-backend-a222.onrender.com/api";
const TOKEN_KEY = "freetube_access_token";
const FALLBACK_AVATAR = "https://placehold.co/120x120/244b37/ffffff?text=FT";

const REACTIONS = {
  love: {label:"Love", emoji:"❤️", className:"reaction-love"},
  angry: {label:"Angry", emoji:"😡", className:"reaction-angry"},
  sad: {label:"Sad", emoji:"😢", className:"reaction-sad"},
  haha: {label:"Haha", emoji:"😂", className:"reaction-haha"}
};

let videos = [];
let currentUser = null;
let activeCommentId = null;
let toastTimer = null;
let loading = false;

const pendingReactions = new Set();
const viewRequestsInSession = new Set();

function token() {
  return localStorage.getItem(TOKEN_KEY) || "";
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

async function api(path, options = {}) {
  const headers = {...(options.headers || {})};
  const t = token();

  if (t) headers.Authorization = "Bearer " + t;
  if (options.body && !(options.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
  }

  let response;

  try {
    response = await fetch(API_BASE + path, {
      ...options,
      headers,
      cache: "no-store"
    });
  } catch (_) {
    throw new Error("Cannot connect to Boys vs Girls server. Check your internet connection.");
  }

  const data = await response.json().catch(() => ({}));

  if (response.status === 401) {
    localStorage.removeItem(TOKEN_KEY);
    location.replace("auth.html?mode=login");
    throw new Error("Session expired. Please log in again.");
  }

  if (!response.ok) {
    throw new Error(data.error || data.message || "Request failed.");
  }

  return data;
}

function requireLogin() {
  if (!token()) {
    location.href = "auth.html?mode=login";
    return false;
  }
  return true;
}

function closeModal(id) {
  document.getElementById(id).classList.remove("open");

function findAvatar(source) {
  if (!source || typeof source !== "object") return "";

  const keys = [
    "avatar_url","avatarUrl","profile_picture","profilePicture",
    "profile_image","profileImage","photo_url","photoURL",
    "image_url","imageUrl","avatar","picture"
  ];

  for (const key of keys) {
    const v = source[key];

    if (typeof v === "string" && v.trim()) return v.trim();

    if (v && typeof v === "object") {
      const u = v.url || v.secure_url || v.src;
      if (typeof u === "string" && u.trim()) return u.trim();
    }
  }

  for (const key of ["user","author","profile","data","account"]) {
    if (source[key] && typeof source[key] === "object") {
      const found = findAvatar(source[key]);
      if (found) return found;
    }
  }

  return "";
}

function setAvatar(el, url) {
  if (!el) return;
  el.onerror = function() {
    this.onerror = null;
    this.src = FALLBACK_AVATAR;
  };
  el.src = url || FALLBACK_AVATAR;
}

function count(value) {
  const n = Number(value);
  return Number.isFinite(n) && n >= 0 ? n : 0;
}

function hasActiveBlueBadge(source) {
  if (!source || typeof source !== "object") return false;

  const status = String(
    source.blue_badge_status ||
    source.blueBadgeStatus ||
    source.blueBadge ||
    ""
  ).toLowerCase();

  if (status !== "verified" && status !== "true") return false;

  const expiry =
    source.blue_badge_expires_at ||
    source.blueBadgeExpiresAt ||
    source.badge_expires_at;

  if (expiry) {
    const expiresAt = new Date(expiry).getTime();
    if (!Number.isFinite(expiresAt) || expiresAt <= Date.now()) return false;
  }

  return true;
}

function blueBadgeHTML(source) {
  return hasActiveBlueBadge(source)
    ? ' <i class="fa-solid fa-circle-check blue-badge" title="Verified account" aria-label="Verified account"></i>'
    : "";
}

function relativeTime(date) {
  const t = new Date(date).getTime();
  if (!Number.isFinite(t)) return "Just now";

  const m = Math.max(0, Math.floor((Date.now() - t) / 60000));
  if (m < 1) return "Just now";
  if (m < 60) return m + "m ago";
  if (m < 1440) return Math.floor(m / 60) + "h ago";

  return Math.floor(m / 1440) + "d ago";
}

function normalizePost(post) {
  const author = post.user || post.author || post.profile || {};

  const profileUsername = String(
    post.author_username ||
    post.user_username ||
    post.username ||
    author.username ||
    author.handle ||
    ""
  ).trim().replace(/^@/, "");

  const displayName = String(
    post.display_name ||
    post.full_name ||
    post.fullName ||
    author.display_name ||
    author.displayName ||
    author.full_name ||
    author.fullName ||
    author.name ||
    author.username ||
    post.username ||
    "Boys vs Girls User"
  ).trim();

  const rawType = String(post.media_type || post.type || "").toLowerCase();

  const type = ["video","mp4","webm","quicktime"].includes(rawType)
    ? "video"
    : (["image","photo","png","jpg","jpeg","webp","gif"].includes(rawType)
      ? "photo" : "");

  const raw = post.reaction_counts || post.reactions_count || {};

  const counts = {
    love: count(raw.love ?? raw.loves ?? post.love_count),
    angry: count(raw.angry ?? raw.angries ?? post.angry_count),
    sad: count(raw.sad ?? raw.sads ?? post.sad_count),
    haha: count(raw.haha ?? raw.hahas ?? post.haha_count)
  };

  const myReaction = REACTIONS[post.my_reaction]
    ? post.my_reaction
    : (REACTIONS[post.reaction] ? post.reaction : null);

  return {
    ...post,
    id: String(post.id),
    username: displayName,
    profileUsername,
    authorId: post.user_id ?? post.author_id ?? author.id ?? post.userId ?? "",
    avatar: findAvatar(post) || findAvatar(author) || FALLBACK_AVATAR,
    blueBadge: hasActiveBlueBadge(post) || hasActiveBlueBadge(author),
    content: post.content || "",
    src: post.media_url || post.url || "",
    type,
    counts,
    myReaction,
    comments: count(post.comment_count ?? post.comments_count),
    views: count(post.view_count ?? post.views),
    time: relativeTime(post.created_at)
  };
}

function updateOnePost(post) {

    .find(el => el.dataset.id === String(post.id));

  if (old) {
    const temp = document.createElement("div");
    temp.innerHTML = reactionButtonHTML(post);
    old.replaceWith(temp.firstElementChild);
  }

  const c = post.counts;
  const total = count(c.love) + count(c.angry) + count(c.sad) + count(c.haha);
  const summary = card.querySelector(".reaction-summary");

  if (summary) {
    summary.innerHTML = total
      ? ((c.love ? '<span class="reaction-emoji">❤️</span>' : "") +
         (c.angry ? '<span class="reaction-emoji">😡</span>' : "") +
         (c.sad ? '<span class="reaction-emoji">😢</span>' : "") +
         (c.haha ? '<span class="reaction-emoji">😂</span>' : "") +
         '<span>' + total + '</span>')
      : '<span>0 reactions</span>';
  }
}

let holdTimer = null;
let holdPostId = null;
let holdTriggered = false;
let holdStartX = 0;
let holdStartY = 0;

function clearHold() {
  if (holdTimer) clearTimeout(holdTimer);
  holdTimer = null;
  holdPostId = null;
}

document.addEventListener("pointerdown", event => {
  const button = event.target.closest("[data-like-button]");
  if (!button || event.button === 2) return;

  clearHold();
  holdTriggered = false;
  holdPostId = button.dataset.likeButton;
  holdStartX = event.clientX;
  holdStartY = event.clientY;

  const id = holdPostId;

  holdTimer = setTimeout(() => {
    holdTriggered = true;
    showPicker(id);
  }, 450);
});

document.addEventListener("pointermove", event => {
  if (!holdTimer) return;

  if (
    Math.abs(event.clientX - holdStartX) > 12 ||
    Math.abs(event.clientY - holdStartY) > 12
  ) {
    clearHold();
  }
});

document.addEventListener("pointerup", clearHold);
document.addEventListener("pointercancel", clearHold);

document.addEventListener("click", event => {

  }, 250);
}

async function reactToPost(id, reaction) {
  const post = videos.find(v => v.id === String(id));
  if (!post) return;

  const chosen = reaction === "like" ? "love" : reaction;
  if (!REACTIONS[chosen]) return;
  if (!requireLogin() || pendingReactions.has(post.id)) return;

  pendingReactions.add(post.id);

  const oldReaction = post.myReaction;
  const oldCounts = {...post.counts};

  if (oldReaction === chosen) {
    post.myReaction = null;
    post.counts[chosen] = Math.max(0, post.counts[chosen] - 1);
  } else {
    if (oldReaction && REACTIONS[oldReaction]) {
      post.counts[oldReaction] = Math.max(0, post.counts[oldReaction] - 1);
    }

    post.myReaction = chosen;
    post.counts[chosen] = count(post.counts[chosen]) + 1;
  }

  updateOnePost(post);

  try {
    const data = await api(
      "/posts/" + encodeURIComponent(post.id) + "/reaction",
      {method:"POST", body:JSON.stringify({reaction:chosen})}
    );

    if (data.reaction !== undefined) {
      post.myReaction = REACTIONS[data.reaction] ? data.reaction : null;
    }

    if (data.reaction_counts) {
      for (const key of Object.keys(REACTIONS)) {
        post.counts[key] = count(
          data.reaction_counts[key] ??
          data.reaction_counts[key + "s"] ??
          post.counts[key]
        );
      }
    }

    updateOnePost(post);
  } catch (error) {
    post.myReaction = oldReaction;
    post.counts = oldCounts;
    updateOnePost(post);
    toast(error.message);
  } finally {
    pendingReactions.delete(post.id);
  }
}

function setupVideoAutoplay() {
  const videosOnPage = Array.from(document.querySelectorAll("#feed video.post-video"));

  videosOnPage.forEach(video => {
    video.loop = true;
    video.playsInline = true;
    video.muted = true;
    video.defaultMuted = true;

    const button = video.closest(".post-media-container")
      ?.querySelector(".sound-toggle");

    if (button && !button.dataset.bound) {
      button.dataset.bound = "1";

      button.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();

        if (video.muted) {
          videosOnPage.forEach(other => {
            if (other !== video) {
              other.muted = true;

              const b = other.closest(".post-media-container")
                ?.querySelector(".sound-toggle");

              if (b) b.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            }
          });

          video.muted = false;
          video.play().catch(() => toast("Tap the video to start playback."));
        } else {
          video.muted = true;
        }

        button.innerHTML = video.muted
          ? '<i class="fa-solid fa-volume-xmark"></i>'
          : '<i class="fa-solid fa-volume-high"></i>';
      });
    }

    if (!video.dataset.boundPlay) {
      video.dataset.boundPlay = "1";

      video.addEventListener("play", () => {
        videosOnPage.forEach(other => {
          if (other !== video && !other.paused) other.pause();
        });
      });
    }

    video.addEventListener("error", () => {
      const message = video.closest(".post-card")
        ?.querySelector(".video-error-message");

      if (message) message.hidden = false;
    });
  });

  if ("IntersectionObserver" in window) {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const video = entry.target;

        if (entry.isIntersecting && entry.intersectionRatio >= .6) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, {threshold:[0,.6]});

    videosOnPage.forEach(video => observer.observe(video));
  }
}

function setupPostViewObserver() {
  if (!("IntersectionObserver" in window)) return;

  const observer = new IntersectionObserver(entries => {
    entries.forEach(async entry => {
      if (!entry.isIntersecting || entry.intersectionRatio < .5) return;

      observer.unobserve(entry.target);

      const id = String(entry.target.dataset.id);

      if (viewRequestsInSession.has(id) || !token()) return;
      viewRequestsInSession.add(id);

      try {
        const data = await api(
          "/posts/" + encodeURIComponent(id) + "/view",
          {method:"POST", body:JSON.stringify({})}
        );

        const p = videos.find(v => v.id === id);

        if (p && data.view_count !== undefined) {
          p.views = count(data.view_count);

          const card = Array.from(document.querySelectorAll(".post-card"))
            .find(el => el.dataset.id === id);

          const label = card?.querySelector(".view-count");

          if (label) {
            label.innerHTML = '<i class="fa-solid fa-eye"></i> ' +
              p.views + ' views';
          }
        }
      } catch (_) {
        viewRequestsInSession.delete(id);
      }
    });
  }, {threshold:[.5]});

  document.querySelectorAll("#feed .post-card").forEach(card => {
    observer.observe(card);
  });
}

async function submitPost() {
  if (!requireLogin()) return;

  const button = document.getElementById("publishButton");
  const content = document.getElementById("postText").value.trim();
  const file = document.getElementById("postFile").files?.[0];

  if (!content && !file) {
    toast("Please write something or select media.");
    return;
  }

  if (file && file.size > 50 * 1024 * 1024) {
    toast("File must be smaller than 50 MB.");
    return;
  }

  const allowed = [
    "image/jpeg","image/png","image/webp","image/gif",
    "video/mp4","video/webm","video/quicktime"
  ];

  if (file && !allowed.includes(file.type)) {
    toast("Unsupported file type.");
    return;
  }

  button.disabled = true;
  button.textContent = "Publishing...";

  try {
    let media = null;

    if (file) {
      const form = new FormData();
      form.append("file", file);

      const uploaded = await api("/media/upload", {
        method:"POST",
        body:form
      });

      media = uploaded.media || uploaded;
    }

    await api("/posts", {
      method:"POST",
      body:JSON.stringify({
        content,
        media_url:media?.url || "",
        media_type:media?.resource_type ||
          (file ? (file.type.startsWith("video/") ? "video" : "image") : ""),
        media_public_id:media?.public_id || ""
      })
    });

    closeModal("uploadModal");
    await loadFeed();
    toast("Post published successfully.");
  } catch (error) {
    toast(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Publish post";
  }
}

async function sharePost(id) {
  const p = videos.find(v => v.id === String(id));
  if (!p) return;

  const url = location.href.split("#")[0] + "#post-" + encodeURIComponent(id);

  try {
    if (navigator.share) {
      await navigator.share({
        title:"Boys vs Girls post by " + p.username,
        text:p.content,
        url
      });
    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(url);
      toast("Post link copied.");
    } else {
      toast("Sharing is not supported on this device.");
    }
  } catch (error) {
    if (error.name !== "AbortError") toast("Unable to share this post.");
  }
}

function postOptions(id) {
  const p = videos.find(v => v.id === String(id));
  if (p && confirm("Share this post?")) sharePost(id);
}

function filterPosts(query) {
  const q = String(query || "").toLowerCase();

  render(videos.filter(v =>
    String(v.content).toLowerCase().includes(q) ||
    String(v.username).toLowerCase().includes(q) ||
    String(v.profileUsername).toLowerCase().includes(q)
  ));
}

function clearSearch() {
  document.getElementById("searchInput").value = "";
  render(videos);
  closeModal("discoverModal");
}

async function loadNotificationCount() {
  try {
    const data = await api("/notifications");
    const n = count(data.unread_count);
    const el = document.getElementById("notificationBadge");

    el.textContent = n > 99 ? "99+" : String(n);
    el.hidden = n === 0;
  } catch (_) {}
}

async function loadMessageCount() {
  try {
    const data = await api("/messages");

    const n = (data.conversations || []).reduce(
      (sum, item) => sum + count(item.unread_count), 0
    );

    /* This page does not display a message badge. */
    return n;
  } catch (_) {
    return 0;
  }
}

async function initialize() {
  updateActiveNavigation();

  if (!token()) {
    location.replace("auth.html?mode=login");
    return;
  }

  try {
    await loadMe();
  } catch (error) {
    toast(error.message);
    return;
  }

  await loadFeed();
  await Promise.all([
    loadNotificationCount(),
    loadMessageCount()
  ]);
}

window.addEventListener("focus", () => {
  updateActiveNavigation();

  if (token()) {
    loadFeed();
    loadNotificationCount();
    loadMessageCount();
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    document.querySelectorAll("#feed video").forEach(v => v.pause());
  }
});

updateActiveNavigation();
initialize();
</script>
</body>
</html>
