<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171329">
<title>Boys vs Girls - Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--green:#35c7ff;--red:#f22e9b;--panel:rgba(25,23,48,.96);--border:rgba(255,255,255,.14);--muted:rgba(224,220,245,.76);--blue:#278bff;--pink:#f22e9b}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html{min-height:100%;overscroll-behavior-y:contain}
body{background:linear-gradient(135deg,#11172e,#251536,#40163b,#111329);background-attachment:fixed;color:#fff;min-height:100vh;overscroll-behavior-y:contain}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit;border:0}
button:focus-visible{outline:2px solid #35c7ff;outline-offset:2px}
.app{max-width:650px;margin:auto;min-height:100dvh;padding-bottom:68px;background:#17132922;box-shadow:0 0 40px #0005}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(20,18,39,.97);backdrop-filter:blur(15px);border-bottom:1px solid var(--border)}
.brand{font-size:22px;font-weight:900;letter-spacing:-.6px;white-space:nowrap}
.brand-boys,.brand-girls{background:linear-gradient(90deg,#278bff,#a33cff,#f22e9b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-vs{display:inline-block;margin:0 3px;font-size:.62em;font-weight:900;background:linear-gradient(90deg,#ff2d2d,#35c759);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transform:rotate(-35deg);position:relative;top:-2px}
.top-actions{display:flex;gap:9px}
.icon-btn{position:relative;width:44px;height:44px;flex-shrink:0;border-radius:50%;background:linear-gradient(145deg,#ffffff12,#a33cff20);border:1px solid #ffffff2a;display:grid;place-items:center;font-size:20px}
.heart-btn{color:#f22e9b}
.badge{position:absolute;top:-3px;right:-3px;background:var(--red);font-size:9px;font-weight:bold;padding:2px 5px;border-radius:12px;border:1px solid #171329}
.composer{display:flex;align-items:center;gap:11px;padding:10px 15px;background:var(--panel);border-bottom:1px solid var(--border);cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
.fake-input{flex:1;padding:11px 15px;border:1px solid var(--border);border-radius:24px;background:#ffffff0b;color:var(--muted);font-size:14px}
.fake-input i{float:right;color:var(--pink);font-size:18px}
.story-section{background:rgba(30,26,55,.72);border-bottom:1px solid var(--border);padding:12px 0 13px}
.story-heading{display:flex;align-items:center;justify-content:space-between;padding:0 15px 10px}
.story-heading strong{font-size:15px}
.story-heading button{background:none;color:#8fc5ff;font-size:12px}
.stories{display:flex;gap:11px;padding:0 15px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.stories::-webkit-scrollbar{display:none}
.story-card{position:relative;flex:0 0 112px;height:174px;border-radius:16px;overflow:hidden;background:#292345;border:1px solid #ffffff25;cursor:pointer;text-align:left;color:white}
.story-card>img.story-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story-card:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#09071bf2)}
.story-card .story-name{position:absolute;z-index:2;left:9px;right:7px;bottom:10px;font-size:12px;font-weight:800;line-height:1.25;text-shadow:0 1px 5px #000;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.story-ring{position:absolute;z-index:3;top:9px;left:9px;width:39px;height:39px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#278bff,#a33cff,#f22e9b)}
.story-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid #211b38}
.story-card.unseen .story-ring{background:linear-gradient(135deg,#278bff,#f22e9b)}
.story-card.seen .story-ring{background:#888}
.story-card.create-story{background:#282341;display:flex;flex-direction:column}
.story-card.create-story:after{display:none}
.create-cover{height:112px;background:linear-gradient(145deg,#2947c7,#b21a92);display:grid;place-items:center}
.create-cover img{width:100%;height:100%;object-fit:cover;opacity:.75}
.create-plus{position:absolute;z-index:3;top:91px;left:50%;transform:translateX(-50%);width:39px;height:39px;border:4px solid #282341;border-radius:50%;background:#278bff;display:grid;place-items:center;font-size:17px}
.create-label{flex:1;display:grid;place-items:end center;padding:0 4px 10px;font-size:12px;font-weight:800}
.story-card.text-cover{background:linear-gradient(145deg,#4724a5,#c02c89)}
.story-card.text-cover .text-preview{position:absolute;inset:50px 9px 42px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:900;overflow:hidden;overflow-wrap:anywhere}
.story-empty{padding:10px 15px;color:var(--muted);font-size:12px;white-space:nowrap}
.feed{padding-top:8px}
.post-card{background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:10px}
.ad-banner-slot{width:100%;min-height:50px;margin:6px 0 10px;padding:4px 0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#171329aa;border-top:1px solid #ffffff0b;border-bottom:1px solid #ffffff0b}
.ad-banner-label{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ad-banner-slot iframe{max-width:100%;border:0}
.post-header{display:flex;align-items:center;justify-content:space-between;padding:12px 15px 8px}
.post-user-info{display:flex;align-items:center;gap:10px;min-width:0}
.post-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
.post-author{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.blue-badge{display:inline-flex;align-items:center;justify-content:center;color:#278bff;font-size:13px;margin-left:4px;vertical-align:middle;filter:drop-shadow(0 0 3px #278bff35)}
.comment-author{font-weight:700}
.post-time{font-size:11px;color:var(--muted);margin-top:4px}
.profile-clickable{cursor:pointer}.profile-clickable:active{opacity:.75}
.post-options{background:none;color:var(--muted);font-size:19px;padding:6px 8px}
.post-body-text{padding:0 15px 11px;font-size:14px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.post-media-container{width:100%;background:#000;max-height:480px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.post-media-container img,.post-media-container video{width:100%;max-height:480px;object-fit:contain;display:block}
.post-media-container video{background:#000}
.sound-toggle{position:absolute;z-index:3;right:12px;top:12px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#000c;border:1px solid #ffffff70;font-size:17px}
.video-error-message{padding:8px 15px;color:#ffb5b5;font-size:12px}
.post-stats{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:7px;padding:10px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid #ffffff10}
.post-stats>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-stats .comment-count{text-align:center}.post-stats .view-count{text-align:right}
.reaction-summary{display:flex;align-items:center;gap:3px;min-width:0}
.reaction-emoji{font-size:13px}
.post-actions-bar{display:flex;align-items:center;justify-content:space-around;padding:4px 3px}
.post-action-btn{background:none;color:#ffffffd9;font-size:12px;font-weight:600;padding:10px 5px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:7px;min-width:0;flex:1;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.post-action-btn:active{background:#ffffff10}
.post-action-btn.selected{color:#54a8ff}
.post-action-btn.reaction-love{color:#ff687e}.post-action-btn.reaction-sad{color:#ffd166}.post-action-btn.reaction-angry{color:#ff785c}.post-action-btn.reaction-haha{color:#ffd166}
.reaction-wrap{position:relative;display:flex;flex:1;min-width:0}
.reaction-wrap>.post-action-btn{width:100%}
.reaction-picker{display:none;position:absolute;bottom:calc(100% + 6px);left:0;z-index:35;background:#211b38;border:1px solid var(--border);border-radius:28px;padding:6px;gap:3px;box-shadow:0 5px 20px #0009;max-width:calc(100vw - 25px)}
.reaction-wrap.open .reaction-picker{display:flex}
.reaction-choice{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;touch-action:manipulation}
.reaction-choice:active{background:#ffffff20;transform:scale(1.06)}
.reaction-choice .emoji{font-size:23px;line-height:25px}.reaction-choice small{font-size:8px;color:#fff}
.bottom-nav{position:fixed;z-index:25;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:650px;display:flex;justify-content:space-around;align-items:center;height:60px;padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:linear-gradient(110deg,rgba(22,20,48,.98),rgba(55,20,57,.98));backdrop-filter:blur(16px);border-top:1px solid var(--border)}
.nav-item{background:none;color:#c3bfd2;display:flex;flex:1;min-width:0;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;position:relative;padding:2px 0;white-space:nowrap}
.nav-item i{font-size:21px}.nav-item.active{color:var(--pink)}.nav-item.active i{filter:drop-shadow(0 0 7px #f22e9b55)}.nav-item .badge{top:0;right:calc(50% - 22px)}
.modal{display:none;position:fixed;z-index:60;inset:0;background:#0009;backdrop-filter:blur(4px);align-items:flex-end;justify-content:center;padding:10px}
.modal.open{display:flex}
.modal-content{width:100%;max-width:460px;max-height:88dvh;overflow:auto;background:#19172f;border:1px solid var(--border);border-radius:18px;padding:17px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.close{width:34px;height:34px;border-radius:50%;background:#ffffff12;border:1px solid var(--border)}
.field{display:block;width:100%;padding:11px 12px;background:#ffffff0a;border:1px solid var(--border);border-radius:10px;color:#fff;margin:8px 0;outline:none;font-size:13px}
.field::placeholder{color:#ffffff75}textarea.field{min-height:100px;resize:vertical}
.secondary{padding:10px 13px;border-radius:10px;background:#ffffff12;border:1px solid var(--border);color:#fff;font-size:13px}
.primary{padding:11px 15px;border-radius:10px;background:linear-gradient(135deg,#278bff,#9b35ff,#f22e9b);color:#fff;font-weight:700}
.row{display:flex;gap:8px;align-items:center}.row .field{flex:1;min-width:0}
.comment{padding:10px 0;border-bottom:1px solid #ffffff12;font-size:12px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.toast{position:fixed;z-index:100;left:50%;bottom:68px;transform:translateX(-50%);display:none;background:#211b38;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:12px;text-align:center;max-width:90%}
.toast.show{display:block}.empty-state,.loading{padding:32px 18px;text-align:center;color:var(--muted);font-size:13px}
.story-viewer{display:none;position:fixed;z-index:120;inset:0;background:#090812;align-items:center;justify-content:center}
.story-viewer.open{display:flex}
.story-viewer-inner{position:relative;width:100%;height:100%;max-width:650px;max-height:100dvh;background:#100d1b;overflow:hidden;display:flex;flex-direction:column}
.story-viewer-media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#090812}
.story-viewer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:35px;text-align:center;font-size:30px;font-weight:900;overflow-wrap:anywhere;white-space:pre-wrap}
.story-viewer-shade{position:absolute;inset:0;background:linear-gradient(#0009,transparent 22%,transparent 70%,#0009);pointer-events:none}
.story-progress{position:absolute;z-index:4;top:10px;left:10px;right:10px;display:flex;gap:4px}
.story-progress span{height:3px;flex:1;border-radius:5px;background:#ffffff55;overflow:hidden}
.story-progress span i{display:block;width:0;height:100%;background:#fff}
.story-viewer-header{position:absolute;z-index:5;top:22px;left:13px;right:12px;display:flex;align-items:center;gap:9px}
.story-viewer-header img{width:39px;height:39px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.story-viewer-user{flex:1;min-width:0;text-shadow:0 1px 4px #000}
.story-viewer-user strong{font-size:13px;display:block}
.story-viewer-user small{font-size:10px;color:#eee}
.story-viewer-header button{width:37px;height:37px;border-radius:50%;background:#0007;font-size:18px}
.story-tap-left,.story-tap-right{position:absolute;z-index:3;top:90px;bottom:70px;width:35%;background:transparent}
.story-tap-left{left:0}.story-tap-right{right:0}
.story-caption{position:absolute;z-index:5;left:18px;right:18px;bottom:28px;text-align:center;font-size:14px;text-shadow:0 2px 5px #000;white-space:pre-wrap;overflow-wrap:anywhere}
.story-viewer-close{position:absolute;z-index:8;right:12px;top:20px}
.story-viewer-close button{width:38px;height:38px;border-radius:50%;background:#0008;font-size:20px}
.refresh-indicator{position:fixed;z-index:80;top:8px;left:50%;transform:translate(-50%,-55px);width:38px;height:38px;display:grid;place-items:center;background:#211b38;color:#f22e9b;border:1px solid var(--border);border-radius:50%;box-shadow:0 3px 12px #0006;transition:transform .18s ease;pointer-events:none}
.refresh-indicator.visible{transform:translate(-50%,0)}.refresh-indicator.refreshing i{animation:refresh-spin .7s linear infinite}
@keyframes refresh-spin{to{transform:rotate(360deg)}}
@media(max-width:350px){.brand{font-size:19px}.topbar{padding:8px 10px}.icon-btn{width:39px;height:39px;font-size:18px}.nav-item{font-size:10px}.nav-item i{font-size:19px}.post-stats{font-size:9px;gap:4px;padding:8px 7px}.post-action-btn{font-size:11px;padding:9px 3px}.reaction-choice{width:36px;flex-basis:36px}.story-card{flex-basis:100px;height:160px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand" aria-label="Boys vs Girls">
    <span class="brand-boys">Bᴏʏs</span><span class="brand-vs">vs</span><span class="brand-girls">Gɪʀʟs</span>
  </div>
  <div class="top-actions">
    <button class="icon-btn" onclick="openAdminOrSecurity()" aria-label="Admin or security"><i class="fa-solid fa-shield-halved"></i></button>
    <button class="icon-btn heart-btn" onclick="openInbox()" aria-label="Inbox"><i class="fa-solid fa-heart"></i></button>
  </div>
</header>
<div class="composer" onclick="openCreatePost()">
  <img id="composerAvatar" class="avatar" src="https://placehold.co/120x120/244b37/ffffff?text=FT" alt="Avatar">
  <div class="fake-input">What's on your mind? <i class="fa-solid fa-photo-film"></i></div>
</div>
<section class="story-section">
  <div class="story-heading">
    <strong><i class="fa-solid fa-circle-play" style="color:#f22e9b"></i> Stories</strong>
    <button onclick="loadStories()">Refresh <i class="fa-solid fa-rotate"></i></button>
  </div>
  <div class="stories" id="stories">
    <button class="story-card create-story" onclick="openCreateStory()">
      <div class="create-cover"><img id="createStoryAvatar" src="https://placehold.co/120x120/244b37/ffffff?text=FT" alt=""></div>
      <span class="create-plus"><i class="fa-solid fa-plus"></i></span>
      <span class="create-label">Create story</span>
    </button>
    <div class="story-empty">Loading stories...</div>
  </div>
</section>
<main id="feed" class="feed"><div class="loading">Loading posts...</div></main>
<nav class="bottom-nav" aria-label="Main navigation">
  <button id="navHome" class="nav-item active" onclick="home()" aria-current="page"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button id="navPulse" class="nav-item" onclick="openPulse()"><i class="fa-solid fa-compass"></i><span>Pulse</span></button>
  <button id="navNotifications" class="nav-item" onclick="openNotifications()"><i class="fa-solid fa-bell"></i><span id="notificationBadge" class="badge" hidden>0</span><span>Notifications</span></button>
  <button id="navProfile" class="nav-item" onclick="openProfile()"><i class="fa-regular fa-user"></i><span>Profile</span></button>
</nav>
</div>
<div id="refreshIndicator" class="refresh-indicator" aria-hidden="true"><i class="fa-solid fa-arrow-down"></i></div>
<div class="story-viewer" id="storyViewer" role="dialog" aria-modal="true" aria-label="Story viewer">
  <div class="story-viewer-inner" id="storyViewerInner">
    <img id="storyViewerImage" class="story-viewer-media" alt="Story" hidden>
    <div id="storyViewerText" class="story-viewer-text" hidden></div>
    <div class="story-viewer-shade"></div>
    <div class="story-progress" id="storyProgress"></div>
    <div class="story-viewer-header">
      <img id="storyViewerAvatar" src="https://placehold.co/120x120/244b37/ffffff?text=FT" alt="">
      <div class="story-viewer-user"><strong id="storyViewerName">User</strong><small id="storyViewerTime"></small></div>
      <button onclick="pauseStory()" aria-label="Pause story" id="storyPauseButton"><i class="fa-solid fa-pause"></i></button>
      <button onclick="closeStoryViewer()" aria-label="Close story"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <button class="story-tap-left" onclick="previousStory()" aria-label="Previous story"></button>
    <button class="story-tap-right" onclick="nextStory()" aria-label="Next story"></button>
    <div class="story-caption" id="storyViewerCaption"></div>
  </div>
</div>
<div class="modal" id="commentModal">
  <div class="modal-content">
    <div class="modal-head"><h3>Comments</h3><button class="close" onclick="closeModal('commentModal')" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="commentList"><div class="loading">Loading comments...</div></div>
    <form id="commentForm" class="row" style="margin-top:12px">
      <input id="commentInput" class="field" maxlength="2000" placeholder="Write a comment..." required style="margin:0">
      <button class="primary" type="submit">Send</button>
    </form>
  </div>
</div>
<div class="modal" id="discoverModal">
  <div class="modal-content">
    <div class="modal-head"><h3>Discover Boys vs Girls</h3><button class="close" onclick="closeModal('discoverModal')" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
    <input id="searchInput" class="field" placeholder="Search posts or people..." oninput="filterPosts(this.value)">
    <button class="secondary" onclick="clearSearch()">Show all posts</button>
    <button class="primary" style="margin-left:8px" onclick="openPulse()">Open Pulse</button>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
"use strict";
const API_BASE="https://freetube-backend-a222.onrender.com/api";
const TOKEN_KEY="freetube_access_token";
const FALLBACK_AVATAR="https://placehold.co/120x120/244b37/ffffff?text=FT";
const REACTIONS={love:{label:"Love",emoji:"❤️",className:"reaction-love"},angry:{label:"Angry",emoji:"😡",className:"reaction-angry"},sad:{label:"Sad",emoji:"😢",className:"reaction-sad"},haha:{label:"Haha",emoji:"😂",className:"reaction-haha"}};
let videos=[],currentUser=null,activeCommentId=null,toastTimer=null;
let loading=false,refreshInProgress=false;
let storyGroups=[],activeStoryGroup=0,activeStoryIndex=0;
let storyTimer=null,storyPaused=false,storyStartedAt=0,storyRemaining=6000;
const pendingReactions=new Set(),viewRequestsInSession=new Set();
function token(){try{return localStorage.getItem(TOKEN_KEY)||""}catch(_){return ""}}
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2800)}
async function api(path,options={}){
  const headers={...(options.headers||{})},t=token();if(t)headers.Authorization="Bearer "+t;
  if(options.body&&!(options.body instanceof FormData))headers["Content-Type"]="application/json";
  let response;try{response=await fetch(API_BASE+path,{...options,headers,cache:"no-store"})}catch(_){throw new Error("Cannot connect to Boys vs Girls server. Check your internet connection.")}
  const data=await response.json().catch(()=>({}));
  if(response.status===401){try{localStorage.removeItem(TOKEN_KEY)}catch(_){}location.replace("auth.html?mode=login");throw new Error("Session expired. Please log in again.")}
  if(!response.ok)throw new Error(data.error||data.message||"Request failed.");return data;
}
function requireLogin(){if(!token()){location.href="auth.html?mode=login";return false}return true}
function closeModal(id){document.getElementById(id)?.classList.remove("open")}
function setActiveNav(id){document.querySelectorAll(".bottom-nav .nav-item").forEach(item=>{const active=item.id===id;item.classList.toggle("active",active);if(active)item.setAttribute("aria-current","page");else item.removeAttribute("aria-current")})}
function home(){setActiveNav("navHome");if(location.pathname.endsWith("/home.html")||location.pathname==="/home.html"){render(videos);window.scrollTo({top:0,behavior:"smooth"})}else location.href="home.html"}
function openPulse(){setActiveNav("navPulse");location.href="discover.html"}
function openProfile(){if(requireLogin())location.href="profile.html"}
function openInbox(){if(requireLogin())location.href="inbox.html"}
function openNotifications(){if(requireLogin())location.href="notifications.html"}
function openFavorites(){if(requireLogin())location.href="favorites.html"}
function openCreatePost(){if(requireLogin())location.href="create.html"}
function openCreateStory(){if(requireLogin())location.href="story.html"}
function openAdminOrSecurity(){if(!requireLogin())return;location.href=String(currentUser?.role||"").toLowerCase()==="admin"?"admin.html":"settings.html"}
function findAvatar(source){
  if(!source||typeof source!=="object")return "";
  const keys=["avatar_url","avatarUrl","profile_picture","profilePicture","profile_image","profileImage","photo_url","photoURL","image_url","imageUrl","avatar","picture"];
  for(const key of keys){const v=source[key];if(typeof v==="string"&&v.trim())return v.trim();if(v&&typeof v==="object"){const u=v.url||v.secure_url||v.src;if(typeof u==="string"&&u.trim())return u.trim()}}
  for(const key of ["user","author","profile","data","account"]){if(source[key]&&typeof source[key]==="object"){const found=findAvatar(source[key]);if(found)return found}}
  return "";
}
function setAvatar(el,url){if(!el)return;el.onerror=function(){this.onerror=null;this.src=FALLBACK_AVATAR};el.src=url||FALLBACK_AVATAR}
function count(value){const n=Number(value);return Number.isFinite(n)&&n>=0?n:0}
function hasActiveBlueBadge(source){
  if(!source||typeof source!=="object")return false;
  const status=String(source.blue_badge_status||source.blueBadgeStatus||source.blueBadge||"").toLowerCase();if(status!=="verified"&&status!=="true")return false;
  const expiry=source.blue_badge_expires_at||source.blueBadgeExpiresAt||source.badge_expires_at;if(expiry){const t=new Date(expiry).getTime();if(!Number.isFinite(t)||t<=Date.now())return false}return true;
}
function blueBadgeHTML(source){return hasActiveBlueBadge(source)?' <i class="fa-solid fa-circle-check blue-badge" title="Verified account" aria-label="Verified account"></i>':""}
function relativeTime(date){const t=new Date(date).getTime();if(!Number.isFinite(t))return "Just now";const m=Math.max(0,Math.floor((Date.now()-t)/60000));if(m<1)return "Just now";if(m<60)return m+"m ago";if(m<1440)return Math.floor(m/60)+"h ago";return Math.floor(m/1440)+"d ago"}
function normalizePost(post){
  const author=post.user||post.author||post.profile||{};
  const profileUsername=String(post.author_username||post.user_username||post.username||author.username||author.handle||"").trim().replace(/^@/,"");
  const displayName=String(post.display_name||post.full_name||post.fullName||author.display_name||author.displayName||author.full_name||author.fullName||author.name||author.username||post.username||"Boys vs Girls User").trim();
  const rawType=String(post.media_type||post.type||"").toLowerCase();
  const type=["video","mp4","webm","quicktime"].includes(rawType)?"video":(["image","photo","png","jpg","jpeg","webp","gif"].includes(rawType)?"photo":"");
  const raw=post.reaction_counts||post.reactions_count||{};
  const counts={love:count(raw.love??raw.loves??post.love_count),angry:count(raw.angry??raw.angries??post.angry_count),sad:count(raw.sad??raw.sads??post.sad_count),haha:count(raw.haha??raw.hahas??post.haha_count)};
  const myReaction=REACTIONS[post.my_reaction]?post.my_reaction:(REACTIONS[post.reaction]?post.reaction:null);
  return {...post,id:String(post.id),username:displayName,profileUsername,authorId:post.user_id??post.author_id??author.id??post.userId??"",avatar:findAvatar(post)||findAvatar(author)||FALLBACK_AVATAR,blueBadge:hasActiveBlueBadge(post)||hasActiveBlueBadge(author),content:post.content||"",src:post.media_url||post.url||"",type,counts,myReaction,comments:count(post.comment_count??post.comments_count),views:count(post.view_count??post.views),time:relativeTime(post.created_at)};
}

/* ---------------- STORIES ---------------- */
function normalizeStory(s){
  const user=s.user||s.author||s.profile||{};
  const type=String(s.media_type||s.type||"").toLowerCase();
  const text=s.story_text||s.content||"";
  const expires=new Date(s.expires_at||s.expiresAt||Date.now()+86400000).getTime();
  const userId=s.user_id??s.userId??user.id??user.user_id??"";
  const username=String(s.display_name||user.display_name||s.username||user.username||s.handle||"Boys vs Girls User");
  return {
    id:String(s.id??s.story_id??Math.random()),
    userId:String(userId||username.toLowerCase()),
    username,handle:String(s.username||user.username||s.handle||""),
    avatar:findAvatar(s)||findAvatar(user)||FALLBACK_AVATAR,
    mediaUrl:s.media_url||s.mediaUrl||s.url||s.image_url||"",
    type:type==="text"||(!s.media_url&&!s.mediaUrl&&!s.url&&text)?"text":"image",
    text,caption:s.caption||"",background:s.background||"purple",
    createdAt:s.created_at||s.createdAt||Date.now(),expiresAt:expires,
    musicTitle:s.music_title||"",musicArtist:s.music_artist||"",seen:false
  };
}
function extractStoriesResponse(data){
  if(Array.isArray(data))return data;
  if(Array.isArray(data?.stories))return data.stories;
  if(Array.isArray(data?.data?.stories))return data.data.stories;
  if(Array.isArray(data?.data))return data.data;
  if(Array.isArray(data?.results))return data.results;
  return [];
}
function storyBackground(name){
  const colors={purple:"linear-gradient(145deg,#5523a7,#b02a91)",blue:"linear-gradient(145deg,#0756a8,#24b7dc)",pink:"linear-gradient(145deg,#a51e75,#ef5d9b)",orange:"linear-gradient(145deg,#c44d18,#f0a12b)",green:"linear-gradient(145deg,#075c46,#34b879)",black:"linear-gradient(145deg,#171329,#38334b)"};
  return colors[name]||colors.purple;
}
function groupStories(stories){
  const map=new Map();
  stories.forEach(s=>{
    if(!s||s.expiresAt<=Date.now())return;
    const key=String(s.userId||s.handle||s.username||"unknown");
    if(!map.has(key))map.set(key,{userId:key,username:s.username,handle:s.handle,avatar:s.avatar,stories:[]});
    const group=map.get(key);
    if(s.username)group.username=s.username;
    if(s.avatar)group.avatar=s.avatar;
    group.stories.push(s);
  });
  const groups=[...map.values()];
  groups.forEach(g=>g.stories.sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)));
  const myId=String(currentUser?.id??currentUser?.user_id??"");
  const myUsername=String(currentUser?.username||"").toLowerCase();
  groups.sort((a,b)=>{
    const am=(myId&&a.userId===myId)||(myUsername&&a.handle.toLowerCase()===myUsername);
    const bm=(myId&&b.userId===myId)||(myUsername&&b.handle.toLowerCase()===myUsername);
    if(am&&!bm)return -1;if(bm&&!am)return 1;
    return new Date(b.stories[b.stories.length-1]?.createdAt||0)-new Date(a.stories[a.stories.length-1]?.createdAt||0);
  });
  return groups;
}
function isMyStoryGroup(group){
  const myId=String(currentUser?.id??currentUser?.user_id??"");
  const myUsername=String(currentUser?.username||"").toLowerCase();
  return (!!myId&&group.userId===myId)|| (!!myUsername&&group.handle.toLowerCase()===myUsername);
}
function renderStories(){
  const el=document.getElementById("stories");
  const myGroup=storyGroups.find(isMyStoryGroup);
  let html='<button class="story-card create-story" onclick="openCreateStory()"><div class="create-cover"><img src="'+esc(findAvatar(currentUser)||FALLBACK_AVATAR)+'" alt=""></div><span class="create-plus"><i class="fa-solid fa-plus"></i></span><span class="create-label">'+(myGroup?"Add to story":"Create story")+'</span></button>';
  storyGroups.forEach((g,index)=>{
    const last=g.stories[g.stories.length-1];
    if(!last)return;
    const seen=g.stories.every(s=>s.seen);
    const cover=last.type==="image"&&last.mediaUrl
      ?'<img class="story-cover" src="'+esc(last.mediaUrl)+'" alt="" loading="lazy">'
      :'<div class="text-preview">'+esc(last.text||last.caption||"Story")+'</div>';
    const cls=last.type==="text"?"story-card text-cover ":"story-card ";
    html+='<button class="'+cls+(seen?"seen":"unseen")+'" onclick="openStoryGroup('+index+')">'+cover+
      '<span class="story-ring"><img src="'+esc(g.avatar)+'" alt=""></span>'+
      '<span class="story-name">'+esc(g.username)+'</span></button>';
  });
  if(!storyGroups.length)html+='<div class="story-empty">No stories yet. Be the first to share one!</div>';
  el.innerHTML=html;
}
async function loadStories(){
  const el=document.getElementById("stories");
  try{
    const data=await api("/stories");
    const rawStories=extractStoriesResponse(data);
    const list=rawStories.map(normalizeStory);
    storyGroups=groupStories(list);
    renderStories();
    if(!rawStories.length){
      console.info("Stories API returned an empty list:",data);
    }
  }catch(error){
    console.error("Stories loading failed:",error);
    el.innerHTML='<button class="story-card create-story" onclick="openCreateStory()"><div class="create-cover"><img src="'+esc(findAvatar(currentUser)||FALLBACK_AVATAR)+'" alt=""></div><span class="create-plus"><i class="fa-solid fa-plus"></i></span><span class="create-label">Create story</span></button><div class="story-empty">Could not load stories: '+esc(error.message)+' <button onclick="loadStories()" style="color:#8fc5ff">Retry</button></div>';
  }
}
function openStoryGroup(index){
  const group=storyGroups[index];if(!group||!group.stories.length)return;
  activeStoryGroup=index;activeStoryIndex=0;storyPaused=false;storyRemaining=6000;
  document.getElementById("storyViewer").classList.add("open");
  document.body.style.overflow="hidden";showCurrentStory();
}
function showCurrentStory(){
  clearTimeout(storyTimer);
  const group=storyGroups[activeStoryGroup];if(!group){closeStoryViewer();return}
  const story=group.stories[activeStoryIndex];if(!story){nextStoryGroup();return}
  if(story.expiresAt<=Date.now()){nextStory();return}
  const image=document.getElementById("storyViewerImage"),text=document.getElementById("storyViewerText");
  image.hidden=true;text.hidden=true;
  if(story.type==="image"&&story.mediaUrl){
    image.src=story.mediaUrl;image.hidden=false;
    image.onerror=()=>{image.hidden=true;text.hidden=false;text.textContent="This story could not be loaded."};
  }else{text.textContent=story.text||story.caption||"";text.style.background=storyBackground(story.background);text.hidden=false}
  document.getElementById("storyViewerName").textContent=group.username;
  setAvatar(document.getElementById("storyViewerAvatar"),group.avatar);
  document.getElementById("storyViewerTime").textContent=relativeTime(story.createdAt);

  document.getElementById("storyPauseButton").innerHTML=storyPaused?'<i class="fa-solid fa-play"></i>':'<i class="fa-solid fa-pause"></i>';
  renderStoryProgress();if(!storyPaused)startStoryTimer();
}
function renderStoryProgress(){
  const group=storyGroups[activeStoryGroup];if(!group)return;
  document.getElementById("storyProgress").innerHTML=group.stories.map((s,i)=>'<span><i style="width:'+(i<activeStoryIndex?"100%":"0")+'"></i></span>').join("");
}
function startStoryTimer(){
  clearTimeout(storyTimer);storyStartedAt=Date.now();const duration=storyRemaining||6000;
  const bar=document.querySelectorAll("#storyProgress span")[activeStoryIndex]?.firstElementChild;
  if(bar){bar.style.transition="none";bar.style.width=(100-duration/6000*100)+"%";requestAnimationFrame(()=>{bar.style.transition="width "+duration+"ms linear";bar.style.width="100%"})}
  storyTimer=setTimeout(()=>nextStory(),duration);
}
function pauseStory(){
  const btn=document.getElementById("storyPauseButton");
  if(!storyPaused){storyRemaining=Math.max(0,storyRemaining-(Date.now()-storyStartedAt));clearTimeout(storyTimer);storyPaused=true;const bar=document.querySelectorAll("#storyProgress span")[activeStoryIndex]?.firstElementChild;if(bar){bar.style.transition="none";bar.style.width=(100-storyRemaining/6000*100)+"%"}}
  else storyPaused=false;
  btn.innerHTML=storyPaused?'<i class="fa-solid fa-play"></i>':'<i class="fa-solid fa-pause"></i>';
  if(!storyPaused)startStoryTimer();
}
function nextStory(){const group=storyGroups[activeStoryGroup];if(!group)return;if(activeStoryIndex<group.stories.length-1){activeStoryIndex++;storyRemaining=6000;showCurrentStory()}else nextStoryGroup()}
function previousStory(){
  if(activeStoryIndex>0){activeStoryIndex--;storyRemaining=6000;showCurrentStory()}
  else{const prev=storyGroups[activeStoryGroup-1];if(prev){activeStoryGroup--;activeStoryIndex=prev.stories.length-1;storyRemaining=6000;showCurrentStory()}}
}
function nextStoryGroup(){if(activeStoryGroup<storyGroups.length-1){activeStoryGroup++;activeStoryIndex=0;storyRemaining=6000;showCurrentStory()}else closeStoryViewer()}
function closeStoryViewer(){clearTimeout(storyTimer);storyPaused=false;storyRemaining=6000;document.getElementById("storyViewer").classList.remove("open");document.body.style.overflow="";loadStories()}
document.addEventListener("keydown",event=>{
  if(!document.getElementById("storyViewer").classList.contains("open"))return;
  if(event.key==="Escape")closeStoryViewer();if(event.key==="ArrowRight")nextStory();if(event.key==="ArrowLeft")previousStory();

async function chooseReaction(event,id,reaction){event.preventDefault();event.stopPropagation();closePickers();holdTriggered=true;await reactToPost(id,reaction);setTimeout(()=>{holdTriggered=false},250)}
async function reactToPost(id,reaction){
  const post=videos.find(v=>v.id===String(id));if(!post||!REACTIONS[reaction])return;
  if(!requireLogin()||pendingReactions.has(post.id))return;
  pendingReactions.add(post.id);const oldReaction=post.myReaction,oldCounts={...post.counts};
  if(oldReaction===reaction){post.myReaction=null;post.counts[reaction]=Math.max(0,post.counts[reaction]-1)}
  else{if(oldReaction&&REACTIONS[oldReaction])post.counts[oldReaction]=Math.max(0,post.counts[oldReaction]-1);post.myReaction=reaction;post.counts[reaction]=count(post.counts[reaction])+1}
  updateOnePost(post);
  try{
    const data=await api("/posts/"+encodeURIComponent(post.id)+"/reaction",{method:"POST",body:JSON.stringify({reaction})});
    if(data.reaction!==undefined)post.myReaction=REACTIONS[data.reaction]?data.reaction:null;
    if(data.reaction_counts)for(const key of Object.keys(REACTIONS))post.counts[key]=count(data.reaction_counts[key]??data.reaction_counts[key+"s"]??post.counts[key]);
    updateOnePost(post);
  }catch(error){post.myReaction=oldReaction;post.counts=oldCounts;updateOnePost(post);toast(error.message)}
  finally{pendingReactions.delete(post.id)}
}
function setupVideoAutoplay(){
  const videosOnPage=Array.from(document.querySelectorAll("#feed video.post-video"));
  videosOnPage.forEach(video=>{
    video.loop=true;video.playsInline=true;video.muted=true;video.defaultMuted=true;
    const button=video.closest(".post-media-container")?.querySelector(".sound-toggle");
    if(button&&!button.dataset.bound){button.dataset.bound="1";button.addEventListener("click",event=>{
      event.preventDefault();event.stopPropagation();
      if(video.muted){videosOnPage.forEach(other=>{if(other!==video){other.muted=true;const b=other.closest(".post-media-container")?.querySelector(".sound-toggle");if(b)b.innerHTML='<i class="fa-solid fa-volume-xmark"></i>'}});video.muted=false;video.play().catch(()=>toast("Tap the video to start playback."))}
      else video.muted=true;
      button.innerHTML=video.muted?'<i class="fa-solid fa-volume-xmark"></i>':'<i class="fa-solid fa-volume-high"></i>';
    })}
    if(!video.dataset.boundPlay){video.dataset.boundPlay="1";video.addEventListener("play",()=>videosOnPage.forEach(other=>{if(other!==video&&!other.paused)other.pause()}))}
  });
  if("IntersectionObserver"in window){const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{const video=entry.target;if(entry.isIntersecting&&entry.intersectionRatio>=.6)video.play().catch(()=>{});else video.pause()}),{threshold:[0,.6]});videosOnPage.forEach(video=>observer.observe(video))}
}
function setupPostViewObserver(){
  if(!("IntersectionObserver"in window))return;
  const observer=new IntersectionObserver(entries=>entries.forEach(async entry=>{
    if(!entry.isIntersecting||entry.intersectionRatio<.5)return;
    observer.unobserve(entry.target);const id=String(entry.target.dataset.id);
    if(viewRequestsInSession.has(id)||!token())return;viewRequestsInSession.add(id);
    try{const data=await api("/posts/"+encodeURIComponent(id)+"/view",{method:"POST",body:JSON.stringify({})});const p=videos.find(v=>v.id===id);if(p&&data.view_count!==undefined){p.views=count(data.view_count);const card=Array.from(document.querySelectorAll(".post-card")).find(el=>el.dataset.id===id);const label=card?.querySelector(".view-count");if(label)label.innerHTML='<i class="fa-solid fa-eye"></i> '+p.views+' views'}}
    catch(_){viewRequestsInSession.delete(id)}
  }),{threshold:[.5]});
  document.querySelectorAll("#feed .post-card").forEach(card=>observer.observe(card));
}
async function comments(id){
  if(!requireLogin())return;activeCommentId=String(id);document.getElementById("commentModal").classList.add("open");document.getElementById("commentList").innerHTML='<div class="loading">Loading comments...</div>';
  try{const data=await api("/posts/"+encodeURIComponent(id)+"/comments");document.getElementById("commentList").innerHTML=(data.comments||[]).map(c=>'<div class="comment"><span class="comment-author">'+esc(c.display_name||c.username||"User")+'</span>'+blueBadgeHTML(c)+'<br>'+esc(c.content)+'</div>').join("")||'<div class="empty-state">No comments yet.</div>'}
  catch(error){document.getElementById("commentList").innerHTML='<div class="empty-state">'+esc(error.message)+'</div>'}
}
document.getElementById("commentForm").addEventListener("submit",async event=>{
  event.preventDefault();if(!requireLogin()||!activeCommentId)return;
  const input=document.getElementById("commentInput"),content=input.value.trim();if(!content)return;
  const button=event.submitter;if(button)button.disabled=true;
  try{await api("/posts/"+encodeURIComponent(activeCommentId)+"/comments",{method:"POST",body:JSON.stringify({content})});input.value="";const p=videos.find(v=>v.id===activeCommentId);if(p)p.comments++;const card=Array.from(document.querySelectorAll(".post-card")).find(el=>el.dataset.id===activeCommentId),countLabel=card?.querySelector(".comment-count");if(countLabel&&p)countLabel.textContent=p.comments+" comments";await comments(activeCommentId);toast("Comment added.")}
  catch(error){toast(error.message)}finally{if(button)button.disabled=false}
});
async function sharePost(id){
  const p=videos.find(v=>v.id===String(id));if(!p)return;
  const url=location.href.split("#")[0]+"#post-"+encodeURIComponent(id);
  try{if(navigator.share)await navigator.share({title:"Boys vs Girls post by "+p.username,text:p.content,url});else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);toast("Post link copied.")}else toast("Sharing is not supported on this device.")}
  catch(error){if(error.name!=="AbortError")toast("Unable to share this post.")}
}
function postOptions(id){const p=videos.find(v=>v.id===String(id));if(p&&confirm("Share this post?"))sharePost(id)}
function filterPosts(query){const q=String(query||"").toLowerCase();render(videos.filter(v=>String(v.content).toLowerCase().includes(q)||String(v.username).toLowerCase().includes(q)||String(v.profileUsername).toLowerCase().includes(q)))}
function clearSearch(){document.getElementById("searchInput").value="";render(videos)}
async function loadNotificationCount(){try{const data=await api("/notifications"),n=count(data.unread_count),el=document.getElementById("notificationBadge");el.textContent=n>99?"99+":String(n);el.hidden=n===0}catch(_){}}
async function loadMessageCount(){try{const data=await api("/messages"),n=(data.conversations||[]).reduce((s,item)=>s+count(item.unread_count),0);document.getElementById("inboxUnreadCount")?.replaceChildren(document.createTextNode(String(n)))}catch(_){}}
(function setupPullToRefresh(){
  const indicator=document.getElementById("refreshIndicator");let startY=0,startX=0,pullDistance=0,tracking=false,blocked=false;
  const threshold=85,maxPull=110;
  function reset(){tracking=false;blocked=false;pullDistance=0;indicator.classList.remove("visible","refreshing");indicator.style.top="8px";indicator.querySelector("i").className="fa-solid fa-arrow-down"}
  document.addEventListener("touchstart",event=>{
    if(event.touches.length!==1||window.scrollY>0||refreshInProgress)return;
    const target=event.target;
    if(target.closest(".stories")||target.closest("input")||target.closest("textarea")||target.closest("video")||target.closest(".modal")||target.closest(".reaction-picker")||target.closest(".story-viewer")){blocked=true;return}
    blocked=false;tracking=true;startY=event.touches[0].clientY;startX=event.touches[0].clientX;pullDistance=0;
  },{passive:true});
  document.addEventListener("touchmove",event=>{
    if(!tracking||blocked||event.touches.length!==1)return;
    const x=event.touches[0].clientX,y=event.touches[0].clientY,dx=x-startX,dy=y-startY;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10){tracking=false;return}
    if(dy<=0||window.scrollY>0){reset();return}
    pullDistance=Math.min(maxPull,dy*.55);indicator.classList.add("visible");indicator.style.top=Math.max(8,pullDistance-35)+"px";indicator.querySelector("i").className=dy>=threshold?"fa-solid fa-arrow-rotate-right":"fa-solid fa-arrow-down";
  },{passive:true});
  document.addEventListener("touchend",async()=>{
    if(!tracking||blocked){reset();return}
    const shouldRefresh=pullDistance>=threshold*.55;reset();if(!shouldRefresh||refreshInProgress)return;
    refreshInProgress=true;indicator.classList.add("visible","refreshing");indicator.style.top="8px";indicator.querySelector("i").className="fa-solid fa-spinner";
    try{if(!token()){location.reload();return}await Promise.all([loadMe().catch(()=>{}),loadFeed(),loadStories(),loadNotificationCount(),loadMessageCount()]);toast("Feed refreshed")}
    finally{refreshInProgress=false;reset()}
  },{passive:true});
  document.addEventListener("touchcancel",reset,{passive:true});
})();
async function initialize(){
  if(!token()){location.replace("auth.html?mode=login");return}
  try{await loadMe()}catch(error){toast(error.message);return}
  await Promise.all([loadFeed(),loadStories(),loadNotificationCount(),loadMessageCount()]);
}
window.addEventListener("focus",()=>{if(token()){loadNotificationCount();loadMessageCount();loadStories()}});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){document.querySelectorAll("#feed video").forEach(v=>v.pause());if(document.getElementById("storyViewer").classList.contains("open")&&!storyPaused)pauseStory()}
});
initialize();
</script>
