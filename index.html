<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>FreeTube</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#191b20;--line:#2b2e36;--text:#f4f4f5;--muted:#a1a1aa;--blue:#4f8cff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
    header{position:sticky;top:0;background:#141519;border-bottom:1px solid var(--line);padding:15px;z-index:5}
    .top{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .logo{font-size:24px;font-weight:bold;color:#fff}.logo span{color:var(--blue)}
    button,input,textarea{font:inherit}
    button{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;cursor:pointer}
    button.secondary{background:#292c34}
    button:disabled{opacity:.5}
    main{max-width:700px;margin:22px auto;padding:0 12px 90px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
    h2,h3,p{margin-top:0}h2{font-size:21px}small,.muted{color:var(--muted)}
    input,textarea{width:100%;padding:12px;margin:6px 0 12px;background:#101114;border:1px solid var(--line);border-radius:9px;color:white}
    textarea{resize:vertical;min-height:90px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .row>*{flex:1}.hidden{display:none!important}
    .post-head{display:flex;justify-content:space-between;gap:10px}
    .post-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
    .post-media{width:100%;max-height:440px;object-fit:contain;border-radius:10px;background:#090909;margin-top:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .actions button{background:#292c34}
    .actions button.active{background:#244a88}
    #status{padding:10px;border-radius:8px;margin-bottom:12px;display:none;overflow-wrap:anywhere}
    #status.show{display:block}#status.error{background:#4a2025}#status.ok{background:#183c2b}
    .tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap}
    .bottom{position:fixed;bottom:0;left:0;right:0;background:#15161a;border-top:1px solid var(--line);display:flex;justify-content:center;gap:10px;padding:10px;z-index:4}
    .bottom button{background:transparent;color:#ccc;flex:1;max-width:160px}
    .bottom button.active{background:#263c60;color:white}
    .empty{text-align:center;padding:25px;color:var(--muted)}
    @media(min-width:720px){main{margin-top:28px}}
  </style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">Free<span>Tube</span></div>
    <div id="accountButtons" class="row">
      <button onclick="showAuth('login')">Log in</button>
      <button class="secondary" onclick="showAuth('register')">Sign up</button>
    </div>
    <button id="logoutBtn" class="secondary hidden" onclick="logout()">Log out</button>
  </div>
</header><main>
  <div id="status"></div>  <section id="authCard" class="card hidden">
    <h2 id="authTitle">Log in</h2>
    <form id="authForm">
      <div id="nameField" class="hidden">
        <label for="fullName">Username</label>
        <input id="fullName" autocomplete="username" minlength="3" maxlength="30">
      </div>
      <label for="email">Email (optional for registration)</label>
      <input id="email" type="email" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" required>
      <button id="authSubmit" type="submit">Log in</button>
      <button type="button" class="secondary" onclick="hideAuth()">Cancel</button>
    </form>
    <p class="muted" style="margin-top:14px">Use at least 8 characters for your password.</p>
  </section>  <section id="home">
    <div class="tabs">
      <button onclick="loadFeed()" class="active">Home feed</button>
      <button class="secondary" onclick="showSearch()">Search people</button>
      <button class="secondary" onclick="showProfile()">My profile</button>
    </div><section id="searchCard" class="card hidden">
  <h3>Search people</h3>
  <form id="searchForm">
    <input id="searchQuery" placeholder="Enter username" required>
    <button>Search</button>
  </form>
  <div id="searchResults"></div>
</section>

<section id="profileCard" class="card hidden">
  <h3>My profile</h3>
  <form id="profileForm">
    <label>Display name</label>
    <input id="displayName" maxlength="80" placeholder="Your name">
    <label>Bio</label>
    <textarea id="bio" maxlength="500" placeholder="About you"></textarea>
    <button>Save profile</button>
  </form>
</section>

<section id="composer" class="card hidden">
  <h3>Create a post</h3>
  <form id="postForm">
    <textarea id="postContent" maxlength="5000" placeholder="What's happening?" required></textarea>
    <label>Optional image or video</label>
    <input id="postFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime">
    <button id="postSubmit">Publish post</button>
  </form>
</section>

<h2>Latest posts</h2>
<div id="feed"><div class="empty">Loading posts…</div></div>

  </section>
</main><nav class="bottom">
  <button class="active" onclick="goHome()">⌂ Home</button>
  <button onclick="showSearch()">⌕ Search</button>
  <button onclick="showProfile()">♙ Profile</button>
  <button onclick="loadNotifications()">♧ Alerts</button>
</nav><script>
(() => {
  const API = "https://freetube-backend-a222.onrender.com/api";
  const $ = id => document.getElementById(id);
  let token = localStorage.getItem("ft_token") || "";
  let me = null;
  let authMode = "login";
  let posts = [];

  function message(text, error = false) {
    const el = $("status");
    el.textContent = text;
    el.className = "show " + (error ? "error" : "ok");
    window.scrollTo({top: 0, behavior: "smooth"});
  }

  async function request(path, options = {}) {
    const headers = {...(options.headers || {})};
    if (token) headers.Authorization = "Bearer " + token;
    if (options.body && !(options.body instanceof FormData)) {
      headers["Content-Type"] = "application/json";
    }
    let response;
    try {
      response = await fetch(API + path, {...options, headers});
    } catch {
      throw new Error("Network error. Check your internet connection.");
    }
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      if (response.status === 401 && token) {
        token = "";
        me = null;
        localStorage.removeItem("ft_token");
        updateAccount();
      }
      throw new Error(data.error || data.message || "Request failed (" + response.status + ")");
    }
    return data;
  }

  function updateAccount() {
    $("accountButtons").classList.toggle("hidden", !!me);
    $("logoutBtn").classList.toggle("hidden", !me);
    $("composer").classList.toggle("hidden", !me);
  }

  function showAuth(mode) {
    authMode = mode;
    $("authCard").classList.remove("hidden");
    $("authTitle").textContent = mode === "login" ? "Log in" : "Create account";
    $("authSubmit").textContent = mode === "login" ? "Log in" : "Sign up";
    $("nameField").classList.toggle("hidden", mode === "login");
    $("fullName").required = mode === "register";
    $("password").autocomplete = mode === "login" ? "current-password" : "new-password";
    window.scrollTo({top: 0, behavior: "smooth"});
  }
  window.showAuth = showAuth;

  function hideAuth() {$("authCard").classList.add("hidden")}
  window.hideAuth = hideAuth;

  function logout() {
    token = "";
    me = null;
    localStorage.removeItem("ft_token");
    updateAccount();
    message("Logged out.");
    loadFeed();
  }
  window.logout = logout;

  $("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("authSubmit");
    btn.disabled = true;
    try {
      let body;
      if (authMode === "register") {
        body = {
          username: $("fullName").value.trim(),
          email: $("email").value.trim() || null,
          password: $("password").value
        };
      } else {
        body = {
          email: $("email").value.trim(),
          password: $("password").value
        };
      }
      const data = await request("/auth/" + (authMode === "login" ? "login" : "register"), {
        method: "POST", body: JSON.stringify(body)
      });
      if (data.token) {
        token = data.token;
        localStorage.setItem("ft_token", token);
      }
      me = data.user || data;
      if (!me || !me.id) {
        me = null;
        if (token) {
          const result = await request("/auth/me");
          me = result.user || result;
        }
      }
      updateAccount();
      hideAuth();
      $("authForm").reset();
      message(authMode === "login" ? "Login successful." : "Account created.");
      await loadFeed();
    } catch (err) {
      message(err.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  async function loadMe() {
    if (!token) {updateAccount(); return;}
    try {
      const data = await request("/auth/me");
      me = data.user || data;
    } catch {
      token = "";
      me = null;
      localStorage.removeItem("ft_token");
    }
    updateAccount();
  }

  function safe(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    })[ch]);
  }

  function mediaHtml(post) {
    if (!post.media_url) return "";
    const url = safe(post.media_url);
    if (String(post.media_type || "").startsWith("video/")) {
      return `<video class="post-media" controls playsinline preload="metadata" src="${url}"></video>`;
    }
    return `<img class="post-media" loading="lazy" src="${url}" alt="Post media">`;
  }

  function renderPost(post) {
    const id = Number(post.id);
    const user = post.username || post.display_name || "User";
    const liked = !!(post.liked_by_me || post.is_liked || post.liked);
    const likes = Number(post.like_count ?? post.likes_count ?? post.likes ?? 0);
    const comments = Number(post.comment_count ?? post.comments_count ?? 0);
    return `<article class="card">
      <div class="post-head">
        <div><strong>${safe(user)}</strong><br><small>${safe(post.created_at || "")}</small></div>
      </div>
      <p class="post-content">${safe(post.content || "")}</p>
      ${mediaHtml(post)}
      <div class="actions">
        <button class="${liked ? "active" : ""}" data-like="${id}">♥ ${likes} Like</button>
        <button data-comments="${id}">Comments (${comments})</button>
      </div>
      <div id="comments-${id}" class="hidden" style="margin-top:14px">
        <div id="comment-list-${id}"></div>
        ${token ? `<form data-comment-form="${id}"><textarea name="content" maxlength="2000" placeholder="Write a comment…" required></textarea><button>Comment</button></form>` : `<small>Log in to comment.</small>`}  </div>
</article>`;

}

async function loadFeed() {
$("feed").innerHTML = '<div class="empty">Loading posts…</div>';
try {
const data = await request("/posts");
posts = Array.isArray(data) ? data : (data.posts || data.items || []);
$("feed").innerHTML = posts.length ? posts.map(renderPost).join("") :
'<div class="empty">No posts yet. Sign in and publish the first post.</div>';
} catch (err) {
$("feed").innerHTML = '<div class="card">Could not load posts: ' + safe(err.message) + '</div>';
}
}
window.loadFeed = loadFeed;

$("feed").addEventListener("click", async e => {
const likeBtn = e.target.closest("[data-like]");
const commentBtn = e.target.closest("[data-comments]");
if (likeBtn) {
if (!token) {showAuth("login"); return;}
likeBtn.disabled = true;
try {
const id = likeBtn.dataset.like;
await request("/posts/" + id + "/like", {method: "POST", body: JSON.stringify({})});
await loadFeed();
message("Like updated.");
} catch (err) {message(err.message, true);}
finally {likeBtn.disabled = false;}
}
if (commentBtn) {
const id = commentBtn.dataset.comments;
const box = $("comments-" + id);
box.classList.toggle("hidden");
if (!box.classList.contains("hidden")) loadComments(id);
}
});

$("feed").addEventListener("submit", async e => {
const form = e.target.closest("[data-comment-form]");
if (!form) return;
e.preventDefault();
const id = form.dataset.commentForm;
const content = new FormData(form).get("content").trim();
if (!content) return;
try {
await request("/posts/" + id + "/comments", {
method: "POST", body: JSON.stringify({content})
});
form.reset();
await loadComments(id);
message("Comment posted.");
} catch (err) {message(err.message, true);}
});

async function loadComments(id) {
const el = $("comment-list-" + id);
el.innerHTML = "<small>Loading comments…</small>";
try {
const data = await request("/posts/" + id + "/comments");
const list = Array.isArray(data) ? data : (data.comments || []);
el.innerHTML = list.length ? list.map(c =>
"<p><strong>${safe(c.username || "User")}</strong> ${safe(c.content)}<br><small>${safe(c.created_at || "")}</small></p>"
).join("") : "<small>No comments yet.</small>";
} catch (err) {el.textContent = err.message;}
}

$("postForm").addEventListener("submit", async e => {
e.preventDefault();
if (!token) {showAuth("login"); return;}
const btn = $("postSubmit");
btn.disabled = true;
try {
const content = $("postContent").value.trim();
const file = $("postFile").files[0];
let media_url = null, media_type = null;
if (file) {
const fd = new FormData();
fd.append("file", file);
const upload = await request("/media/upload", {method: "POST", body: fd});
const media = upload.media || upload;
media_url = media.url || media.secure_url || media.media_url;
media_type = media.resource_type === "video" ? file.type : file.type;
if (!media_url) throw new Error("Upload response did not include a media URL.");
}
await request("/posts", {
method: "POST",
body: JSON.stringify({content, media_url, media_type})
});
$("postForm").reset();
message("Post published.");
await loadFeed();
} catch (err) {message(err.message, true);}
finally {btn.disabled = false;}
});

function showSearch() {
$("searchCard").classList.remove("hidden");
$("profileCard").classList.add("hidden");
window.scrollTo({top: 0, behavior: "smooth"});
}
window.showSearch = showSearch;

$("searchForm").addEventListener("submit", async e => {
e.preventDefault();
const q = $("searchQuery").value.trim();
const box = $("searchResults");
box.textContent = "Searching…";
try {
const data = await request("/users/search?q=" + encodeURIComponent(q));
const users = Array.isArray(data) ? data : (data.users || []);
box.innerHTML = users.length ? users.map(u =>
"<div class="card"><strong>${safe(u.username || u.display_name)}</strong><br><small>${safe(u.bio || "")}</small></div>"
).join("") : "<p>No users found.</p>";
} catch (err) {box.textContent = err.message;}
});

async function showProfile() {
if (!token) {showAuth("login"); return;}
$("profileCard").classList.remove("hidden");
$("searchCard").classList.add("hidden");
try {
const data = await request("/auth/me");
const u = data.user || data;
$("displayName").value = u.display_name || u.username || "";
$("bio").value = u.bio || "";
} catch (err) {message(err.message, true);}
window.scrollTo({top: 0, behavior: "smooth"});
}
window.showProfile = showProfile;

$("profileForm").addEventListener("submit", async e => {
e.preventDefault();
try {
await request("/profile", {
method: "PUT",
body: JSON.stringify({
display_name: $("displayName").value.trim(),
bio: $("bio").value.trim()
})
});
message("Profile saved.");
} catch (err) {message(err.message, true);}
});

async function loadNotifications() {
if (!token) {showAuth("login"); return;}
try {
const data = await request("/notifications");
const items = Array.isArray(data) ? data : (data.notifications || []);
message(items.length ? items.map(n => n.message || n.type || "Notification").join(" · ") : "No notifications.");
} catch (err) {message(err.message, true);}
}
window.loadNotifications = loadNotifications;

function goHome() {
$("searchCard").classList.add("hidden");
$("profileCard").classList.add("hidden");
window.scrollTo({top: 0, behavior: "smooth"});
loadFeed();
}
window.goHome = goHome;

async function init() {
await loadMe();
await loadFeed();
}
init();
})();
</script>

</body>
</html>
