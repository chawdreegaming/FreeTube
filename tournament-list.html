
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101225">
<title>BOYS VS GIRLS — Tournaments</title>

<style>
:root {
  --bg:#0b0d1b;
  --panel:#15182b;
  --panel2:#1c2038;
  --text:#f5f6ff;
  --muted:#9da5c2;
  --blue:#3988ff;
  --pink:#ff4d9d;
  --green:#22c985;
  --border:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.header{
  position:sticky;top:0;z-index:10;
  background:rgba(13,15,31,.96);
  border-bottom:1px solid var(--border);
  padding:15px 5%;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
.brand{font-size:18px;font-weight:900}
.brand span:first-child{color:#58a0ff}
.brand span:last-child{color:#ff68ad}
.header a{
  background:linear-gradient(100deg,var(--blue),#7758ff);
  padding:10px 15px;border-radius:10px;font-size:13px;font-weight:bold;
}
.container{width:min(1100px,92%);margin:auto}
.hero{
  margin:24px auto;
  padding:35px 22px;
  border:1px solid var(--border);
  border-radius:20px;
  background:
    radial-gradient(circle at 15% 20%,rgba(57,136,255,.28),transparent 40%),
    radial-gradient(circle at 90% 80%,rgba(255,77,157,.2),transparent 38%),
    var(--panel);
  text-align:center;
}
.hero h1{font-size:clamp(26px,5vw,42px);margin:0 0 12px}
.hero h1 span{color:#62a5ff}
.hero p{color:var(--muted);line-height:1.6;margin:0}
.section-title{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin:28px 0 16px;flex-wrap:wrap;
}
.section-title h2{font-size:21px;margin:0}
.count{font-size:12px;color:var(--muted)}
.filters{
  display:flex;gap:9px;overflow-x:auto;padding-bottom:5px;
}
.filter{
  border:1px solid var(--border);background:var(--panel);
  color:var(--muted);padding:10px 16px;border-radius:30px;
  white-space:nowrap;font-size:13px;
}
.filter.active{
  color:white;background:var(--blue);border-color:var(--blue);
}
.grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;margin:18px 0 40px;
}
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:17px;overflow:hidden;min-width:0;
  transition:transform .2s,border-color .2s;
}
.card:hover{transform:translateY(-3px);border-color:#477ee9}
.banner{
  height:145px;background:linear-gradient(135deg,#1b4c9b,#7c286d);
  position:relative;overflow:hidden;
}
.banner img{width:100%;height:100%;object-fit:cover}
.banner-placeholder{
  height:100%;display:grid;place-items:center;
  font-size:43px;font-weight:900;color:rgba(255,255,255,.85);
}
.status{
  position:absolute;top:12px;left:12px;
  border-radius:20px;padding:6px 10px;
  font-size:10px;font-weight:900;text-transform:uppercase;
  background:#29314b;color:white;
}
.status.live{background:#b52249}
.status.upcoming{background:#174e9c}
.status.completed{background:#23664b}
.card-body{padding:16px}
.type{
  font-size:10px;letter-spacing:1px;color:#75aaff;
  font-weight:bold;text-transform:uppercase;
}
.card h3{font-size:17px;margin:9px 0;line-height:1.35}
.description{
  color:var(--muted);font-size:12px;line-height:1.5;
  min-height:36px;
}
.info{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;
  margin:15px 0;
}
.info-item{
  background:var(--panel2);padding:10px;border-radius:9px;
}
.info-item small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}
.info-item strong{font-size:13px;overflow-wrap:anywhere}
.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;border-top:1px solid var(--border);padding-top:13px;
}
.card-footer small{color:var(--muted);font-size:11px}
.details-btn{
  border:0;border-radius:9px;padding:10px 13px;
  color:white;background:linear-gradient(100deg,var(--blue),#7555ff);
  font-weight:bold;font-size:12px;
}
.empty,.loading,.error{
  grid-column:1/-1;text-align:center;padding:38px 15px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:15px;color:var(--muted);line-height:1.7;
}
.retry{
  margin-top:12px;background:var(--blue);border:0;
  color:white;padding:10px 18px;border-radius:9px;
}
.footer{
  text-align:center;color:var(--muted);font-size:12px;
  padding:25px 10px;border-top:1px solid var(--border);
}
@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  .header{padding:13px 4%}
  .brand{font-size:15px}
  .header a{font-size:11px;padding:9px 11px}
  .hero{padding:27px 15px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .banner{height:105px}
  .card-body{padding:11px}
  .card h3{font-size:14px}
  .description{font-size:11px}
  .info{gap:6px}
  .info-item{padding:8px}
  .info-item strong{font-size:11px}
  .details-btn{padding:9px 8px;font-size:10px}
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <span>BOYS</span> VS <span>GIRLS 💙💗</span>
  </div>
  <a href="index.html">← Home</a>
</header>

<main class="container">

  <section class="hero">
    <h1>eSports <span>Tournaments</span></h1>
    <p>Join tournaments, build your team and compete for victory.</p>
  </section>

  <section>
    <div class="section-title">
      <h2>Available Tournaments</h2>
      <span class="count" id="tournamentCount">Loading...</span>
    </div>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="upcoming">Upcoming</button>
      <button class="filter" data-filter="live">Live</button>
      <button class="filter" data-filter="completed">Completed</button>
    </div>

    <div class="grid" id="tournamentGrid">
      <div class="loading">Loading tournaments...</div>
    </div>
  </section>

</main>

<footer class="footer">
  BOYS VS GIRLS 💙💗 eSports Tournament
</footer>

<script>
"use strict";

/*
  GitHub Pages frontend থেকে Render backend ব্যবহার করা হবে।
  API origin এবং endpoint আলাদা রাখা হয়েছে।
*/
const API_BASE = "https://freetube-backend-a222.onrender.com";
const API_URL = `${API_BASE}/api/tournament/tournaments`;

const grid = document.getElementById("tournamentGrid");
const countLabel = document.getElementById("tournamentCount");

let tournaments = [];
let activeFilter = "all";

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function money(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "৳0";
  return "৳" + number.toLocaleString("en-BD");
}

function getStatus(item) {
  const status = String(item.status || "upcoming").toLowerCase();
  if (status === "live") return "live";
  if (status === "completed") return "completed";
  if (status === "cancelled") return "cancelled";
  return "upcoming";
}

function getType(item) {
  return item.tournament_type ||
    item.type ||
    item.game_type ||
    "Tournament";
}

function getMode(item) {
  return item.mode || item.game_mode || "Squad";
}

function getBanner(item) {
  return item.banner_url ||
    item.banner ||
    item.image_url ||
    "";
}

function getDate(item) {
  const value = item.scheduled_at || item.start_at || item.date;
  if (!value) return "Not scheduled";

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "Not scheduled";

  return date.toLocaleString("en-BD", {
    dateStyle:"medium",
    timeStyle:"short"
  });
}

function renderCard(item) {
  const id = item.id;
  const title = item.title || item.name || "Untitled Tournament";
  const status = getStatus(item);
  const banner = getBanner(item);
  const description = item.description || "Join this tournament and compete with other players.";
  const entryFee = money(item.entry_fee);
  const prizePool = money(item.prize_pool);
  const mode = getMode(item);
  const type = getType(item);
  const date = getDate(item);

  const imageHTML = banner
    ? `<img src="${escapeHTML(banner)}" alt="${escapeHTML(title)}" loading="lazy" onerror="this.remove()">`
    : `<div class="banner-placeholder">BG</div>`;

  return `
    <article class="card">
      <div class="banner">
        ${imageHTML}
        <span class="status ${status}">${escapeHTML(status)}</span>
      </div>

      <div class="card-body">
        <div class="type">${escapeHTML(type)}</div>
        <h3>${escapeHTML(title)}</h3>
        <div class="description">${escapeHTML(description)}</div>

        <div class="info">
          <div class="info-item">
            <small>Game Mode</small>
            <strong>${escapeHTML(mode)}</strong>
          </div>
          <div class="info-item">
            <small>Entry Fee</small>
            <strong>${entryFee}</strong>
          </div>
          <div class="info-item">
            <small>Prize Pool</small>
            <strong>${prizePool}</strong>
          </div>
          <div class="info-item">
            <small>Start Time</small>
            <strong>${escapeHTML(date)}</strong>
          </div>
        </div>

        <div class="card-footer">
          <small>${escapeHTML(status.toUpperCase())}</small>
          <button class="details-btn" data-id="${escapeHTML(id)}">
            View Details
          </button>
        </div>
      </div>
    </article>
  `;
}

function renderTournaments() {
  const filtered = activeFilter === "all"
    ? tournaments
    : tournaments.filter(item => getStatus(item) === activeFilter);

  countLabel.textContent = `${filtered.length} Tournament(s)`;

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty">
        No ${activeFilter === "all" ? "" : activeFilter + " "}tournaments found.
      </div>
    `;
    return;
  }

  grid.innerHTML = filtered.map(renderCard).join("");
}

function showError(message) {
  countLabel.textContent = "Unable to load";
  grid.innerHTML = `
    <div class="error">
      ${escapeHTML(message)}
      <br>
      <button class="retry" id="retryButton">Try Again</button>
    </div>
  `;

  document.getElementById("retryButton")
    ?.addEventListener("click", loadTournaments);
}

async function loadTournaments() {
  grid.innerHTML = `<div class="loading">Loading tournaments...</div>`;
  countLabel.textContent = "Loading...";

  try {
    const response = await fetch(API_URL, {
      method:"GET",
      headers:{
        "Accept":"application/json"
      },
      credentials:"omit",
      cache:"no-store"
    });

    if (!response.ok) {
      throw new Error(`Server response: ${response.status}`);
    }

    const result = await response.json();

    /*
      Supports common API response shapes:
      { tournaments: [] }
      { data: [] }
      { data: { tournaments: [] } }
      []
    */
    let list = [];

    if (Array.isArray(result)) {
      list = result;
    } else if (Array.isArray(result.tournaments)) {
      list = result.tournaments;
    } else if (Array.isArray(result.data)) {
      list = result.data;
    } else if (Array.isArray(result.data?.tournaments)) {
      list = result.data.tournaments;
    }

    tournaments = list;
    renderTournaments();

  } catch (error) {
    console.error("Tournament loading error:", error);

    showError(
      "Could not connect to the tournament server. Please check your internet connection or try again."
    );
  }
}

document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");
    activeFilter = button.dataset.filter;
    renderTournaments();
  });
});

grid.addEventListener("click", event => {
  const button = event.target.closest(".details-btn");
  if (!button) return;

  const id = button.dataset.id;
  if (!id) return;

  window.location.href =
    `tournament-details.html?id=${encodeURIComponent(id)}`;
});

loadTournaments();
</script>

</body>
</html>
