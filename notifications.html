<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Notifications | FreeTube</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101010;
      color: #fff;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      background: #181818;
      border-bottom: 1px solid #292929;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
      color: #43e477;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    button {
      cursor: pointer;
      border: 0;
      color: white;
      font-size: 14px;
    }

    .icon-button {
      background: transparent;
      font-size: 19px;
      padding: 6px;
    }

    .mark-all {
      background: #252525;
      border-radius: 8px;
      padding: 9px 11px;
    }

    .mark-all:hover {
      background: #333;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 12px;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 3px 4px 18px;
    }

    .summary h1 {
      font-size: 23px;
    }

    .count {
      background: #e53935;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
    }

    .notice {
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #292929;
      border-radius: 12px;
      background: #191919;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .notice.unread {
      background: #1c2820;
      border-color: #285d39;
    }

    .avatar {
      flex-shrink: 0;
      width: 43px;
      height: 43px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #28c76f, #e53935);
      font-size: 18px;
      font-weight: bold;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .notice-content {
      flex: 1;
      min-width: 0;
    }

    .notice-message {
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .notice-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 7px;
      color: #aaa;
      font-size: 12px;
    }

    .type {
      color: #65e890;
      text-transform: capitalize;
    }

    .notice-actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
      align-items: center;
    }

    .small-action {
      background: transparent;
      color: #bbb;
      font-size: 15px;
      padding: 4px;
    }

    .small-action:hover {
      color: #43e477;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #43e477;
    }

    .state {
      text-align: center;
      padding: 55px 18px;
      color: #aaa;
      line-height: 1.7;
    }

    .state i {
      font-size: 42px;
      margin-bottom: 15px;
      color: #555;
    }

    .state h2 {
      font-size: 19px;
      margin-bottom: 8px;
      color: #eee;
    }

    .primary-button {
      margin-top: 17px;
      background: linear-gradient(100deg, #28c76f, #df3434);
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: bold;
    }

    .error-text {
      color: #ff8888;
      font-size: 13px;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }

    .loading {
      text-align: center;
      color: #aaa;
      padding: 45px 10px;
    }

    .loading i {
      margin-right: 8px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #181818;
      border-top: 1px solid #333;
      padding: 10px 3px calc(10px + env(safe-area-inset-bottom));
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: transparent;
      color: #999;
      font-size: 11px;
      text-decoration: none;
      min-width: 48px;
    }

    .nav-item i {
      font-size: 19px;
    }

    .nav-item.active {
      color: #43e477;
    }

    @media (max-width: 400px) {
      header {
        padding: 13px 10px;
      }

      .brand {
        font-size: 18px;
      }

      .mark-all {
        font-size: 12px;
        padding: 8px;
      }

      .notice {
        padding: 10px;
        gap: 9px;
      }

      .avatar {
        width: 37px;
        height: 37px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <i class="fa-solid fa-circle-play"></i> FreeTube
    </div>

    <div class="header-actions">
      <button class="mark-all" id="markAllBtn" type="button">
        <i class="fa-solid fa-check-double"></i> সব পড়া
      </button>

      <button class="icon-button" id="refreshBtn"
              type="button" aria-label="Refresh">
        <i class="fa-solid fa-rotate"></i>
      </button>
    </div>
  </header>

  <main>
    <div class="summary">
      <h1>Notifications</h1>
      <span class="count" id="unreadCount">০টি নতুন</span>
    </div>

    <div id="notificationList">
      <div class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        নোটিফিকেশন লোড হচ্ছে...
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item" href="index.html">
      <i class="fa-solid fa-house"></i><span>Home</span>
    </a>

    <a class="nav-item" href="discover.html">
      <i class="fa-solid fa-compass"></i><span>Discover</span>
    </a>

    <a class="nav-item" href="create.html">
      <i class="fa-solid fa-plus-circle"></i><span>Create</span>
    </a>

    <a class="nav-item active" href="notification.html">
      <i class="fa-solid fa-bell"></i><span>Notifications</span>
    </a>

    <a class="nav-item" href="profile.html">
      <i class="fa-solid fa-user"></i><span>Profile</span>
    </a>
  </nav>

  <script>
    "use strict";

    // তোমার FreeTube backend API
    const API_BASE = "https://freetube-backend-a222.onrender.com/api";

    const list = document.getElementById("notificationList");
    const unreadCount = document.getElementById("unreadCount");
    const markAllBtn = document.getElementById("markAllBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    let notifications = [];
    let loading = false;

    function getToken() {
      return localStorage.getItem("freetube_access_token");
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function typeIcon(type) {
      const icons = {
        like: "fa-heart",
        reaction: "fa-face-smile",
        comment: "fa-comment",
        follow: "fa-user-plus",
        message: "fa-envelope"
      };

      return icons[String(type || "").toLowerCase()] || "fa-bell";
    }

    function formatDate(dateValue) {
      if (!dateValue) return "";

      const date = new Date(dateValue);
      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleString("bn-BD", {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function showState(icon, heading, message, buttonLabel, action) {
      list.innerHTML = `
        <div class="state">
          <i class="fa-solid ${icon}"></i>
          <h2>${escapeHTML(heading)}</h2>
          <p>${escapeHTML(message)}</p>
          ${buttonLabel ? `
            <button class="primary-button" id="stateAction" type="button">
              ${escapeHTML(buttonLabel)}
            </button>
          ` : ""}
          <p class="error-text" id="stateError"></p>
        </div>
      `;

      const btn = document.getElementById("stateAction");
      if (btn && action) btn.addEventListener("click", action);
    }

    async function apiRequest(path, options = {}) {
      const token = getToken();

      if (!token) {
        const error = new Error("LOGIN_REQUIRED");
        error.status = 401;
        throw error;
      }

      const response = await fetch(API_BASE + path, {
        ...options,
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const rawText = await response.text();
      let data = {};

      try {
        data = rawText ? JSON.parse(rawText) : {};
      } catch (_) {
        data = { error: rawText || "সার্ভার থেকে সঠিক উত্তর পাওয়া যায়নি।" };
      }

      if (!response.ok) {
        const error = new Error(
          data.error || data.message || `HTTP ${response.status}`
        );
        error.status = response.status;
        throw error;
      }

      return data;
    }

    function normalizeItems(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data.notifications)) return data.notifications;
      if (Array.isArray(data.data)) return data.data;
      return [];
    }

    function renderNotifications(data) {
      notifications = normalizeItems(data);

      const unread = notifications.filter(item => !item.read_at).length;

      unreadCount.textContent = `${unread.toLocaleString("bn-BD")}টি নতুন`;
      markAllBtn.disabled = unread === 0;
      markAllBtn.style.opacity = unread === 0 ? "0.55" : "1";

      if (notifications.length === 0) {
        showState(
          "fa-bell-slash",
          "এখনো কোনো নোটিফিকেশন নেই",
          "কেউ লাইক, কমেন্ট, ফলো বা মেসেজ করলে এখানে দেখা যাবে।",
          "আবার লোড করুন",
          loadNotifications
        );
        return;
      }

      list.innerHTML = notifications.map(item => {
        const type = String(item.type || "notification").toLowerCase();
        const actor = item.actor_username || item.username || "কেউ একজন";
        const message = item.message || `${actor} তোমার সঙ্গে ইন্টারঅ্যাক্ট করেছে।`;
        const isUnread = !item.read_at;
        const initial = actor.trim().charAt(0).toUpperCase() || "F";

        return `
          <article class="notice ${isUnread ? "unread" : ""}"
                   data-id="${escapeHTML(item.id)}">
            <div class="avatar" aria-hidden="true">
              <i class="fa-solid ${typeIcon(type)}"></i>
            </div>

            <div class="notice-content">
              <div class="notice-message">${escapeHTML(message)}</div>
              <div class="notice-meta">
                <span class="type">
                  <i class="fa-solid ${typeIcon(type)}"></i>
                  ${escapeHTML(type)}
                </span>
                <span>${escapeHTML(formatDate(item.created_at))}</span>
              </div>
            </div>

            <div class="notice-actions">
              ${isUnread ? `
                <span class="unread-dot" title="নতুন"></span>
                <button class="small-action mark-one"
                        type="button"
                        data-id="${escapeHTML(item.id)}"
                        aria-label="পড়া হয়েছে">
                  <i class="fa-solid fa-check"></i>
                </button>
              ` : `
                <i class="fa-solid fa-check"
                   style="color:#43e477;font-size:13px"
                   title="পড়া হয়েছে"></i>
              `}
            </div>
          </article>
        `;
      }).join("");

      list.querySelectorAll(".mark-one").forEach(button => {
        button.addEventListener("click", () => {
          markOneAsRead(button.dataset.id);
        });
      });
    }

    async function loadNotifications() {
      if (loading) return;
      loading = true;

      refreshBtn.disabled = true;
      refreshBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

      if (!getToken()) {
        unreadCount.textContent = "লগইন প্রয়োজন";
        showState(
          "fa-user-lock",
          "লগইন করো",
          "নোটিফিকেশন দেখতে তোমার FreeTube অ্যাকাউন্টে লগইন করতে হবে।",
          "লগইন",
          () => {
            window.location.href = "login.html";
          }
        );

        loading = false;
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = '<i class="fa-solid fa-rotate"></i>';
        return;
      }

      list.innerHTML = `
        <div class="loading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          নোটিফিকেশন লোড হচ্ছে...
        </div>
      `;

      try {
        const data = await apiRequest("/notifications");
        renderNotifications(data);
      } catch (error) {
        console.error("Notification loading error:", error);

        if (error.message === "LOGIN_REQUIRED" || error.status === 401) {
          showState(
            "fa-user-lock",
            "লগইন আবার করো",
            "তোমার লগইন সেশন শেষ হয়েছে অথবা টোকেন গ্রহণ করা হয়নি।",
            "লগইন",
            () => window.location.href = "login.html"
          );
        } else if (error.status === 404) {
          showState(
            "fa-triangle-exclamation",
            "API Route পাওয়া যায়নি (404)",
            "ব্যাকএন্ডে /api/notifications রুটটি নেই, অথবা Render-এ পুরোনো কোড চলছে। server.js ডিপ্লয়মেন্ট ও API_BASE ঠিক করো।",
            "আবার চেষ্টা করো",
            loadNotifications
          );
        } else if (error.status === 503) {
          showState(
            "fa-database",
            "সার্ভার প্রস্তুত নয়",
            "ব্যাকএন্ডের DATABASE_URL, ডেটাবেস সংযোগ ও সার্ভার কনফিগারেশন পরীক্ষা করো।",
            "আবার চেষ্টা করো",
            loadNotifications
          );
        } else {
          showState(
            "fa-triangle-exclamation",
            "নোটিফিকেশন লোড হয়নি",
            `সার্ভারের সঙ্গে সংযোগ বা অনুমতিতে সমস্যা হয়েছে। HTTP: ${error.status || "Network Error"}`,
            "আবার চেষ্টা করো",
            loadNotifications
          );
        }
      } finally {
        loading = false;
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = '<i class="fa-solid fa-rotate"></i>';
      }
    }

    async function markOneAsRead(id) {
      if (!id) return;

      try {
        await apiRequest(
          `/notifications/${encodeURIComponent(id)}/read`,
          { method: "PATCH" }
        );

        const item = notifications.find(
          notification => String(notification.id) === String(id)
        );

        if (item) item.read_at = new Date().toISOString();

        renderNotifications(notifications);
      } catch (error) {
        console.error("Mark one read error:", error);
        alert("নোটিফিকেশন পড়া হয়েছে হিসেবে চিহ্নিত করা যায়নি। আবার চেষ্টা করো।");
      }
    }

    async function markAllAsRead() {
      if (loading) return;

      markAllBtn.disabled = true;

      try {
        await apiRequest("/notifications/read-all", {
          method: "PATCH"
        });

        const now = new Date().toISOString();
        notifications = notifications.map(item => ({
          ...item,
          read_at: item.read_at || now
        }));

        renderNotifications(notifications);
      } catch (error) {
        console.error("Mark all read error:", error);
        alert("সব নোটিফিকেশন পড়া হয়েছে হিসেবে চিহ্নিত করা যায়নি।");
      } finally {
        markAllBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener("click", loadNotifications);
    markAllBtn.addEventListener("click", markAllAsRead);

    // পেজ খোলার সঙ্গে নোটিফিকেশন লোড হবে
    loadNotifications();
  </script>
</body>
</html>
