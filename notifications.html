<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Notifications | FreeTube</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --bg: #101010;
      --panel: #191919;
      --border: #303030;
      --green: #43e477;
      --muted: #aaa;
      --red: #e53935;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 85px;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
      font-family: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 72px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #181818;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      color: var(--green);
      font-size: 21px;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      color: #fff;
      background: transparent;
      border: 0;
      font-size: 19px;
      padding: 8px;
    }

    .mark-all {
      border: 0;
      border-radius: 9px;
      padding: 10px 12px;
      background: #292929;
      color: #fff;
      font-size: 12px;
    }

    .mark-all:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 22px 14px;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .page-heading h1 {
      font-size: 25px;
    }

    .unread-count {
      flex-shrink: 0;
      background: var(--red);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
    }

    .notification {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      margin-bottom: 11px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .notification.unread {
      background: #1b2b21;
      border-color: #316641;
    }

    .avatar {
      flex-shrink: 0;
      width: 45px;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #43e477, #e53935);
      font-size: 18px;
    }

    .notification-body {
      flex: 1;
      min-width: 0;
    }

    .message {
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .type {
      color: var(--green);
      text-transform: capitalize;
    }

    .notification-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .unread-dot {
      width: 9px;
      height: 9px;
      background: var(--green);
      border-radius: 50%;
    }

    .read-btn {
      color: #bbb;
      background: transparent;
      border: 0;
      padding: 4px;
      font-size: 15px;
    }

    .read-btn:hover {
      color: var(--green);
    }

    .state {
      text-align: center;
      padding: 55px 16px;
      color: var(--muted);
      line-height: 1.7;
    }

    .state > i {
      font-size: 43px;
      color: #555;
      margin-bottom: 16px;
    }

    .state h2 {
      font-size: 19px;
      color: #fff;
      margin-bottom: 8px;
    }

    .primary-btn {
      background: linear-gradient(100deg, #28c76f, #df3434);
      color: white;
      border: 0;
      padding: 11px 18px;
      border-radius: 9px;
      margin-top: 17px;
      font-weight: bold;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 2px calc(10px + env(safe-area-inset-bottom));
      background: #181818;
      border-top: 1px solid #333;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
      color: #999;
      text-decoration: none;
      font-size: 10px;
    }

    .nav-item i {
      font-size: 19px;
    }

    .nav-item.active {
      color: var(--green);
    }

    .error {
      margin-top: 12px;
      color: #ff8888;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .loading {
      text-align: center;
      padding: 45px 12px;
      color: var(--muted);
    }

    @media (max-width: 380px) {
      .brand { font-size: 17px; }
      .page-heading h1 { font-size: 21px; }
      .notification { padding: 10px; gap: 9px; }
      .avatar { width: 38px; height: 38px; }
      .mark-all { padding: 9px; }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="index.html">
      <i class="fa-solid fa-circle-play"></i> FreeTube
    </a>

    <div class="header-actions">
      <button class="mark-all" id="markAllBtn" type="button">
        <i class="fa-solid fa-check-double"></i>
        Mark all as read
      </button>

      <button class="icon-btn" id="refreshBtn"
        type="button" aria-label="Refresh notifications">
        <i class="fa-solid fa-rotate"></i>
      </button>
    </div>
  </header>

  <main>
    <div class="page-heading">
      <h1>Notifications</h1>
      <span class="unread-count" id="unreadCount">0 new</span>
    </div>

    <section id="notificationList" aria-live="polite">
      <div class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        Loading notifications...
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item" href="index.html">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>

    <a class="nav-item" href="discover.html">
      <i class="fa-solid fa-compass"></i>
      <span>Discover</span>
    </a>

    <a class="nav-item" href="create.html">
      <i class="fa-solid fa-circle-plus"></i>
      <span>Create</span>
    </a>

    <a class="nav-item active" href="notifications.html">
      <i class="fa-solid fa-bell"></i>
      <span>Notifications</span>
    </a>

    <a class="nav-item" href="profile.html">
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    "use strict";

    const API_BASE =
      "https://freetube-backend-a222.onrender.com/api";

    const list = document.getElementById("notificationList");
    const unreadCount = document.getElementById("unreadCount");
    const markAllBtn = document.getElementById("markAllBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    let notifications = [];
    let loading = false;

    function getToken() {
      return localStorage.getItem("freetube_access_token");
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function iconFor(type) {
      const icons = {
        like: "fa-heart",
        reaction: "fa-face-smile",
        comment: "fa-comment",
        follow: "fa-user-plus",
        message: "fa-envelope"
      };

      return icons[String(type || "").toLowerCase()] || "fa-bell";
    }

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function showState(icon, title, description, buttonText, callback) {
      list.innerHTML = `
        <div class="state">
          <i class="fa-solid ${icon}"></i>
          <h2>${escapeHTML(title)}</h2>
          <p>${escapeHTML(description)}</p>
          ${buttonText ? `
            <button class="primary-btn" id="stateButton" type="button">
              ${escapeHTML(buttonText)}
            </button>
          ` : ""}
          <p class="error" id="stateError"></p>
        </div>
      `;

      const button = document.getElementById("stateButton");
      if (button && callback) {
        button.addEventListener("click", callback);
      }
    }

    async function apiRequest(path, options = {}) {
      const token = getToken();

      if (!token) {
        const error = new Error("LOGIN_REQUIRED");
        error.status = 401;
        throw error;
      }

      const response = await fetch(API_BASE + path, {
        ...options,
        headers: {
          "Authorization": `Bearer ${token}`,
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      let data = {};

      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { error: text || "Invalid server response." };
      }

      if (!response.ok) {
        const error = new Error(
          data.error || data.message || `HTTP ${response.status}`
        );
        error.status = response.status;
        throw error;
      }

      return data;
    }

    function getItems(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data.notifications)) return data.notifications;
      if (Array.isArray(data.data)) return data.data;
      return [];
    }

    function renderNotifications(data) {
      notifications = getItems(data);

      const unread = notifications.filter(item => !item.read_at).length;
      unreadCount.textContent = `${unread} new`;

      markAllBtn.disabled = unread === 0;

      if (notifications.length === 0) {
        showState(
          "fa-bell-slash",
          "No notifications yet",
          "Likes, comments, follows and messages will appear here.",
          "Refresh",
          loadNotifications
        );
        return;
      }

      list.innerHTML = notifications.map(item => {
        const type = String(item.type || "notification").toLowerCase();
        const isUnread = !item.read_at;
        const message = item.message || "You have a new notification.";

        return `
          <article class="notification ${isUnread ? "unread" : ""}">
            <div class="avatar">
              <i class="fa-solid ${iconFor(type)}"></i>
            </div>

            <div class="notification-body">
              <div class="message">${escapeHTML(message)}</div>

              <div class="meta">
                <span class="type">
                  <i class="fa-solid ${iconFor(type)}"></i>
                  ${escapeHTML(type)}
                </span>
                <span>${escapeHTML(formatDate(item.created_at))}</span>
              </div>
            </div>

            <div class="notification-actions">
              ${isUnread ? `
                <span class="unread-dot" title="Unread"></span>
                <button class="read-btn" type="button"
                  data-id="${escapeHTML(item.id)}"
                  aria-label="Mark as read">
                  <i class="fa-solid fa-check"></i>
                </button>
              ` : `
                <i class="fa-solid fa-check"
                  style="color:#43e477" title="Read"></i>
              `}
            </div>
          </article>
        `;
      }).join("");

      list.querySelectorAll(".read-btn").forEach(button => {
        button.addEventListener("click", () => {
          markOneAsRead(button.dataset.id);
        });
      });
    }

    async function loadNotifications() {
      if (loading) return;
      loading = true;

      refreshBtn.disabled = true;
      refreshBtn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i>';

      try {
        if (!getToken()) {
          unreadCount.textContent = "Login required";

          showState(
            "fa-user-lock",
            "Please log in",
            "Log in to your FreeTube account to view notifications.",
            "Login",
            () => {
              window.location.href = "login.html";
            }
          );
          return;
        }

        list.innerHTML = `
          <div class="loading">
            <i class="fa-solid fa-spinner fa-spin"></i>
            Loading notifications...
          </div>
        `;

        const data = await apiRequest("/notifications");
        renderNotifications(data);

      } catch (error) {
        console.error("Notification error:", error);

        if (error.status === 401 || error.message === "LOGIN_REQUIRED") {
          showState(
            "fa-user-lock",
            "Login required",
            "Your session may have expired. Please log in again.",
            "Login",
            () => window.location.href = "login.html"
          );
        } else if (error.status === 404) {
          showState(
            "fa-triangle-exclamation",
            "API route not found (404)",
            "Check that the latest server.js is deployed and that /api/notifications exists on the backend.",
            "Try again",
            loadNotifications
          );
        } else if (error.status === 503) {
          showState(
            "fa-database",
            "Backend not ready",
            "Check the Render service logs and database configuration.",
            "Try again",
            loadNotifications
          );
        } else {
          showState(
            "fa-triangle-exclamation",
            "Could not load notifications",
            `Please check your internet connection and backend. Error: ${error.message}`,
            "Try again",
            loadNotifications
          );
        }
      } finally {
        loading = false;
        refreshBtn.disabled = false;
        refreshBtn.innerHTML = '<i class="fa-solid fa-rotate"></i>';
      }
    }

    async function markOneAsRead(id) {
      if (!id) return;

      try {
        await apiRequest(
          `/notifications/${encodeURIComponent(id)}/read`,
          { method: "PATCH" }
        );

        const item = notifications.find(
          entry => String(entry.id) === String(id)
        );

        if (item) item.read_at = new Date().toISOString();

        renderNotifications(notifications);
      } catch (error) {
        console.error("Mark as read error:", error);
        alert("Could not mark this notification as read. Please try again.");
      }
    }

    async function markAllAsRead() {
      if (loading || markAllBtn.disabled) return;

      markAllBtn.disabled = true;

      try {
        await apiRequest("/notifications/read-all", {
          method: "PATCH"
        });

        const now = new Date().toISOString();

        notifications = notifications.map(item => ({
          ...item,
          read_at: item.read_at || now
        }));

        renderNotifications(notifications);
      } catch (error) {
        console.error("Mark all as read error:", error);
        alert("Could not mark all notifications as read. Please try again.");
      } finally {
        markAllBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener("click", loadNotifications);
    markAllBtn.addEventListener("click", markAllAsRead);

    loadNotifications();
  </script>
</body>
</html>
