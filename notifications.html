<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10291f">
<title>Notifications — FreeTube</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --bg:#10291f;
  --panel:#172f24;
  --green:#00e991;
  --red:#ff5369;
  --text:#f6fff9;
  --muted:#a9bdb2;
  --border:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:linear-gradient(145deg,#65172f 0%,#35233a 35%,#123e2b 70%,#007b48 100%);
  background-attachment:fixed;
}
button,a{font:inherit}
button{cursor:pointer;color:inherit}
.app{
  max-width:650px;
  min-height:100dvh;
  margin:auto;
  padding-bottom:90px;
  background:rgba(16,41,31,.18);
}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 14px;
  background:rgba(30,30,33,.80);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.menu-btn,.search-btn{
  flex-shrink:0;width:38px;height:42px;
  display:grid;place-items:center;
  background:transparent;border:0;font-size:23px;
}
.topbar h1{
  flex:1;min-width:0;
  font-size:clamp(23px,6vw,34px);
  font-weight:850;letter-spacing:-.7px;
}
.search-panel{
  display:none;padding:12px 15px;
  background:rgba(23,47,36,.85);
  border-bottom:1px solid var(--border);
}
.search-panel.open{display:block}
.search-box{
  display:flex;align-items:center;gap:10px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(10,35,25,.55);
}
.search-box i{color:var(--green)}
.search-box input{
  width:100%;min-width:0;padding:13px 0;
  background:transparent;border:0;outline:0;color:#fff;
}
.search-box input::placeholder{color:var(--muted)}
.section-title{
  padding:14px 16px;
  font-size:20px;font-weight:850;
  background:rgba(24,28,28,.65);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.notification-list{padding:0}
.notification{
  display:flex;align-items:flex-start;gap:12px;
  padding:16px 15px 18px;
  background:rgba(31,48,61,.88);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.notification.unread{background:rgba(36,57,70,.96)}
.avatar-wrap{position:relative;flex-shrink:0;width:62px;height:62px}
.avatar{
  display:block;width:62px;height:62px;
  object-fit:cover;border-radius:50%;
  background:#20392d;
  border:1px solid rgba(255,255,255,.15);
}
.avatar-fallback{
  display:grid;place-items:center;
  width:62px;height:62px;border-radius:50%;
  background:linear-gradient(140deg,#164d39,#263d54);
  color:#fff;font-size:25px;
}
.action-badge{
  position:absolute;right:-3px;bottom:-2px;
  width:30px;height:30px;
  display:grid;place-items:center;
  border:2px solid #243946;border-radius:50%;
  background:#269b48;color:#fff;font-size:14px;
}
.action-badge.like{background:#168dff}
.action-badge.love{background:#e52e55}
.action-badge.comment{background:#269b48}
.action-badge.follow{background:#269b48}
.action-badge.message{background:#168dff}
.action-badge.other{background:#6d7480}
.notification-body{flex:1;min-width:0;padding-top:1px}
.message{
  font-size:16px;line-height:1.48;
  overflow-wrap:anywhere;color:#f6f8fb;
}
.user-name,.action-name{
  font-weight:900;
  color:#fff;
}
.time{margin-top:5px;color:#b6c0c9;font-size:14px}
.notification-actions{
  flex-shrink:0;display:flex;align-items:center;gap:5px;
}
.more-btn,.read-btn{
  width:28px;height:28px;
  display:grid;place-items:center;
  border:0;border-radius:50%;
  background:transparent;color:#e0e7ed;
}
.more-btn{font-size:16px}
.read-btn{color:var(--green);font-size:14px}
.more-btn:active,.read-btn:active{background:rgba(255,255,255,.12)}
.empty-state,.loading-state{
  padding:42px 18px;text-align:center;
  color:var(--muted);line-height:1.8;
}
.empty-state>i,.loading-state>i{
  color:var(--green);font-size:35px;margin-bottom:12px;
}
.empty-state h2{color:#fff;font-size:19px;margin-bottom:6px}
.primary-btn,.secondary-btn{
  margin-top:14px;padding:11px 17px;
  border:1px solid var(--border);border-radius:11px;
  font-weight:750;
}
.primary-btn{background:linear-gradient(110deg,var(--red),#00bd78)}
.secondary-btn{background:#20392d}
.bottom-nav{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  z-index:30;width:100%;max-width:650px;
  display:flex;align-items:center;justify-content:space-around;
  padding:9px 3px calc(9px + env(safe-area-inset-bottom));
  background:rgba(16,41,31,.65);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-top:1px solid rgba(255,255,255,.15);
}
.nav-item{
  flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;
  color:var(--muted);text-decoration:none;font-size:11px;
}
.nav-item i{font-size:21px}
.nav-item.active{color:var(--green)}
.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
  z-index:60;display:none;max-width:90%;
  padding:12px 16px;border:1px solid var(--border);
  border-radius:12px;background:rgba(23,47,36,.97);
  font-size:13px;text-align:center;
}
.toast.show{display:block}
@media(max-width:380px){
  .topbar{gap:7px;padding-left:10px;padding-right:10px}
  .topbar h1{font-size:23px}
  .notification{padding:13px 10px;gap:9px}
  .avatar-wrap,.avatar,.avatar-fallback{width:50px;height:50px}
  .action-badge{width:25px;height:25px;font-size:11px}
  .message{font-size:14px}
  .section-title{font-size:18px}
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
  <button class="menu-btn" id="menuButton" aria-label="Open settings">
    <i class="fa-solid fa-bars"></i>
  </button>
  <h1>Notifications</h1>
  <button class="search-btn" id="searchToggle" aria-label="Search notifications">
    <i class="fa-solid fa-magnifying-glass"></i>
  </button>
</header>

<section class="search-panel" id="searchPanel">
  <label class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="searchInput" type="search" placeholder="Search notifications..." autocomplete="off">
  </label>
</section>

<section>
  <h2 class="section-title">New</h2>
  <div id="newList" class="notification-list">
    <div class="loading-state">
      <i class="fa-solid fa-spinner fa-spin"></i><br>
      Loading notifications...
    </div>
  </div>
</section>

<section>
  <h2 class="section-title">Earlier</h2>
  <div id="earlierList" class="notification-list"></div>
</section>

<nav class="bottom-nav" aria-label="Main navigation">
  <a class="nav-item" href="home.html">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </a>
  <a class="nav-item" href="discover.html">
    <i class="fa-solid fa-compass"></i><span>Pulse</span>
  </a>
  <a class="nav-item active" href="notifications.html" aria-current="page">
    <i class="fa-solid fa-bell"></i><span>Notifications</span>
  </a>
  <a class="nav-item" href="profile.html">
    <i class="fa-regular fa-user"></i><span>Profile</span>
  </a>
</nav>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
"use strict";

const API_BASE="https://freetube-backend-a222.onrender.com/api";
const TOKEN_KEY="freetube_access_token";

const newList=document.getElementById("newList");
const earlierList=document.getElementById("earlierList");
const searchPanel=document.getElementById("searchPanel");
const searchInput=document.getElementById("searchInput");
const toast=document.getElementById("toast");

let notifications=[];
let loading=false;
let toastTimer=null;

function getToken(){
  try{return localStorage.getItem(TOKEN_KEY)||""}
  catch(_){return ""}
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function showToast(message){
  toast.textContent=String(message||"Something went wrong.");
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove("show"),2800);
}

function getActor(item){
  return String(
    item.actor_display_name ||
    item.actor_username ||
    item.username ||
    item.display_name ||
    item.sender_name ||
    ""
  ).trim();
}

/*
  Determine the exact action from the notification type and message.
  Love reactions are recognized if the backend sends a love-specific type
  or a message explicitly describing a love reaction.
*/
function getAction(item){
  const type=String(item.type||item.notification_type||"").toLowerCase();
  const message=String(item.message||"").toLowerCase();
  const combined=type+" "+message;

  if(/\blove\b|\bloved\b|\bhearts?\b/.test(combined) &&
     /(react|reaction|love|heart)/.test(combined)){
    return "love";
  }

  if(type.includes("comment") || type.includes("mention") ||
     /\bcommented\b|\bcomment\b|\bmentioned you\b/.test(message)){
    return "comment";
  }

  if(type.includes("like") || /\bliked your post\b/.test(message)){
    return "like";
  }

  if(type.includes("follow") || /\bstarted following\b|\bfollowed you\b/.test(message)){
    return "follow";
  }

  if(type.includes("message") || /\bnew message\b|\bsent you a message\b/.test(message)){
    return "message";
  }

  if(type.includes("story") || message.includes("story")){
    return "story";
  }

  return "other";
}

function actionIcon(action){
  const icons={
    comment:"fa-comment",
    like:"fa-thumbs-up",
    love:"fa-heart",
    follow:"fa-user-plus",
    message:"fa-comment-dots",
    story:"fa-book-open",
    other:"fa-bell"
  };
  return icons[action]||icons.other;
}

function actionLabel(action){
  const labels={
    comment:"Comment",
    like:"Like",
    love:"Love",
    follow:"Following",
    message:"Message",
    story:"Story",
    other:"Notification"
  };
  return labels[action]||labels.other;
}

function timeAgo(value){
  if(!value)return "Recently";
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return String(value);

  const minutes=Math.max(0,Math.floor((Date.now()-date.getTime())/60000));
  if(minutes<1)return "Just now";
  if(minutes<60)return minutes+"m";

  const hours=Math.floor(minutes/60);
  if(hours<24)return hours+"h";

  const days=Math.floor(hours/24);
  if(days<7)return days+"d";

  return date.toLocaleDateString();
}

/*
  Prefer the API message, but bold the actor's name and action words.
  If no message exists, construct one from the known notification type.
*/
function buildMessage(item){
  const actor=getActor(item);
  const action=getAction(item);
  const raw=String(item.message||item.body||"");

  if(!raw){
    const phrases={
      comment:"commented on your post.",
      like:"liked your post.",
      love:"reacted love to your post.",
      follow:"started following you.",
      message:"sent you a message.",
      story:"added to their story.",
      other:"sent you a notification."
    };
    return (actor
      ?'<strong class="user-name">'+escapeHTML(actor)+'</strong> '
      :"")+
      '<strong class="action-name">'+escapeHTML(phrases[action])+'</strong>';
  }

  let output=escapeHTML(raw);

  // Highlight the username returned by the API.
  if(actor){
    const escaped=escapeHTML(actor).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    output=output.replace(
      new RegExp(escaped,"ig"),
      match=>'<strong class="user-name">'+match+"</strong>"
    );
  }

  // Highlight action phrases, including phrases such as "reacted love".
  const phrases=[
    /\bstarted following\b/gi,
    /\breacted love\b/gi,
    /\breacted like\b/gi,
    /\breacted\b/gi,
    /\bcommented\b/gi,
    /\bcomment\b/gi,
    /\bmentioned\b/gi,
    /\bliked\b/gi,
    /\blike\b/gi,
    /\bfollowing\b/gi,
    /\bfollowed\b/gi,
    /\blove\b/gi,
    /\bshared\b/gi,
    /\breplied\b/gi,
    /\bsent you a message\b/gi
  ];

  for(const regex of phrases){
    output=output.replace(regex,match=>{
      if(match.includes('class="action-name"'))return match;
      return '<strong class="action-name">'+match+"</strong>";
    });
  }

  return output;
}

function normalize(item,index){
  const actorObject=item.actor||item.sender||item.user||{};
  return {
    id:String(item.id??item.notification_id??index),
    type:String(item.type||item.notification_type||"notification").toLowerCase(),
    actorName:getActor(item)||String(
      actorObject.display_name||actorObject.username||""
    ),
    avatar:
      item.actor_avatar_url||
      item.actor_avatar||
      item.avatar_url||
      item.avatar||
      item.profile_picture||
      actorObject.avatar_url||
      actorObject.avatar||
      "",
    message:item.message||item.body||"",
    created:item.created_at||item.createdAt||item.time||"",
    read:Boolean(item.read_at||item.is_read===true||item.read===true),
    original:item
  };
}

function renderItem(item){
  const action=getAction(item);
  const icon=actionIcon(action);
  const avatarHTML=item.avatar
    ?'<img class="avatar" src="'+escapeHTML(item.avatar)+
      '" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false">'+
      '<span class="avatar-fallback" hidden><i class="fa-solid fa-user"></i></span>'
    :'<span class="avatar-fallback"><i class="fa-solid fa-user"></i></span>';

  return `
    <article class="notification ${item.read?"":"unread"}" data-id="${escapeHTML(item.id)}">
      <div class="avatar-wrap">
        ${avatarHTML}
        <span class="action-badge ${action}" title="${escapeHTML(actionLabel(action))}">
          <i class="fa-solid ${icon}"></i>
        </span>
      </div>

      <div class="notification-body">
        <div class="message">${buildMessage(item.original)}</div>
        <div class="time">${escapeHTML(timeAgo(item.created))}</div>
      </div>

      <div class="notification-actions">
        <button class="more-btn" type="button"
          data-more="${escapeHTML(item.id)}" aria-label="Notification options">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
        ${item.read?"":`
          <button class="read-btn" type="button"
            data-read="${escapeHTML(item.id)}" aria-label="Mark as read">
            <i class="fa-solid fa-check"></i>
          </button>
        `}
      </div>
    </article>
  `;
}

function render(){
  const query=searchInput.value.trim().toLowerCase();

  const filtered=notifications.filter(item=>{
    const text=[
      item.actorName,
      item.message,
      item.type,
      getAction(item)
    ].join(" ").toLowerCase();
    return !query||text.includes(query);
  });

  const newItems=filtered.filter(item=>!item.read);
  const earlierItems=filtered.filter(item=>item.read);

  newList.innerHTML=newItems.length
    ?newItems.map(renderItem).join("")
    :'<div class="empty-state"><i class="fa-solid fa-bell-slash"></i><br><h2>No new notifications</h2></div>';

  earlierList.innerHTML=earlierItems.length
    ?earlierItems.map(renderItem).join("")
    :'<div class="empty-state">No earlier notifications.</div>';

  document.querySelectorAll("[data-read]").forEach(button=>{
    button.addEventListener("click",()=>markOneAsRead(button.dataset.read));
  });

  document.querySelectorAll("[data-more]").forEach(button=>{
    button.addEventListener("click",()=>{
      const item=notifications.find(n=>n.id===button.dataset.more);
      if(!item)return;
      if(!item.read)markOneAsRead(item.id);
      else showToast("This notification is already read.");
    });
  });
}

async function apiRequest(path,options={}){
  const token=getToken();
  if(!token){
    const error=new Error("LOGIN_REQUIRED");
    error.status=401;
    throw error;
  }

  let response;
  try{
    response=await fetch(API_BASE+path,{
      ...options,
      headers:{
        Authorization:"Bearer "+token,
        ...(options.body?{"Content-Type":"application/json"}:{}),
        ...(options.headers||{})
      },
      cache:"no-store"
    });
  }catch(_){
    throw new Error("Backend-এ সংযোগ হচ্ছে না। ইন্টারনেট পরীক্ষা করো।");
  }

  const raw=await response.text();
  let data={};
  try{data=raw?JSON.parse(raw):{}}
  catch(_){data={message:raw}}

  if(!response.ok){
    const error=new Error(data.message||data.error||("API error "+response.status));
    error.status=response.status;
    throw error;
  }
  return data;
}

function showError(title,description,login=false){
  newList.innerHTML=`
    <div class="empty-state">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <h2>${escapeHTML(title)}</h2>
      <p>${escapeHTML(description)}</p>
      <button class="primary-btn" id="retryBtn">${login?"Login":"Try again"}</button>
    </div>`;
  earlierList.innerHTML="";
  document.getElementById("retryBtn").addEventListener("click",()=>{
    if(login)location.href="auth.html?mode=login";
    else loadNotifications();
  });
}

async function loadNotifications(){
  if(loading)return;
  loading=true;

  newList.innerHTML='<div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i><br>Loading notifications...</div>';
  earlierList.innerHTML="";

  try{
    if(!getToken()){
      showError("Please log in","Log in to view your notifications.",true);
      return;
    }

    const data=await apiRequest("/notifications");
    const items=Array.isArray(data)
      ?data
      :(data.notifications||data.data||data.items||[]);

    notifications=items.map(normalize);
    render();
  }catch(error){
    console.error("Notification loading failed:",error);
    if(error.status===401||error.message==="LOGIN_REQUIRED"){
      showError("Login required","Your login session may have expired.",true);
    }else{
      showError("Could not load notifications",error.message||"Please try again.");
    }
  }finally{
    loading=false;
  }
}

async function markOneAsRead(id){
  if(!id)return;
  const item=notifications.find(n=>n.id===String(id));
  if(!item||item.read)return;

  try{
    await apiRequest(
      "/notifications/"+encodeURIComponent(id)+"/read",
      {method:"PATCH"}
    );
    item.read=true;
    item.original.read_at=new Date().toISOString();
    render();
  }catch(error){
    showToast("Could not mark as read: "+error.message);
  }
}

async function markAllAsRead(){
  if(loading||!notifications.some(item=>!item.read))return;

  try{
    await apiRequest("/notifications/read-all",{method:"PATCH"});
    const now=new Date().toISOString();
    notifications.forEach(item=>{
      item.read=true;
      item.original.read_at=item.original.read_at||now;
    });
    render();
    showToast("All notifications marked as read.");
  }catch(error){
    showToast("Could not mark notifications as read: "+error.message);
  }
}

document.getElementById("menuButton").addEventListener("click",()=>{
  location.href="settings.html";
});

document.getElementById("searchToggle").addEventListener("click",()=>{
  searchPanel.classList.toggle("open");
  if(searchPanel.classList.contains("open")){
    searchInput.focus();
  }else{
    searchInput.value="";
    render();
  }
});

searchInput.addEventListener("input",render);
loadNotifications();
</script>
</body>
</html>
