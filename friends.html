<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17142e"><title>Boys vs Girls 💙💗 — Friends</title><style>
:root{color-scheme:dark;--bg:#100f20;--panel:#19182e;--panel2:#24213d;--text:#f8f7ff;--muted:#aaa7c7;--blue:#60a5fa;--pink:#fb7185;--green:#55e6b0;--border:#ffffff20}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0 0,#263d6c66,transparent 45%),radial-gradient(ellipse at 100% 10%,#77344f55,transparent 40%),var(--bg);color:var(--text);font:15px Arial,sans-serif}.app{max-width:650px;margin:auto;min-height:100vh;padding:0 14px 90px}.top{position:sticky;top:0;background:#100f20eF;backdrop-filter:blur(12px);padding:16px 2px;z-index:2;border-bottom:1px solid var(--border)}h1{font-size:22px;margin:0 0 14px}.tabs{display:flex;gap:8px}.tabs button,.action,.refresh{border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--text);padding:10px 13px;font-weight:700}.tabs button.active{background:linear-gradient(120deg,var(--blue),#a78bfa,var(--pink));color:#151328;border:0}.searchrow{display:flex;gap:8px;margin:14px 0}.searchrow input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text)}.status{color:var(--muted);font-size:13px;padding:8px 2px}.person{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;margin:10px 0}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--panel2);display:grid;place-items:center;font-weight:bold;color:var(--blue);flex-shrink:0}.details{flex:1;min-width:0}.name{font-weight:800;overflow-wrap:anywhere}.handle{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.action{padding:8px 10px;font-size:12px}.accept{background:#55e6b0;color:#10251e}.danger{color:#ff9cac}.empty{text-align:center;padding:36px 12px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#100f20f2;border-top:1px solid var(--border);display:flex;justify-content:center;gap:26px;padding:14px}.bottom a{color:var(--muted);text-decoration:none;font-size:13px}.bottom a.active{color:var(--blue)}@media(max-width:420px){.person{align-items:flex-start;flex-wrap:wrap}.actions{width:100%;justify-content:flex-start;margin-left:60px}.tabs button{padding:9px 10px;font-size:12px}}
</style></head><body><main class="app"><header class="top"><h1>Friends 💙💗</h1><nav class="tabs"><button class="active" data-tab="friends">Friends</button><button data-tab="incoming">Requests <span id="badge"></span></button><button data-tab="sent">Sent</button></nav></header><div class="searchrow"><input id="search" placeholder="Search this list…" autocomplete="off"><button class="refresh" id="refresh">Refresh</button></div><div id="status" class="status">Loading…</div><section id="list"></section></main><nav class="bottom"><a href="home.html">Home</a><a href="discover.html">Discover</a><a href="create.html">Create</a><a href="notifications.html">Notifications</a><a href="profile.html">Profile</a></nav><script>
(()=>{'use strict';const API='https://freetube-backend-a222.onrender.com/api';const token=()=>localStorage.getItem('freetube_access_token')||'';let tab='friends',friends=[],incoming=[],sent=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token(),...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||d.message||'Request failed ('+r.status+')');return d}function arr(d,...keys){for(const k of keys){let v=k.split('.').reduce((a,b)=>a?.[b],d);if(Array.isArray(v))return v}return[]}function id(x){return String(x.id??x.request_id??'')}function personId(x){return String(x.user_id??x.friend_id??x.sender_id??x.recipient_id??x.id??'')}function title(x){return x.display_name||x.full_name||x.username||'User'}function card(x,kind){let uid=kind==='incoming'?String(x.sender_id||''):kind==='sent'?String(x.recipient_id||''):personId(x);let name=title(x),avatar=x.avatar_url?`<img class="avatar" src="${esc(x.avatar_url)}" alt="">`:`<div class="avatar">${esc(name.slice(0,1).toUpperCase())}</div>`;let actions='';if(kind==='incoming')actions=`<button class="action accept" data-act="accept" data-id="${esc(id(x))}">Accept</button><button class="action danger" data-act="decline" data-id="${esc(id(x))}">Decline</button>`;else if(kind==='sent')actions=`<button class="action danger" data-act="cancel" data-id="${esc(id(x))}">Cancel request</button>`;else actions=`<button class="action danger" data-act="remove" data-id="${esc(uid)}">Remove friend</button>`;return `<article class="person">${avatar}<div class="details"><div class="name">${esc(name)}</div><div class="handle">${x.username?'@'+esc(x.username):'Boys vs Girls member'}</div></div><div class="actions">${actions}</div></article>`}function render(){let data=tab==='friends'?friends:tab==='incoming'?incoming:sent;const q=$('search').value.trim().toLowerCase();data=data.filter(x=>(title(x)+' '+(x.username||'')).toLowerCase().includes(q));$('badge').textContent=incoming.length?'('+incoming.length+')':'';$('list').innerHTML=data.length?data.map(x=>card(x,tab==='friends'?'friends':tab)).join(''):`<div class="empty">${q?'No matching people found.':tab==='friends'?'You have no friends yet.':tab==='incoming'?'No pending friend requests.':'No sent requests.'}</div>`}async function load(){if(!token()){location.href='login.html';return}$('status').textContent='Loading your friends…';try{const [f,r,s]=await Promise.all([api('/friends'),api('/friends/requests'),api('/friends/requests/sent')]);friends=arr(f,'friends','data.friends','data.data.friends');incoming=arr(r,'requests','incoming','data.requests','data.incoming').filter(x=>(x.status||'pending')==='pending');sent=arr(s,'requests','sent','data.requests','data.sent').filter(x=>(x.status||'pending')==='pending');$('status').textContent=`${friends.length} friends · ${incoming.length} incoming · ${sent.length} sent`;render()}catch(e){$('status').textContent=e.message;$('list').innerHTML='<div class="empty">Could not load this list. Check your connection and refresh.</div>'}}async function act(btn){const action=btn.dataset.act,reqId=btn.dataset.id;btn.disabled=true;try{if(action==='accept'||action==='decline')await api('/friends/requests/'+encodeURIComponent(reqId),{method:'PATCH',body:JSON.stringify({action})});else if(action==='cancel')await api('/friends/requests/'+encodeURIComponent(reqId),{method:'DELETE'});else if(action==='remove'){if(!confirm('Remove this friend?'))return;await api('/friends/'+encodeURIComponent(reqId),{method:'DELETE'})}await load()}catch(e){alert(e.message)}finally{btn.disabled=false}}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()}));$('search').addEventListener('input',render);$('refresh').addEventListener('click',load);$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(b)act(b)});load()})();
</script></body></html>
