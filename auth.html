<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17132f">
<title>Boys vs Girls 💙💗 — Login & Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --bg:#100f24;
  --panel:rgba(28,25,58,.88);
  --blue:#4295ff;
  --purple:#9565ff;
  --pink:#ff5ebc;
  --text:#faf9ff;
  --muted:#b4b0d0;
  --border:rgba(255,255,255,.13);
}
*{
  margin:0;padding:0;box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
html{min-height:100%;background:var(--bg)}
body{
  min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:center;
  padding:24px 0;
  color:var(--text);
  background:
    radial-gradient(ellipse at 0% 0%,rgba(66,100,255,.28),transparent 42%),
    radial-gradient(ellipse at 100% 20%,rgba(255,74,184,.22),transparent 42%),
    radial-gradient(ellipse at 50% 100%,rgba(135,76,255,.17),transparent 45%),
    linear-gradient(145deg,#101024,#1b1538 55%,#10172e);
  overflow-x:hidden;
}
button,input{font:inherit}
button{cursor:pointer}
.bg-circle{
  position:fixed;border-radius:50%;
  filter:blur(65px);z-index:0;pointer-events:none;
}
.bg1{
  width:230px;height:230px;
  background:rgba(64,130,255,.2);
  top:-70px;left:-80px;
}
.bg2{
  width:240px;height:240px;
  background:rgba(255,68,183,.18);
  right:-100px;bottom:-60px;
}
.container{
  position:relative;z-index:1;
  width:100%;max-width:430px;
  padding:18px;
}
.brand{
  text-align:center;margin:0 0 23px;
}
.brand-logo{
  width:66px;height:66px;margin:0 auto 13px;
  display:grid;place-items:center;
  border-radius:22px;
  background:linear-gradient(135deg,var(--blue),var(--purple),var(--pink));
  box-shadow:0 8px 30px rgba(133,91,255,.28);
  font-size:28px;color:white;
}
.brand h1{
  font-size:clamp(25px,7vw,33px);
  font-weight:900;letter-spacing:-.8px;
  background:linear-gradient(100deg,#fff,#b9caff 48%,#ff9ad8);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.brand p{
  margin-top:8px;color:var(--muted);font-size:13px;
}
.form-box{
  width:100%;
  padding:28px 23px;
  background:var(--panel);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);
  border-radius:25px;
  box-shadow:0 20px 55px rgba(0,0,0,.28);
  display:none;text-align:center;
}
.form-box.active{display:block}
.header-icon{
  width:59px;height:59px;margin:0 auto 15px;
  display:flex;justify-content:center;align-items:center;
  color:white;font-size:22px;border-radius:19px;
  background:linear-gradient(135deg,rgba(66,149,255,.25),rgba(149,101,255,.3),rgba(255,94,188,.2));
  border:1px solid rgba(177,157,255,.3);
}
.form-box h2{
  color:#fff;font-size:25px;font-weight:850;
  margin-bottom:7px;
}
.sub-title{
  color:var(--muted);font-size:13px;
  line-height:1.6;margin-bottom:23px;
}
.input-field{
  position:relative;margin-bottom:14px;
}
.input-field>i.field-icon{
  position:absolute;left:17px;top:50%;
  transform:translateY(-50%);
  color:#aaa3dc;font-size:15px;pointer-events:none;
}
.input-field input{
  width:100%;min-width:0;
  padding:15px 45px 15px 44px;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  background:rgba(9,9,30,.48);
  border-radius:15px;color:#fff;
  font-size:14px;transition:border-color .2s,box-shadow .2s;
}
.input-field input:focus{
  border-color:#9b80ff;
  box-shadow:0 0 0 3px rgba(149,101,255,.13);
  background:rgba(12,12,36,.72);
}
.input-field input::placeholder{color:#aaa7c4}
.toggle-password{
  position:absolute;right:15px;top:50%;
  transform:translateY(-50%);
  color:#aaa7c4;cursor:pointer;padding:7px;
}
.submit-btn{
  width:100%;padding:15px;
  border:0;border-radius:15px;
  background:linear-gradient(110deg,var(--blue),var(--purple) 55%,var(--pink));
  color:#fff;font-weight:850;font-size:14px;
  letter-spacing:.5px;
  box-shadow:0 8px 22px rgba(121,87,255,.23);
  transition:opacity .2s,transform .2s;
  margin-top:5px;
}
.submit-btn:active{transform:scale(.985)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.switch-link{
  margin-top:22px;font-size:13px;
  color:var(--muted);line-height:1.8;
}
.switch-link button{
  background:none;border:0;
  color:#c0a8ff;font-size:14px;font-weight:800;
  margin-left:5px;
}
.switch-link button:hover{color:#ff9ad8}
.status-message{
  display:none;margin:0 0 15px;padding:12px;
  border-radius:12px;font-size:13px;
  line-height:1.6;overflow-wrap:anywhere;text-align:left;
}
.status-message.show{display:block}
.status-message.error{
  background:rgba(255,67,103,.12);
  border:1px solid rgba(255,95,127,.35);color:#ffdce4;
}
.status-message.success{
  background:rgba(72,176,255,.12);
  border:1px solid rgba(104,157,255,.35);color:#e2eaff;
}
.forgot-note{
  margin:1px 0 13px;text-align:right;
  font-size:12px;color:#c0a8ff;
}
.footer-note{
  text-align:center;color:#8582a8;
  font-size:11px;line-height:1.7;
  margin-top:20px;
}
@media(max-width:360px){
  .container{padding:12px}
  .form-box{padding:24px 17px}
  .brand{margin-bottom:17px}
  .brand-logo{width:58px;height:58px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>

<body>
<div class="bg-circle bg1"></div>
<div class="bg-circle bg2"></div>

<main class="container">
  <header class="brand">
    <div class="brand-logo"><i class="fa-solid fa-users"></i></div>
    <h1>Boys vs Girls 💙💗</h1>
    <p>Connect, share and make new friends.</p>
  </header>

  <section class="form-box signup-box active" id="signupBox">
    <div class="header-icon"><i class="fa-solid fa-user-plus"></i></div>
    <h2>Create Account</h2>
    <p class="sub-title">Join Boys vs Girls and meet your community.</p>

    <div id="signupStatus" class="status-message" role="status" aria-live="polite"></div>

    <form id="signupForm">
      <div class="input-field">
        <i class="field-icon fa-solid fa-user"></i>
        <input type="text" id="signup-name" name="full_name"
          placeholder="Full Name" autocomplete="name"
          minlength="2" maxlength="80" required>
      </div>

      <div class="input-field">
        <i class="field-icon fa-solid fa-envelope"></i>
        <input type="email" id="signup-email" name="email"
          placeholder="Email Address" autocomplete="email"
          maxlength="254" required>
      </div>

      <div class="input-field">
        <i class="field-icon fa-solid fa-lock"></i>
        <input type="password" id="signup-password" name="password"
          placeholder="Password (at least 8 characters)"
          autocomplete="new-password" minlength="8" maxlength="128" required>
        <i class="fa-solid fa-eye-slash toggle-password"
          data-target="signup-password" role="button" tabindex="0"
          aria-label="Show password"></i>
      </div>

      <div class="input-field">
        <i class="field-icon fa-solid fa-shield-halved"></i>
        <input type="password" id="signup-confirm-password"
          name="confirmPassword" placeholder="Confirm Password"
          autocomplete="new-password" minlength="8" maxlength="128" required>
        <i class="fa-solid fa-eye-slash toggle-password"
          data-target="signup-confirm-password" role="button" tabindex="0"
          aria-label="Show confirm password"></i>
      </div>

      <button type="submit" class="submit-btn" id="signupButton">
        CREATE ACCOUNT <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="switch-link">
      <span>Already have an account?</span>
      <button type="button" id="to-login">Login</button>
    </div>
  </section>

  <section class="form-box login-box" id="loginBox">
    <div class="header-icon"><i class="fa-solid fa-lock"></i></div>
    <h2>Welcome Back</h2>
    <p class="sub-title">Log in to continue to your community.</p>

    <div id="loginStatus" class="status-message" role="status" aria-live="polite"></div>

    <form id="loginForm">
      <div class="input-field">
        <i class="field-icon fa-solid fa-user"></i>
        <input type="text" id="login-identifier" name="identifier"
          placeholder="Email Address or Username" autocomplete="username"
          maxlength="255" required>
      </div>

      <div class="input-field">
        <i class="field-icon fa-solid fa-lock"></i>
        <input type="password" id="login-password" name="password"
          placeholder="Password" autocomplete="current-password" required>
        <i class="fa-solid fa-eye-slash toggle-password"
          data-target="login-password" role="button" tabindex="0"
          aria-label="Show password"></i>
      </div>

      <button type="submit" class="submit-btn" id="loginButton">
        LOGIN <i class="fa-solid fa-arrow-right-to-bracket"></i>
      </button>
    </form>

    <div class="switch-link">
      <span>Don't have an account?</span>
      <button type="button" id="to-signup">Sign Up</button>
    </div>
  </section>

  <p class="footer-note">Boys vs Girls 💙💗 · Connect with your community</p>
</main>

<script>
(function(){
  "use strict";

  const API_BASE_URL="https://freetube-backend-a222.onrender.com/api";
  const TOKEN_KEY="freetube_access_token";

  const signupBox=document.getElementById("signupBox");
  const loginBox=document.getElementById("loginBox");
  const signupForm=document.getElementById("signupForm");
  const loginForm=document.getElementById("loginForm");
  const signupButton=document.getElementById("signupButton");
  const loginButton=document.getElementById("loginButton");
  const signupStatus=document.getElementById("signupStatus");
  const loginStatus=document.getElementById("loginStatus");

  function showForm(name){
    const login=name==="login";
    signupBox.classList.toggle("active",!login);
    loginBox.classList.toggle("active",login);
    clearStatus(signupStatus);
    clearStatus(loginStatus);
  }

  document.getElementById("to-login").addEventListener("click",()=>showForm("login"));
  document.getElementById("to-signup").addEventListener("click",()=>showForm("signup"));

  function showStatus(element,message,type){
    element.textContent=message;
    element.className="status-message show "+type;
  }

  function clearStatus(element){
    element.textContent="";
    element.className="status-message";
  }

  function setLoading(button,loading,normalText){
    button.disabled=loading;
    button.textContent=loading?"Please wait...":normalText;
  }

  function getToken(){
    try{return localStorage.getItem(TOKEN_KEY)||""}
    catch(_){return ""}
  }

  function saveToken(token){
    try{
      localStorage.setItem(TOKEN_KEY,token);
      return localStorage.getItem(TOKEN_KEY)===token;
    }catch(_){return false}
  }

  function clearToken(){
    try{localStorage.removeItem(TOKEN_KEY)}catch(_){}
  }

  async function apiRequest(path,options={}){
    let response;
    try{
      response=await fetch(API_BASE_URL+path,{
        ...options,
        headers:{
          "Content-Type":"application/json",
          ...(options.headers||{})
        }
      });
    }catch(_){
      throw new Error("Could not connect to the server. Check your internet connection and try again.");
    }

    const raw=await response.text();
    let data={};
    try{data=raw?JSON.parse(raw):{}}
    catch(_){data={message:raw}}

    if(!response.ok){
      throw new Error(data.error||data.message||("Request failed (HTTP "+response.status+")."));
    }
    return data;
  }

  function extractToken(data){
    return data.token||
      data.accessToken||
      data.access_token||
      (data.data&&(data.data.token||data.data.accessToken||data.data.access_token))||
      null;
  }

  function getErrorMessage(error){
    return error.message||"Something went wrong. Please try again.";
  }

  async function checkExistingSession(){
    const token=getToken();
    if(!token)return;

    try{
      const response=await fetch(API_BASE_URL+"/auth/me",{
        method:"GET",
        headers:{"Authorization":"Bearer "+token},
        cache:"no-store"
      });

      if(response.ok){
        window.location.replace("home.html");
        return;
      }

      if(response.status===401||response.status===403)clearToken();
    }catch(_){
      // Keep the login form available when the server is offline.
    }
  }

  document.querySelectorAll(".toggle-password").forEach(icon=>{
    function togglePassword(){
      const input=document.getElementById(icon.dataset.target);
      if(!input)return;

      const showing=input.type==="password";
      input.type=showing?"text":"password";
      icon.classList.toggle("fa-eye",showing);
      icon.classList.toggle("fa-eye-slash",!showing);
      icon.setAttribute("aria-label",showing?"Hide password":"Show password");
    }

    icon.addEventListener("click",togglePassword);
    icon.addEventListener("keydown",event=>{
      if(event.key==="Enter"||event.key===" "){
        event.preventDefault();
        togglePassword();
      }
    });
  });

  // CREATE ACCOUNT
  signupForm.addEventListener("submit",async event=>{
    event.preventDefault();
    clearStatus(signupStatus);

    const fullName=document.getElementById("signup-name").value.trim();
    const email=document.getElementById("signup-email").value.trim();
    const password=document.getElementById("signup-password").value;
    const confirmPassword=document.getElementById("signup-confirm-password").value;

    if(fullName.length<2){
      showStatus(signupStatus,"Please enter your full name.","error");
      return;
    }

    if(new TextEncoder().encode(password).length>128){
      showStatus(signupStatus,"Password is too long.","error");
      return;
    }

    if(password.length<8){
      showStatus(signupStatus,"Password must contain at least 8 characters.","error");
      return;
    }

    if(password!==confirmPassword){
      showStatus(signupStatus,"Passwords do not match.","error");
      return;
    }

    setLoading(signupButton,true,"Creating account...");

    try{
      const data=await apiRequest("/auth/register",{
        method:"POST",
        body:JSON.stringify({
          full_name:fullName,
          email:email,
          password:password
        })
      });

      const token=extractToken(data);

      if(token){
        if(!saveToken(token)){
          showForm("login");
          document.getElementById("login-identifier").value=email;
          showStatus(loginStatus,"Account created. Please log in to continue.","success");
          return;
        }

        showStatus(signupStatus,"Account created successfully. Opening your home page...","success");
        setTimeout(()=>window.location.replace("home.html"),600);
        return;
      }

      showForm("login");
      document.getElementById("login-identifier").value=email;
      showStatus(loginStatus,"Account created successfully. Please log in.","success");

    }catch(error){
      showStatus(signupStatus,getErrorMessage(error),"error");
    }finally{
      setLoading(signupButton,false,"CREATE ACCOUNT");
    }
  });

  // LOGIN
  loginForm.addEventListener("submit",async event=>{
    event.preventDefault();
    clearStatus(loginStatus);

    const identifier=document.getElementById("login-identifier").value.trim();
    const password=document.getElementById("login-password").value;

    setLoading(loginButton,true,"Logging in...");

    try{
      const data=await apiRequest("/auth/login",{
        method:"POST",
        body:JSON.stringify({
          identifier:identifier,
          password:password
        })
      });

      const token=extractToken(data);

      if(!token){
        throw new Error("The server did not return an access token. Please check the backend login response.");
      }

      if(!saveToken(token)){
        throw new Error("Login succeeded, but this browser could not save your session.");
      }

      showStatus(loginStatus,"Login successful. Opening your home page...","success");
      setTimeout(()=>window.location.replace("home.html"),500);

    }catch(error){
      showStatus(loginStatus,getErrorMessage(error),"error");
    }finally{
      setLoading(loginButton,false,"LOGIN");
    }
  });

  // Support direct links such as auth.html?mode=login
  const params=new URLSearchParams(window.location.search);
  if(params.get("mode")==="login")showForm("login");
  else showForm("signup");

  checkExistingSession();
})();
</script>
</body>
</html>
