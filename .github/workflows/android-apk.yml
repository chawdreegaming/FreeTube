
name: Build Boys Vs Girls Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: gradle -p android assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/BoysVsGirls.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoysVsGirls-Android-APK
          path: release-apk/BoysVsGirls.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Boys Vs Girls Android v${{ github.run_number }}
          body: |
            Boys Vs Girls Android APK

            Download: BoysVsGirls.apk
          files: release-apk/BoysVsGirls.apk
          draft: false
          prerelease: false
