<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100d20"><title>Boys vs Girls - Promo Slider</title>
<style>
:root{color-scheme:dark;--pink:#f02d9b;--blue:#168cff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:transparent}
.slider{position:relative;width:100%;height:100%;min-height:96px;overflow:hidden;border-radius:16px;background:#100d20;isolation:isolate}.track{display:flex;width:100%;height:100%;transition:transform .45s ease;touch-action:pan-y}.slide{position:relative;flex:0 0 100%;height:100%;min-width:0;overflow:hidden;text-decoration:none;color:#fff;display:flex;align-items:center;padding:clamp(12px,3vw,24px);gap:clamp(8px,2vw,18px);background:radial-gradient(circle at 78% 30%,#e72b9d66,transparent 30%),radial-gradient(circle at 35% 80%,#078dff66,transparent 38%),linear-gradient(110deg,#090c2c,#171044 48%,#250b35);border:1px solid #d33acb88;border-radius:16px}.slide:before{content:"";position:absolute;inset:5px;border:1px solid #26c8ff66;border-radius:12px;pointer-events:none}.copy{position:relative;z-index:2;flex:1;min-width:0}.kicker{font-size:clamp(8px,1.8vw,12px);font-weight:800;letter-spacing:1.4px;color:#ff70d1;text-transform:uppercase;margin-bottom:4px}.brand{font-weight:900;font-size:clamp(16px,4.2vw,30px);line-height:1.02;text-shadow:0 2px 12px #000}.heart{color:#ff3ea9}.heading{font-weight:1000;font-style:italic;font-size:clamp(22px,6vw,43px);line-height:1;margin:4px 0;color:#fff;text-shadow:0 2px 0 #168cff,0 4px 14px #000}.sub{font-size:clamp(8px,2vw,13px);font-weight:800;letter-spacing:.6px;color:#e7e8ff}.cta{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:6px 12px;border-radius:30px;background:linear-gradient(90deg,#087dff,#d82bce);font-size:clamp(9px,2vw,13px);font-weight:900;box-shadow:0 0 14px #7d35ff99}.art{position:relative;z-index:1;flex:0 0 34%;height:88%;display:flex;align-items:center;justify-content:center}.gamer{font-size:clamp(45px,12vw,94px);filter:drop-shadow(0 5px 8px #0009);line-height:1}.gamer.two{font-size:clamp(38px,10vw,78px);margin-left:-13px;transform:translateY(8px)}.gamepad{position:absolute;right:0;top:0;font-size:clamp(19px,5vw,36px);filter:drop-shadow(0 0 8px #d43cff)}.play{position:absolute;right:0;bottom:5px;font-size:clamp(8px,1.8vw,12px);font-weight:900;color:#fff;background:#087dffbb;padding:5px 9px;border-radius:20px}.controls{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.arrow{pointer-events:auto;border:0;width:27px;height:36px;border-radius:20px;background:#05051599;color:#fff;font-size:20px;cursor:pointer;opacity:.82}.prev{margin-left:5px}.next{margin-right:5px}.dots{position:absolute;z-index:6;left:50%;bottom:5px;transform:translateX(-50%);display:flex;gap:5px}.dot{width:5px;height:5px;border:0;border-radius:9px;padding:0;background:#ffffff77}.dot.active{width:15px;background:#ff49bd}@media(prefers-reduced-motion:reduce){.track{transition:none}}
</style></head><body>
<div class="slider" id="slider" aria-label="Promotional cards"><div class="track" id="track">
<!-- CARD 1: Existing Boys vs Girls Free Fire Tournament. -->
<a class="slide" href="https://chawdreegaming.github.io/boys-girls-esports/" target="_blank" rel="noopener" aria-label="Open Boys vs Girls ESports Tournament"><div class="copy"><div class="kicker">Play • Compete • Win</div><div class="brand">Bᴏʏs<span class="heart">♡</span>Gɪʀʟs</div><div class="heading">ESPORTS</div><div class="sub">FREE FIRE TOURNAMENT</div><span class="cta">PLAY NOW <span aria-hidden="true">›</span></span></div><div class="art" aria-hidden="true"><span class="gamer">🧑🏻‍🚀</span><span class="gamer two">👩🏻‍🎤</span><span class="gamepad">🎮</span><span class="play">JOIN NOW</span></div></a>
<!-- ADD MORE CARDS: Duplicate one <a class="slide">...</a> block above and change its text and href. -->
</div><div class="controls"><button class="arrow prev" id="prev" type="button" aria-label="Previous card">‹</button><button class="arrow next" id="next" type="button" aria-label="Next card">›</button></div><div class="dots" id="dots" aria-label="Choose card"></div></div>
<script>(()=>{const slider=document.getElementById('slider'),track=document.getElementById('track'),dotsBox=document.getElementById('dots'),slides=Array.from(track.children);if(!slides.length)return;let index=0,timer=null,startX=0,deltaX=0;slides.forEach((_,i)=>{const dot=document.createElement('button');dot.type='button';dot.className='dot'+(i===0?' active':'');dot.setAttribute('aria-label','Go to card '+(i+1));dot.addEventListener('click',()=>show(i));dotsBox.appendChild(dot)});function show(n){index=(n+slides.length)%slides.length;track.style.transform=`translateX(-${index*100}%)`;Array.from(dotsBox.children).forEach((d,i)=>{d.classList.toggle('active',i===index);d.setAttribute('aria-current',i===index?'true':'false')});restart()}function restart(){clearInterval(timer);if(slides.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(()=>show(index+1),4500)}document.getElementById('prev').addEventListener('click',()=>show(index-1));document.getElementById('next').addEventListener('click',()=>show(index+1));slider.addEventListener('mouseenter',()=>clearInterval(timer));slider.addEventListener('mouseleave',restart);slider.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;deltaX=0;clearInterval(timer)},{passive:true});slider.addEventListener('touchmove',e=>{deltaX=e.changedTouches[0].clientX-startX},{passive:true});slider.addEventListener('touchend',()=>{if(Math.abs(deltaX)>35)show(index+(deltaX<0?1:-1));else restart()},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(timer);else restart()});restart()})();</script>
</body></html>
