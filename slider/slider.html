
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171329">
<title>Boys vs Girls Home Slider</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

.slider{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

.slide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    visibility:hidden;
    transform:translateX(32px);
    transition:
        opacity .75s ease,
        transform .75s ease,
        visibility .75s;
    pointer-events:none;
}

.slide.active{
    opacity:1;
    visibility:visible;
    transform:translateX(0);
    pointer-events:auto;
    z-index:2;
}

.slide.exit{
    opacity:0;
    transform:translateX(-32px);
}

.slide iframe{
    display:block;
    width:100%;
    height:100%;
    border:0;
    background:transparent;
}

.dots{
    position:absolute;
    z-index:5;
    left:50%;
    bottom:5px;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:5px;
    pointer-events:none;
}

.dot{
    width:6px;
    height:6px;
    border-radius:20px;
    background:#ffffff88;
    transition:all .25s ease;
}

.dot.active{
    width:17px;
    background:#f22e9b;
}

@media(prefers-reduced-motion:reduce){
    .slide{
        transition:none;
    }
}
</style>
</head>

<body>

<div class="slider" id="slider">

    <!-- Tournament Card -->

    <div class="slide active">
        <iframe
            src="tournament-card.html"
            title="Boys vs Girls Tournament Card"
            loading="eager">
        </iframe>
    </div>

    <!-- Future Card Example -->

    <!--
    <div class="slide">
        <iframe
            src="game-card.html"
            title="Game Card"
            loading="lazy">
        </iframe>
    </div>

    <div class="slide">
        <iframe
            src="event-card.html"
            title="Event Card"
            loading="lazy">
        </iframe>
    </div>
    -->

    <div class="dots" id="dots"></div>

</div>

<script>
(() => {

    const slides = Array.from(
        document.querySelectorAll(".slide")
    );

    const dots = document.getElementById("dots");

    if(!slides.length) return;

    let current = 0;
    let timer = null;

    // Create dots

    slides.forEach((_, i) => {

        const dot = document.createElement("span");

        dot.className =
            "dot" + (i === 0 ? " active" : "");

        dots.appendChild(dot);

    });

    const indicators = Array.from(
        dots.children
    );

    // Show next card

    function showNext(){

        if(slides.length < 2) return;

        const previous = current;

        current = (current + 1) % slides.length;

        slides[previous].classList.remove("active");
        slides[previous].classList.add("exit");

        slides[current].classList.remove("exit");
        slides[current].classList.add("active");

        indicators[previous].classList.remove("active");
        indicators[current].classList.add("active");

        window.setTimeout(() => {

            slides[previous].classList.remove("exit");

        }, 800);

    }

    // Auto slider: 5 seconds

    function start(){

        window.clearInterval(timer);

        if(slides.length > 1){

            timer = window.setInterval(
                showNext,
                5000
            );

        }

    }

    // Pause when page is hidden

    document.addEventListener(
        "visibilitychange",
        () => {

            if(document.hidden){

                window.clearInterval(timer);

            }else{

                start();

            }

        }
    );

    start();

})();
</script>

</body>
</html>
