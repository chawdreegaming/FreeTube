
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Boys vs Girls Slider</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,sans-serif;
}

.slider-container{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    background:transparent;
}

.slide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    visibility:hidden;
    transform:translateX(35px);
    transition:
        opacity .7s ease,
        transform .7s ease,
        visibility .7s;
}

.slide.active{
    opacity:1;
    visibility:visible;
    transform:translateX(0);
    z-index:2;
}

.slide iframe{
    width:100%;
    height:100%;
    display:block;
    border:0;
    background:transparent;
}

/* Navigation dots */

.dots{
    position:absolute;
    z-index:10;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
}

.dot{
    width:7px;
    height:7px;
    border:0;
    border-radius:20px;
    background:rgba(255,255,255,.5);
    cursor:pointer;
    transition:all .3s ease;
}

.dot.active{
    width:20px;
    background:#ed32ae;
}

/* Mobile */

@media(max-width:600px){
    .dots{
        bottom:6px;
    }
}
</style>
</head>

<body>

<div class="slider-container" id="slider">

    <!-- Tournament Card -->
    <div class="slide active">
        <iframe
            src="tournament-card.html"
            title="Tournament Card"
            loading="eager"
            scrolling="no">
        </iframe>
    </div>

    <!--
    ভবিষ্যতে নতুন কার্ড যোগ করলে এখানে
    নতুন slide এবং iframe যোগ করবে।

    Example:

    <div class="slide">
        <iframe src="game-card.html"
        title="Game Card"></iframe>
    </div>

    <div class="slide">
        <iframe src="event-card.html"
        title="Event Card"></iframe>
    </div>
    -->

    <div class="dots" id="dots"></div>

</div>

<script>

(function(){

    const slides = Array.from(
        document.querySelectorAll(".slide")
    );

    const dotsBox = document.getElementById("dots");

    if(slides.length === 0) return;

    let current = 0;
    let autoSlide = null;

    // Create navigation dots

    slides.forEach((slide,index)=>{

        const dot = document.createElement("button");

        dot.className = "dot";

        dot.setAttribute(
            "aria-label",
            "Show card " + (index + 1)
        );

        dot.addEventListener("click",()=>{

            showSlide(index);
            restartAutoSlide();

        });

        dotsBox.appendChild(dot);

    });

    const dots = Array.from(
        dotsBox.querySelectorAll(".dot")
    );

    function showSlide(index){

        slides[current].classList.remove("active");
        dots[current].classList.remove("active");

        current = (index + slides.length) % slides.length;

        slides[current].classList.add("active");
        dots[current].classList.add("active");

    }

    function nextSlide(){

        if(slides.length <= 1) return;

        showSlide(current + 1);

    }

    function restartAutoSlide(){

        clearInterval(autoSlide);

        if(slides.length > 1){

            autoSlide = setInterval(
                nextSlide,
                5000
            );

        }

    }

    // Initial state

    dots[0].classList.add("active");

    restartAutoSlide();

    // Pause when page is hidden

    document.addEventListener(
        "visibilitychange",
        ()=>{

            if(document.hidden){

                clearInterval(autoSlide);

            }else{

                restartAutoSlide();

            }

        }
    );

})();

</script>

</body>
</html>
