<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FreeTube</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
}

.splash-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    padding: 24px;
    animation: fadeIn 0.5s ease;
}

/* FreeTube Logo */
.logo {
    width: 110px;
    height: 78px;
    border-radius: 23px;
    background: #ff2028;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 22px rgba(255, 32, 40, 0.16);
    animation: logoIntro 0.8s ease;
}

.logo-letter {
    color: #ffffff;
    font-size: 65px;
    font-weight: 900;
    line-height: 1;
    font-family: Arial, Helvetica, sans-serif;
    transform: translateY(2px);
}

/* App Name */
.app-name {
    margin-top: 24px;
    font-size: 35px;
    font-weight: 800;
    color: #171717;
    letter-spacing: -1.5px;
}

.app-name span {
    color: #ff2028;
}

/* Tagline */
.tagline {
    margin-top: 9px;
    font-size: 14px;
    color: #777777;
    letter-spacing: 0.2px;
}

/* Loading Animation */
.loader {
    display: flex;
    gap: 7px;
    margin-top: 38px;
}

.loader span {
    width: 8px;
    height: 8px;
    background: #ff2028;
    border-radius: 50%;
    animation: loading 1s infinite ease-in-out;
}

.loader span:nth-child(2) {
    animation-delay: 0.15s;
}

.loader span:nth-child(3) {
    animation-delay: 0.3s;
}

/* Footer */
.footer {
    position: absolute;
    bottom: calc(28px + env(safe-area-inset-bottom));
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #999999;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes logoIntro {
    0% {
        transform: scale(0.7);
        opacity: 0;
    }
    70% {
        transform: scale(1.06);
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes loading {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.35;
    }
    30% {
        transform: translateY(-7px);
        opacity: 1;
    }
}

@media (max-width: 360px) {
    .logo {
        width: 96px;
        height: 69px;
    }

    .logo-letter {
        font-size: 57px;
    }

    .app-name {
        font-size: 31px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="splash-screen">

    <div class="logo">
        <span class="logo-letter">F</span>
    </div>

    <div class="app-name">Free<span>Tube</span></div>

    <div class="tagline">Watch. Share. Enjoy.</div>

    <div class="loader">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="footer">YOUR WORLD OF VIDEOS</div>

</div>

<script>
(function () {
    "use strict";

    const HOME_PAGE = "home.html";
    const SPLASH_DURATION = 1800;

    window.addEventListener("load", function () {
        setTimeout(function () {
            window.location.replace(HOME_PAGE);
        }, SPLASH_DURATION);
    });
})();
</script>

</body>
</html>
