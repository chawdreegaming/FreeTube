<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b22">
<title>FreeTube - Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --green:#00ff88;
  --border:rgba(255,255,255,.17);
  --panel:rgba(255,255,255,.08);
  --muted:rgba(255,255,255,.65);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(135deg,#0d3b22,#1b4d3e,#4a0e17,#7a1c24);background-attachment:fixed;color:#fff}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.app{max-width:480px;margin:auto;min-height:100dvh;padding-bottom:85px}
.menu-row{display:flex;justify-content:flex-start;padding:12px 16px}
.menu-button{width:44px;height:44px;border:1px solid var(--border);border-radius:50%;background:#ffffff12;font-size:20px}
.cover-container{height:180px;position:relative;background:#24382e}
.cover-photo{width:100%;height:100%;object-fit:cover}
.cover-upload-btn{position:absolute;right:12px;bottom:12px;background:#111b;padding:10px 12px;border-radius:9px;font-size:13px;cursor:pointer}
.profile-header-section{text-align:center;padding:0 16px 20px;border-bottom:1px solid var(--border)}
.avatar-container{width:104px;height:104px;margin:-50px auto 12px;position:relative}
.avatar{width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid #133a26;background:#111}
.avatar-upload-btn{position:absolute;bottom:0;right:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#15291e;border:2px solid #133a26;cursor:pointer}
.profile-name{font-size:25px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.verified-badge{color:var(--green);font-size:16px}
.handle-text{font-size:14px;color:var(--muted);margin-top:6px}
.follow-stats{font-size:14px;font-weight:bold;margin:12px 0}
.bio-text{font-size:15px;line-height:1.6;margin:12px 0;overflow-wrap:anywhere}
.action-row{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:1px solid var(--border);border-radius:12px;padding:12px 7px;color:#fff;font-size:13px;font-weight:bold;background:#ffffff12;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-primary{background:linear-gradient(135deg,#00b074,#008253);border:0}
.btn-icon{flex:0 0 48px}
.panel{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:18px;padding:18px;margin:14px 14px 0;box-shadow:0 8px 25px #0002}
.panel-title{font-size:17px;font-weight:bold;display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.detail-item{display:flex;gap:13px;align-items:flex-start;margin:17px 0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.detail-item i{width:22px;text-align:center;color:var(--muted);margin-top:2px}
.muted{font-size:13px;color:var(--muted);line-height:1.5}
.inline-edit{background:none;border:0;color:white;padding:4px;font-size:17px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;min-height:64px;padding:8px 4px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-around;background:rgba(13,59,34,.97);border-top:1px solid var(--border);backdrop-filter:blur(15px);z-index:25}
.nav-item{min-width:48px;background:none;border:0;color:#ffffffa6;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px}
.nav-item i{font-size:19px}
.nav-item.active{color:var(--green)}
input[type=file]{display:none}
.modal{display:none;position:fixed;inset:0;z-index:100;background:#101713;overflow-y:auto;padding-bottom:30px}
.modal.open{display:block}
.modal-header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#101713;z-index:2}
.modal-header h2{font-size:18px}
.close-btn{background:none;border:0;color:white;font-size:23px}
.modal-content{max-width:480px;margin:auto;padding:18px}
.field{display:block;margin:16px 0;font-size:14px;color:#ddd}
.field input,.field textarea{display:block;width:100%;margin-top:8px;border:1px solid var(--border);background:#ffffff0d;border-radius:10px;padding:13px;color:white;outline:none}
.field textarea{min-height:100px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--green)}
.primary-button{width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#00b074,#008253);color:white;font-weight:bold;margin-top:10px}
.settings-option{width:100%;padding:16px;margin-bottom:10px;border:1px solid var(--border);border-radius:12px;background:#ffffff0d;color:white;display:flex;align-items:center;gap:13px;text-align:left;font-size:14px}
.settings-option i{width:24px;text-align:center;color:var(--green);font-size:18px}
.toast{position:fixed;z-index:200;bottom:82px;left:50%;transform:translateX(-50%);background:#151d18;border:1px solid var(--border);padding:12px 16px;border-radius:10px;font-size:13px;display:none;width:max-content;max-width:90%;text-align:center}
.status{font-size:13px;color:var(--muted);margin-top:10px;overflow-wrap:anywhere}
.status.error{color:#ffb3b3}
.status.success{color:var(--green)}
#retrySessionButton{display:none;width:100%;margin-top:10px}
.post-card{padding:14px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}
.post-card img,.post-card video{width:100%;max-height:360px;object-fit:contain;margin-top:10px;border-radius:10px}
@media(max-width:350px){.btn{font-size:11px}.nav-item{min-width:42px}.nav-item span{font-size:10px}}
</style>
</head>

<body>
<div class="app">

<!-- Facebook-style three-line menu; no top Profile header -->
<div class="menu-row">
  <button class="menu-button" onclick="openSettings()" aria-label="Open menu">
    <i class="fa-solid fa-bars"></i>
  </button>
</div>

<section class="cover-container">
  <img id="coverPhoto"
       class="cover-photo"
       src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800"
       alt="Cover photo">
  <label for="coverInput" class="cover-upload-btn">
    <i class="fa-solid fa-camera"></i> Edit cover
  </label>
  <input type="file" id="coverInput" accept="image/*">
</section>

<section class="profile-header-section">
  <div class="avatar-container">
    <img id="profileAvatar"
         class="avatar"
         src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=250"
         alt="Profile photo">
    <label for="avatarInput" class="avatar-upload-btn" aria-label="Change profile photo">
      <i class="fa-solid fa-camera"></i>
    </label>
    <input type="file" id="avatarInput" accept="image/*">
  </div>

  <div class="profile-name">
    <span id="username">User</span>
    <i class="fa-solid fa-circle-check verified-badge"></i>
  </div>

  <div id="handle" class="handle-text">@username</div>

  <div class="follow-stats">
    <span id="followersCount">0</span> followers ·
    <span id="followingCount">0</span> following
  </div>

  <p class="bio-text" id="bioText">Welcome to my FreeTube profile!</p>

  <div class="action-row">
    <button class="btn btn-primary" onclick="showDashboard()">
      <i class="fa-solid fa-chart-line"></i> Dashboard
    </button>
    <button class="btn" onclick="goHome()">
      <i class="fa-solid fa-house"></i> Home
    </button>
    <button class="btn btn-icon" onclick="openEditModal()" aria-label="Edit profile">
      <i class="fa-solid fa-pen"></i>
    </button>
  </div>

  <p class="status" id="sessionStatus">Checking login status...</p>
  <button class="btn" id="retrySessionButton" onclick="loadProfile()">Retry connection</button>
</section>

<section class="panel">
  <div class="panel-title">
    Personal details
    <button class="inline-edit" onclick="openEditModal()" aria-label="Edit personal details">
      <i class="fa-solid fa-pen"></i>
    </button>
  </div>
  <div class="detail-item"><i class="fa-solid fa-location-dot"></i><span>Lives in <strong id="cityText">Not added</strong></span></div>
  <div class="detail-item"><i class="fa-solid fa-house"></i><span>From <strong id="homeText">Not added</strong></span></div>
  <div class="detail-item"><i class="fa-solid fa-cake-candles"></i><span>Birthday <strong id="birthdayText">Not added</strong></span></div>
</section>

<section class="panel">
  <div class="panel-title">
    Work &amp; Education
    <button class="inline-edit" onclick="openEditModal()" aria-label="Edit work and education">
      <i class="fa-solid fa-pen"></i>
    </button>
  </div>
  <div class="detail-item"><i class="fa-solid fa-briefcase"></i><span><strong id="workText">Not added</strong><br><span class="muted">Work</span></span></div>
  <div class="detail-item"><i class="fa-solid fa-graduation-cap"></i><span><strong id="educationText">Not added</strong><br><span class="muted">Education</span></span></div>
</section>

<section class="panel">
  <div class="panel-title">My Posts <span id="postCount" class="muted">0 posts</span></div>
  <div id="myPosts" class="muted">Loading posts...</div>
</section>

</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="goHome()"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button class="nav-item" onclick="goDiscover()"><i class="fa-solid fa-compass"></i><span>Discover</span></button>
  <button class="nav-item" onclick="goCreate()"><i class="fa-solid fa-square-plus" style="color:var(--green)"></i><span>Create</span></button>
  <button class="nav-item" onclick="goNotifications()"><i class="fa-solid fa-bell"></i><span>Notifications</span></button>
  <button class="nav-item active" onclick="location.href='profile.html'"><i class="fa-regular fa-user"></i><span>Profile</span></button>
</nav>

<!-- Settings menu -->
<div class="modal" id="settingsModal">
  <header class="modal-header">
    <button class="close-btn" onclick="closeModal('settingsModal')" aria-label="Close menu">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <h2>Settings</h2><span></span>
  </header>
  <div class="modal-content">
    <button class="settings-option" onclick="closeModal('settingsModal');openEditModal()">
      <i class="fa-solid fa-user-pen"></i>
      <span>Edit Profile<br><small class="muted">Name, bio and personal details</small></span>
    </button>
    <button class="settings-option" onclick="closeModal('settingsModal');notify('Account settings are coming soon.')">
      <i class="fa-solid fa-user-shield"></i>
      <span>Account Settings<br><small class="muted">Manage your account</small></span>
    </button>
    <button class="settings-option" onclick="closeModal('settingsModal');notify('Privacy settings are coming soon.')">
      <i class="fa-solid fa-lock"></i>
      <span>Privacy<br><small class="muted">Privacy options</small></span>
    </button>
  </div>
</div>

<!-- Edit profile -->
<div class="modal" id="editModal">
  <header class="modal-header">
    <button class="close-btn" onclick="closeModal('editModal')" aria-label="Close edit profile">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <h2>Edit profile</h2><span></span>
  </header>
  <div class="modal-content">
    <form id="editForm">
      <label class="field">Full name
        <input id="editName" maxlength="80" required>
      </label>
      <label class="field">Bio
        <textarea id="editBio" maxlength="500" placeholder="Tell people about yourself"></textarea>
      </label>
      <label class="field">Lives in
        <input id="editCity" maxlength="100">
      </label>
      <label class="field">From
        <input id="editHome" maxlength="100">
      </label>
      <label class="field">Birthday
        <input id="editBirthday" maxlength="40" placeholder="e.g. March 13">
      </label>
      <label class="field">Work
        <input id="editWork" maxlength="100">
      </label>
      <label class="field">Education
        <input id="editEducation" maxlength="120">
      </label>
      <button class="primary-button" id="saveProfileButton" type="submit">Save profile</button>
      <p class="status" id="editStatus"></p>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
"use strict";

const API_BASE_URL = "https://freetube-backend-a222.onrender.com/api";
const TOKEN_KEY = "freetube_access_token";
const PROFILE_KEY = "freetube_profile_data";

let toastTimer;
let currentUser = null;
let serverProfile = {};
let sessionValid = false;
let loadingProfile = false;

const defaultProfile = {
  name:"",
  handle:"",
  bio:"Welcome to my FreeTube profile!",
  city:"",
  home:"",
  birthday:"",
  work:"",
  education:"",
  followers:0,
  following:0
};

function getToken() {
  try { return localStorage.getItem(TOKEN_KEY); }
  catch { return null; }
}

function getProfile() {
  try {
    const saved = JSON.parse(localStorage.getItem(PROFILE_KEY) || "{}");
    return {...defaultProfile,...saved};
  } catch {
    return {...defaultProfile};
  }
}

function saveLocalProfile(profile) {
  try {
    localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));
  } catch (error) {
    console.warn("Local profile could not be saved:",error);
  }
}

function displayName(profile) {
  return String(profile.name || profile.handle || "User").replace(/^@/,"");
}

function renderProfile() {
  const p = getProfile();

  document.getElementById("username").textContent = displayName(p);
  document.getElementById("handle").textContent =
    p.handle ? "@" + String(p.handle).replace(/^@/,"") : "@username";
  document.getElementById("bioText").textContent = p.bio || "No bio added yet.";
  document.getElementById("cityText").textContent = p.city || "Not added";
  document.getElementById("homeText").textContent = p.home || "Not added";
  document.getElementById("birthdayText").textContent = p.birthday || "Not added";
  document.getElementById("workText").textContent = p.work || "Not added";
  document.getElementById("educationText").textContent = p.education || "Not added";
  document.getElementById("followersCount").textContent = Number(p.followers) || 0;
  document.getElementById("followingCount").textContent = Number(p.following) || 0;
}

function setStatus(message,type="") {
  const el = document.getElementById("sessionStatus");
  el.textContent = message;
  el.className = "status" + (type ? " " + type : "");
}

async function apiRequest(path,options={}) {
  const headers = {...(options.headers || {})};
  const token = getToken();

  if (token) headers.Authorization = "Bearer " + token;

  if (options.body !== undefined && !(options.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
  }

  const response = await fetch(API_BASE_URL + path,{
    ...options,
    headers,
    cache:"no-store"
  });

  let data = {};
  try { data = await response.json(); } catch {}

  if (!response.ok) {
    throw new Error(data.error || data.message || ("Server error: " + response.status));
  }

  return data;
}

function extractUser(data) {
  return data.user || data.data?.user || data.data || data;
}

function applyServerProfile(profile,user) {
  serverProfile = profile || {};
  const p = getProfile();

  const name =
    serverProfile.display_name ||
    user?.display_name ||
    user?.full_name ||
    user?.fullName ||
    user?.name;

  const handle =
    user?.username ||
    user?.handle ||
    serverProfile.username;

  if (name) p.name = name;
  if (handle) p.handle = String(handle).replace(/^@/,"");
  if (typeof serverProfile.bio === "string") p.bio = serverProfile.bio;

  saveLocalProfile(p);

  // Load saved images from the server.
  if (serverProfile.avatar_url) {
    document.getElementById("profileAvatar").src = serverProfile.avatar_url;
  }
  if (serverProfile.cover_url) {
    document.getElementById("coverPhoto").src = serverProfile.cover_url;
  }

  renderProfile();
}

async function loadProfile() {
  if (loadingProfile) return;
  loadingProfile = true;

  document.getElementById("retrySessionButton").style.display = "none";
  setStatus("Connecting to FreeTube...");

  try {
    if (!getToken()) {
      throw new Error("Please log in first.");
    }

    const meData = await apiRequest("/auth/me");
    currentUser = extractUser(meData);

    let profile = currentUser.profile || currentUser.profiles || {};
    const username = currentUser.username || currentUser.handle || profile.username;

    if (username) {
      try {
        const profileData = await apiRequest(
          "/profile/" + encodeURIComponent(String(username).replace(/^@/,""))
        );
        profile = profileData.profile || profileData.data?.profile || profileData;
      } catch (error) {
        console.warn("Public profile fetch failed:",error.message);
      }
    }

    applyServerProfile(profile,currentUser);
    sessionValid = true;
    setStatus("Profile connected to server.","success");

    await loadMyPosts();

  } catch (error) {
    sessionValid = false;
    setStatus(error.message || "Could not connect to server.","error");
    document.getElementById("retrySessionButton").style.display = "flex";
  } finally {
    loadingProfile = false;
  }
}

function openSettings() {
  document.getElementById("settingsModal").classList.add("open");
}

function openEditModal() {
  const p = getProfile();

  document.getElementById("editName").value = p.name || "";
  document.getElementById("editBio").value = p.bio || "";
  document.getElementById("editCity").value = p.city || "";
  document.getElementById("editHome").value = p.home || "";
  document.getElementById("editBirthday").value = p.birthday || "";
  document.getElementById("editWork").value = p.work || "";
  document.getElementById("editEducation").value = p.education || "";
  document.getElementById("editStatus").textContent = "";

  document.getElementById("editModal").classList.add("open");
}

function closeModal(id) {
  document.getElementById(id).classList.remove("open");
}

document.getElementById("editForm").addEventListener("submit",async function(event) {
  event.preventDefault();

  if (!getToken()) {
    notify("Please log in before editing your profile.");
    return;
  }

  const button = document.getElementById("saveProfileButton");
  const status = document.getElementById("editStatus");
  const oldText = button.textContent;

  button.disabled = true;
  button.textContent = "Saving...";
  status.textContent = "";

  const p = {
    ...getProfile(),
    name:document.getElementById("editName").value.trim(),
    bio:document.getElementById("editBio").value.trim(),
    city:document.getElementById("editCity").value.trim(),
    home:document.getElementById("editHome").value.trim(),
    birthday:document.getElementById("editBirthday").value.trim(),
    work:document.getElementById("editWork").value.trim(),
    education:document.getElementById("editEducation").value.trim()
  };

  if (!p.name) {
    status.textContent = "Please enter your name.";
    status.className = "status error";
    button.disabled = false;
    button.textContent = oldText;
    return;
  }

  try {
    const result = await apiRequest("/profile",{
      method:"PUT",
      body:JSON.stringify({
        display_name:p.name,
        bio:p.bio,
        avatar_url:serverProfile.avatar_url || null,
        cover_url:serverProfile.cover_url || null
      })
    });

    serverProfile = result.profile || serverProfile;
    saveLocalProfile(p);
    renderProfile();

    status.textContent = "Profile saved successfully.";
    status.className = "status success";
    closeModal("editModal");
    notify("Profile updated.");

  } catch (error) {
    status.textContent = error.message;
    status.className = "status error";
    notify("Could not save: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = oldText;
  }
});

async function uploadProfileImage(file) {
  if (!file) throw new Error("Please choose an image.");

  if (!file.type.startsWith("image/")) {
    throw new Error("Please select an image file.");
  }

  if (file.size > 5 * 1024 * 1024) {
    throw new Error("Image must be smaller than 5 MB.");
  }

  const form = new FormData();
  form.append("file",file);

  const result = await apiRequest("/media/upload",{
    method:"POST",
    body:form
  });

  const media = result.media || result.data?.media;
  const url = media?.url || media?.secure_url;

  if (!url || !url.startsWith("https://")) {
    throw new Error("Server did not return a valid image URL.");
  }

  return url;
}

async function changeProfileImage(file,type) {
  if (!file) return;

  if (!getToken()) {
    notify("Please log in first.");
    return;
  }

  setStatus("Uploading image...");

  try {
    const url = await uploadProfileImage(file);

    // Save the new URL to the server before showing success.
    const p = getProfile();

    const payload = {
      display_name:p.name || currentUser?.username || "",
      bio:p.bio || "",
      avatar_url:type === "avatar" ? url : (serverProfile.avatar_url || null),
      cover_url:type === "cover" ? url : (serverProfile.cover_url || null)
    };

    const result = await apiRequest("/profile",{
      method:"PUT",
      body:JSON.stringify(payload)
    });

    serverProfile = result.profile || {...serverProfile,...payload};

    // Update the displayed image only after the server saves it.
    if (type === "avatar") {
      document.getElementById("profileAvatar").src = url;
    } else {
      document.getElementById("coverPhoto").src = url;
    }

    setStatus("Profile connected to server.","success");
    notify(type === "avatar" ? "Profile photo saved." : "Cover photo saved.");

  } catch (error) {
    console.error("Image upload error:",error);
    setStatus(error.message,"error");
    notify("Image save failed: " + error.message);
  }
}

document.getElementById("avatarInput").addEventListener("change",function() {
  const file = this.files[0];
  this.value = "";
  changeProfileImage(file,"avatar");
});

document.getElementById("coverInput").addEventListener("change",function() {
  const file = this.files[0];
  this.value = "";
  changeProfileImage(file,"cover");
});

async function loadMyPosts() {
  const container = document.getElementById("myPosts");
  container.textContent = "Loading posts...";

  try {
    const data = await apiRequest("/posts?limit=30");
    const posts = data.posts || data.data?.posts || [];

    const myId = String(currentUser?.id ?? currentUser?.user_id ?? "");
    const myUsername = String(currentUser?.username || currentUser?.handle || "").toLowerCase();

    const mine = posts.filter(post => {
      const author = post.user || post.author || post.owner || {};
      const postId = String(post.user_id ?? post.author_id ?? author.id ?? author.user_id ?? "");
      const postName = String(post.username ?? post.author_username ?? author.username ?? author.handle ?? "").toLowerCase();

      return (myId && postId && myId === postId) ||
             (myUsername && postName && myUsername === postName);
    });

    document.getElementById("postCount").textContent =
      mine.length + (mine.length === 1 ? " post" : " posts");

    container.replaceChildren();

    if (!mine.length) {
      container.textContent = "No posts found for this account yet.";
      return;
    }

    mine.forEach(post => {
      const card = document.createElement("div");
      card.className = "post-card";

      const text = document.createElement("p");
      text.textContent = post.content || post.text || "";
      card.appendChild(text);

      const url = post.media_url || post.image_url || post.video_url;
      const type = String(post.media_type || post.type || "");

      if (url) {
        const media = document.createElement(type.includes("video") ? "video" : "img");
        media.src = url;
        media.controls = type.includes("video");
        media.alt = "Post media";
        card.appendChild(media);
      }

      const date = document.createElement("p");
      date.className = "muted";
      date.style.marginTop = "8px";
      date.textContent = post.created_at ? new Date(post.created_at).toLocaleString() : "";
      card.appendChild(date);

      container.appendChild(card);
    });

  } catch (error) {
    container.textContent = "Could not load posts: " + error.message;
  }
}

function goHome() {
  location.href = "home.html";
}

function goDiscover() {
  location.href = "home.html#discover";
}

function goCreate() {
  location.href = "home.html# create";
}

function goNotifications() {
  location.href = "home.html#notifications";
}

function showDashboard() {
  notify("Creator dashboard is not connected yet.");
}

function notify(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.style.display = "block";

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.style.display = "none";
  },3000);
}

window.addEventListener("DOMContentLoaded",function() {
  renderProfile();
  loadProfile();
});
</script>
