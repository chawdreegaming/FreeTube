
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#242526">
<title>Create Post — Boys vs Girls 💙💗</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --bg:#242526;
  --panel:#292a2c;
  --panel2:#303133;
  --border:rgba(255,255,255,.10);
  --text:#f5f5f7;
  --muted:#aeb0b6;
  --blue:#82b1ff;
  --purple:#bd8cff;
  --pink:#ff83b3;
  --yellow:#ffd36e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100dvh;padding-bottom:100px}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.topbar{
  position:sticky;top:0;z-index:20;
  height:66px;padding:8px 15px;
  padding-top:max(8px,env(safe-area-inset-top));
  display:grid;grid-template-columns:48px 1fr 76px;
  align-items:center;gap:8px;
  background:rgba(36,37,38,.97);
  border-bottom:1px solid var(--border);
}
.close-btn{
  width:43px;height:43px;border:0;border-radius:50%;
  background:transparent;font-size:27px;
  display:grid;place-items:center;
}
.top-title{text-align:center;font-size:21px;font-weight:800}
.next-btn{
  height:42px;border:0;border-radius:13px;
  background:#3b3c3e;color:#8d8e92;
  font-weight:800;font-size:14px;
}
.next-btn.ready{background:#82aaff;color:#17243a}

main{width:100%;max-width:650px;margin:auto}
.profile-area{padding:17px 17px 9px}
.profile-row{display:flex;align-items:center;gap:11px}
.avatar{
  width:45px;height:45px;flex-shrink:0;
  border-radius:50%;display:grid;place-items:center;
  overflow:hidden;background:linear-gradient(140deg,#678aff,#b45ce9,#f16cb0);
  font-size:18px;font-weight:800;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-details{min-width:0;flex:1}
.profile-name{font-size:15px;font-weight:800;overflow-wrap:anywhere}
.profile-caption{font-size:11px;color:var(--muted);margin-top:4px}
.privacy-select{
  max-width:132px;padding:9px 10px;border:0;border-radius:12px;
  background:#3a3b3d;color:white;font-weight:750;font-size:12px;
  outline:none;
}
.privacy-select option{background:#292a2c;color:white}

.composer{padding:4px 17px 12px}
textarea{
  display:block;width:100%;min-height:190px;max-height:42vh;
  resize:vertical;border:0;outline:none;background:transparent;
  color:var(--text);font-size:23px;line-height:1.5;
  padding:14px 0;
}
textarea::placeholder{color:#b3b4ba}
.composer-bottom{display:flex;justify-content:flex-end;color:var(--muted);font-size:12px;padding:0 0 9px}

.quick-tools{
  display:flex;gap:9px;overflow-x:auto;
  padding:9px 14px 14px;scrollbar-width:none;
}
.quick-tools::-webkit-scrollbar,.gallery-options::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:10px 14px;border:1px solid var(--border);
  border-radius:30px;background:#303133;
  font-weight:750;font-size:13px;white-space:nowrap;
}
.pill i{font-size:17px}
.pill.music i{color:var(--yellow)}
.pill.tag i{color:var(--blue)}
.pill.location i{color:var(--pink)}
.pill:active,.gallery-card:active,.privacy-button:active{transform:scale(.98)}

.divider{height:1px;background:var(--border);margin:0}
.section{padding:15px 14px 17px}
.section-heading{font-size:15px;font-weight:850;margin:0 0 12px;padding-left:2px}
.gallery-options{
  display:flex;gap:9px;overflow-x:auto;
  scrollbar-width:none;padding:1px 0 3px;
}
.gallery-card{
  flex:0 0 96px;min-height:91px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;border:1px solid var(--border);border-radius:16px;
  background:#303133;font-size:12px;font-weight:750;
}
.gallery-card i{font-size:24px;color:#b9a5ff}
.gallery-card.gif i{color:#8fc4ff}
.gallery-card.live i{color:#ff879c}
.gallery-card.video i{color:#c9a1ff}
.gallery-card small{font-size:10px;font-weight:500;color:var(--muted)}

.media-preview{
  display:none;margin:12px 14px 0;border:1px solid var(--border);
  border-radius:14px;overflow:hidden;background:#171819;position:relative;
}
.media-preview.show{display:block}
.preview-content img,.preview-content video{
  display:block;width:100%;max-height:360px;object-fit:contain;
}
.remove-media{
  position:absolute;right:8px;top:8px;z-index:2;
  width:33px;height:33px;border:1px solid #ffffff30;
  border-radius:50%;background:#000b;
}
.file-info{padding:8px 10px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}

.status{
  display:none;margin:12px 14px;padding:11px 12px;
  border-radius:11px;font-size:12px;line-height:1.5;overflow-wrap:anywhere;
}
.status.show{display:block}
.status.error{background:#6b2932;color:#ffc4cb}
.status.success{background:#1c4938;color:#a4f5cc}
.status.info{background:#283b5d;color:#c4d8ff}

.progress-wrap{display:none;margin:10px 14px}
.progress-wrap.show{display:block}
.progress-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.progress-track{height:4px;border-radius:9px;background:#444;overflow:hidden}
.progress-bar{width:0;height:100%;background:linear-gradient(90deg,#80aaff,#c28bff,#ff86b5);transition:width .2s}

.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:650px;margin:auto;
  display:flex;align-items:center;gap:9px;
  padding:11px 13px calc(11px + env(safe-area-inset-bottom));
  background:rgba(36,37,38,.97);border-top:1px solid var(--border);
}
.privacy-button{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-width:0;flex:1;padding:12px 10px;
  border:0;border-radius:28px;background:#3b3c3e;
  font-size:13px;font-weight:800;
}
.privacy-button i:first-child{font-size:17px;color:var(--blue)}
.privacy-button .caret{font-size:11px;color:var(--blue)}
.privacy-button.friends{background:#40516f}
.post-bottom{
  flex:0 0 auto;padding:12px 18px;border:0;border-radius:28px;
  background:#4e78bd;color:white;font-weight:850;font-size:13px;
}
.post-bottom:disabled{background:#38393b;color:#77797e}
.hidden-input{display:none}
.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
  z-index:60;max-width:90%;padding:11px 15px;border-radius:12px;
  background:#3b3c3e;border:1px solid var(--border);
  box-shadow:0 8px 24px #0006;font-size:12px;
}
.toast[hidden]{display:none}
@media(min-width:600px){
  .topbar{height:72px}
  .top-title{font-size:23px}
  .profile-area{padding-top:22px}
  textarea{min-height:220px;font-size:25px}
  .gallery-card{flex-basis:108px;min-height:100px}
}
@media(max-width:360px){
  .topbar{grid-template-columns:40px 1fr 65px;padding-left:9px;padding-right:9px}
  .top-title{font-size:18px}
  .next-btn{font-size:12px}
  .profile-area{padding-left:12px;padding-right:12px}
  .privacy-select{max-width:112px;font-size:11px;padding:8px}
  textarea{font-size:21px;min-height:165px}
  .gallery-card{flex-basis:86px;min-height:83px}
  .pill{padding:9px 12px;font-size:12px}
  .bottom-bar{gap:7px;padding-left:9px;padding-right:9px}
  .privacy-button{font-size:12px;padding:11px 8px}
  .post-bottom{padding:11px 14px;font-size:12px}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="close-btn" id="backBtn" type="button" aria-label="Close">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <div class="top-title">New post</div>
  <button class="next-btn" id="nextBtn" type="button" disabled>Next</button>
</header>

<main>
  <section class="profile-area">
    <div class="profile-row">
      <div class="avatar" id="userAvatar">💙</div>
      <div class="profile-details">
        <div class="profile-name" id="profileName">Your profile</div>
        <div class="profile-caption">Creating a new post</div>
      </div>
      <select class="privacy-select" id="audience" aria-label="Post privacy">
        <option value="public">🌍 Public</option>
        <option value="friends">👥 Friends</option>
      </select>
    </div>
  </section>

  <section class="composer">
    <textarea id="postContent" maxlength="5000" placeholder="What's on your mind?" aria-label="Post text"></textarea>
    <div class="composer-bottom"><span id="charCount">0/5000</span></div>
  </section>

  <div class="quick-tools">
    <button class="pill music" type="button" data-feature="Music"><i class="fa-solid fa-music"></i> Music</button>
    <button class="pill tag" type="button" data-feature="Tag/Collaborate"><i class="fa-solid fa-user-tag"></i> Tag/Collaborate</button>
    <button class="pill location" type="button" data-feature="Location"><i class="fa-solid fa-location-dot"></i> Location</button>
  </div>

  <div class="divider"></div>

  <section class="section">
    <h2 class="section-heading">Add to your post</h2>
    <div class="gallery-options">
      <button class="gallery-card" id="galleryBtn" type="button">
        <i class="fa-regular fa-images"></i><span>Gallery</span>
        <small>Photo or video</small>
      </button>
      <button class="gallery-card gif" type="button" data-feature="GIF">
        <i class="fa-solid fa-icons"></i><span>GIF</span>
      </button>
      <button class="gallery-card live" type="button" data-feature="Live">
        <i class="fa-solid fa-video"></i><span>Live</span>
      </button>
    </div>
    <input class="hidden-input" id="galleryInput" type="file" accept="image/*,video/*">
  </section>

  <div class="media-preview" id="mediaPreview">
    <button class="remove-media" id="removeMediaBtn" type="button" aria-label="Remove selected media"><i class="fa-solid fa-xmark"></i></button>
    <div class="preview-content" id="previewContent"></div>
    <div class="file-info" id="fileInfo"></div>
  </div>

  <div class="status" id="statusMessage" role="status" aria-live="polite"></div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-meta"><span id="progressLabel">Preparing post...</span><span id="progressPercent">0%</span></div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  </div>
</main>

<footer class="bottom-bar">
  <button class="privacy-button" id="privacyButton" type="button" aria-label="Change post privacy">
    <i class="fa-solid fa-earth-americas" id="privacyIcon"></i>
    <span id="privacyText">Public</span>
    <i class="fa-solid fa-caret-down caret"></i>
  </button>
  <button class="post-bottom" id="publishBtn" type="button" disabled>Post</button>
</footer>

<div class="toast" id="toast" hidden></div>

<script>
"use strict";

const API_BASE = "https://freetube-backend-a222.onrender.com/api";
const TOKEN_KEY = "freetube_access_token";
const PROFILE_KEY = "freetube_profile_data";
const DRAFT_KEY = "boysvsgirls_post_draft";

const $ = id => document.getElementById(id);

let selectedFile = null;
let selectedMediaType = null;
let previewUrl = null;
let currentUser = null;
let publishing = false;
let toastTimer = null;

function getToken(){
  try{
    return localStorage.getItem(TOKEN_KEY) ||
      sessionStorage.getItem(TOKEN_KEY) || "";
  }catch(_){return "";}
}

function setStatus(message,type="info"){
  const el=$("statusMessage");
  el.textContent=message;
  el.className="status show "+type;
}

function clearStatus(){
  $("statusMessage").textContent="";
  $("statusMessage").className="status";
}

function toast(message){
  const el=$("toast");
  el.textContent=message;
  el.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.hidden=true,2800);
}

function setProgress(percent,label){
  $("progressWrap").classList.add("show");
  $("progressBar").style.width=Math.max(0,Math.min(100,percent))+"%";
  $("progressPercent").textContent=Math.round(percent)+"%";
  $("progressLabel").textContent=label;
}

function hideProgress(){
  $("progressWrap").classList.remove("show");
  $("progressBar").style.width="0%";
}

function updateComposer(){
  const text=$("postContent").value.trim();
  $("charCount").textContent=$("postContent").value.length+"/5000";
  const canPost=Boolean(text||selectedFile) && Boolean(getToken()) && !publishing;
  $("publishBtn").disabled=!canPost;
  $("nextBtn").disabled=!canPost;
  $("nextBtn").classList.toggle("ready",canPost);
}

function showProfile(profile){
  if(!profile||typeof profile!=="object")return;

  currentUser=profile;
  const name=profile.display_name||profile.displayName||
    profile.full_name||profile.fullName||profile.name||
    profile.username||profile.email||"Your profile";
  $("profileName").textContent=name;

  const avatarUrl=profile.avatar_url||profile.avatarUrl||
    profile.profile_picture||profile.profilePicture||
    profile.photo_url||profile.photoUrl||profile.avatar||"";
  const avatar=$("userAvatar");
  avatar.replaceChildren();

  if(avatarUrl){
    const img=document.createElement("img");
    img.src=avatarUrl;
    img.alt="Profile";
    img.onerror=()=>{avatar.textContent=String(name).trim().charAt(0).toUpperCase()||"💙";};
    avatar.appendChild(img);
  }else{
    avatar.textContent=String(name).trim().charAt(0).toUpperCase()||"💙";
  }
}

async function apiRequest(path,options={}){
  const headers=new Headers(options.headers||{});
  const token=getToken();
  if(token)headers.set("Authorization","Bearer "+token);

  if(options.body && !(options.body instanceof FormData) && !headers.has("Content-Type")){
    headers.set("Content-Type","application/json");
  }

  let response;
  try{
    response=await fetch(API_BASE+path,{...options,headers});
  }catch(_){
    throw new Error("Could not connect to the server. Check your internet connection.");
  }

  const raw=await response.text();
  let data={};
  try{data=raw?JSON.parse(raw):{};}catch(_){data={message:raw};}

  if(!response.ok){
    const error=new Error(data.error||data.message||"Request failed ("+response.status+").");
    error.status=response.status;
    error.data=data;
    throw error;
  }
  return data;
}

async function loadCurrentUser(){
  try{
    const cached=JSON.parse(localStorage.getItem(PROFILE_KEY)||"null");
    if(cached)showProfile(cached);
  }catch(_){}

  if(!getToken()){
    setStatus("Please log in to publish a post.","error");
    updateComposer();
    return;
  }

  try{
    const result=await apiRequest("/auth/me");
    const user=result.user||result.profile||result.data||result;
    showProfile(user);
    try{localStorage.setItem(PROFILE_KEY,JSON.stringify(user));}catch(_){}
  }catch(error){
    if(error.status===401||error.status===403){
      setStatus("Your session may have expired. Please log in again.","error");
    }
  }
  updateComposer();
}

function clearMedia(){
  if(previewUrl){
    URL.revokeObjectURL(previewUrl);
    previewUrl=null;
  }
  selectedFile=null;
  selectedMediaType=null;
  $("galleryInput").value="";
  $("previewContent").replaceChildren();
  $("fileInfo").textContent="";
  $("mediaPreview").classList.remove("show");
  updateComposer();
}

function formatSize(bytes){
  return bytes<1024*1024
    ?Math.max(1,Math.round(bytes/1024))+" KB"
    :(bytes/(1024*1024)).toFixed(2)+" MB";
}

function selectMedia(file){
  if(!file)return;
  clearStatus();

  if(!getToken()){
    setStatus("Please log in before creating a post.","error");
    return;
  }

  if(file.size>50*1024*1024){
    setStatus("The maximum file size is 50 MB.","error");
    $("galleryInput").value="";
    return;
  }

  const type=file.type.startsWith("image/")?"image":
    file.type.startsWith("video/")?"video":"";
  if(!type){
    setStatus("Choose a supported photo or video.","error");
    $("galleryInput").value="";
    return;
  }

  clearMedia();
  selectedFile=file;
  selectedMediaType=type;
  previewUrl=URL.createObjectURL(file);

  const media=type==="image"
    ?document.createElement("img")
    :document.createElement("video");

  media.src=previewUrl;
  media.alt=type==="image"?"Selected photo preview":"";
  if(type==="video"){
    media.controls=true;
    media.playsInline=true;
    media.preload="metadata";
  }

  $("previewContent").appendChild(media);
  $("fileInfo").textContent=file.name+" · "+formatSize(file.size);
  $("mediaPreview").classList.add("show");
  updateComposer();
}

function saveDraft(){
  const draft={
    content:$("postContent").value,
    audience:$("audience").value,
    saved_at:new Date().toISOString()
  };
  try{
    localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));
    toast("Draft saved on this device.");
  }catch(_){
    toast("Could not save the draft.");
  }
}

function loadDraft(){
  try{
    const draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
    if(!draft)return;
    if(typeof draft.content==="string")$("postContent").value=draft.content;
    if(["public","friends"].includes(draft.audience)){
      $("audience").value=draft.audience;
    }
  }catch(_){}
  syncPrivacy();
}

function syncPrivacy(){
  const friends=$("audience").value==="friends";
  $("privacyText").textContent=friends?"Friends":"Public";
  $("privacyIcon").className=friends
    ?"fa-solid fa-user-group"
    :"fa-solid fa-earth-americas";
  $("privacyButton").classList.toggle("friends",friends);
}

function togglePrivacy(){
  $("audience").value=$("audience").value==="public"?"friends":"public";
  syncPrivacy();
  try{
    const draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||"{}");
    draft.audience=$("audience").value;
    localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));
  }catch(_){}
  toast("Post audience: "+($("audience").value==="friends"?"Friends":"Public"));
}

async function uploadMedia(){
  if(!selectedFile)return null;
  setProgress(8,"Uploading your media...");

  const form=new FormData();
  form.append("file",selectedFile);
  const result=await apiRequest("/media/upload",{method:"POST",body:form});

  const media=result.media||result.data||result;
  const url=media.url||media.media_url||media.mediaUrl;
  if(!url)throw new Error("The server did not return a media URL.");

  setProgress(65,"Media uploaded. Publishing post...");
  return {
    media_url:url,
    media_type:selectedMediaType,
    media_public_id:media.public_id||media.media_public_id||null
  };
}

async function publishPost(){
  if(publishing)return;
  clearStatus();

  const content=$("postContent").value.trim();
  if(!content&&!selectedFile){
    setStatus("Write something or choose a photo/video first.","error");
    return;
  }
  if(!getToken()){
    setStatus("Please log in before publishing a post.","error");
    return;
  }

  publishing=true;
  $("publishBtn").disabled=true;
  $("nextBtn").disabled=true;
  $("privacyButton").disabled=true;

  try{
    let media=null;
    if(selectedFile)media=await uploadMedia();

    setProgress(media?78:35,"Publishing your post...");

    const payload={
      content,
      media_url:media?media.media_url:null,
      media_type:media?media.media_type:null,
      media_public_id:media?media.media_public_id:null,
      audience:$("audience").value,
      visibility:$("audience").value
    };

    const result=await apiRequest("/posts",{
      method:"POST",
      body:JSON.stringify(payload)
    });

    setProgress(100,"Post published!");
    try{localStorage.removeItem(DRAFT_KEY);}catch(_){}
    setStatus(result.message||"Your post was published successfully.","success");
    $("postContent").value="";
    clearMedia();
    updateComposer();

    setTimeout(()=>{window.location.href="home.html";},900);
  }catch(error){
    hideProgress();
    if(error.status===401||error.status===403){
      setStatus("Your login session may have expired. Please log in again.","error");
    }else{
      setStatus(error.message||"Could not publish your post.","error");
    }
  }finally{
    publishing=false;
    $("privacyButton").disabled=false;
    updateComposer();
  }
}

function goBack(){
  if($("postContent").value.trim()||selectedFile){
    if(!confirm("Discard this post and leave the page?"))return;
  }
  if(history.length>1)history.back();
  else location.href="home.html";
}

function featureMessage(feature){
  const messages={
    "Music":"Music attachment needs a music search or audio service.",
    "Tag/Collaborate":"Tagging friends requires a user search and tagging API.",
    "Location":"Location tagging can be connected to a location picker.",
    "GIF":"GIF search needs a GIF provider. You can still add GIF files through Gallery.",
    "Live":"Live video requires a streaming service and backend support."
  };
  toast(messages[feature]||feature+" is not connected yet.");
}

$("backBtn").addEventListener("click",goBack);
$("galleryBtn").addEventListener("click",()=>$("galleryInput").click());
$("galleryInput").addEventListener("change",event=>selectMedia(event.target.files&&event.target.files[0]));
$("removeMediaBtn").addEventListener("click",clearMedia);
$("postContent").addEventListener("input",updateComposer);
$("audience").addEventListener("change",syncPrivacy);
$("privacyButton").addEventListener("click",togglePrivacy);
$("publishBtn").addEventListener("click",publishPost);
$("nextBtn").addEventListener("click",publishPost);

document.querySelectorAll("[data-feature]").forEach(button=>{
  button.addEventListener("click",()=>featureMessage(button.dataset.feature));
});

window.addEventListener("beforeunload",()=>{
  if(previewUrl)URL.revokeObjectURL(previewUrl);
});

loadDraft();
updateComposer();
loadCurrentUser();
</script>
</body>
</html>
