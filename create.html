<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#701b39">
<title>New post — FreeTube</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --green:#00f59b;
  --red:#ff5369;
  --text:#fff;
  --muted:#d1d9d4;
  --border:rgba(255,255,255,.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#173d30}
body{
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#a90f31 0%,#681d3d 30%,#3d2940 52%,#17563c 78%,#008a4b 100%);
  background-attachment:fixed;
}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
[hidden]{display:none!important}
.app{
  max-width:650px;
  min-height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:rgba(20,27,29,.15);
}
.topbar{
  position:sticky;top:0;z-index:10;
  display:grid;
  grid-template-columns:48px 1fr 80px;
  align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 13px 10px;
  background:rgba(30,30,34,.58);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
}
.close-btn{
  width:42px;height:42px;
  display:grid;place-items:center;
  border:0;border-radius:50%;
  background:transparent;font-size:25px;
}
.page-title{text-align:center;font-size:21px;font-weight:750}
.next-btn{
  min-width:76px;padding:11px 14px;
  border:0;border-radius:13px;
  background:linear-gradient(120deg,#ff5369,#00bd78);
  color:#fff;font-weight:bold;
}
.next-btn:disabled{background:rgba(255,255,255,.13);color:#a7aaa9}
main{
  flex:1;display:flex;flex-direction:column;
  padding:18px 17px 12px;
}
.user-row{display:flex;align-items:center;gap:12px;margin:5px 0 20px}
.avatar{
  width:64px;height:64px;object-fit:cover;border-radius:50%;
  border:2px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
}
.user-name{font-size:20px;font-weight:750;overflow-wrap:anywhere}
.user-sub{font-size:12px;color:var(--muted);margin-top:6px}
.options{
  display:flex;gap:8px;overflow-x:auto;
  scrollbar-width:none;margin-bottom:22px;padding-bottom:2px;
}
.options::-webkit-scrollbar,.media-options::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:9px 13px;border:1px solid var(--border);
  border-radius:28px;background:rgba(255,255,255,.1);
  backdrop-filter:blur(12px);font-size:13px;font-weight:650;
}
.pill i{font-size:15px}
#content{
  display:block;width:100%;min-height:180px;flex:1;
  resize:none;outline:none;border:0;background:transparent;
  color:white;font-size:24px;line-height:1.5;padding:6px 0 15px;
}
#content::placeholder{color:rgba(255,255,255,.7)}
.media-area{margin-top:auto;padding-top:14px}
#preview{
  display:none;margin-bottom:12px;padding:8px;
  border:1px solid var(--border);border-radius:15px;
  background:rgba(25,30,32,.5);
}
#previewMedia img,#previewMedia video{
  width:100%;max-height:300px;object-fit:contain;
  display:block;border-radius:10px;background:#000;
}
.file-info{font-size:12px;color:var(--muted);overflow-wrap:anywhere;padding:9px 3px}
.remove-media{
  margin-top:6px;padding:8px 11px;border-radius:9px;
  border:1px solid var(--border);background:rgba(255,83,105,.17);
}
.media-options{
  display:flex;gap:10px;overflow-x:auto;
  scrollbar-width:none;padding:6px 0 12px;
}
.media-card{
  flex:0 0 92px;min-height:82px;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:8px;
  border-radius:15px;border:1px solid var(--border);
  background:rgba(255,255,255,.11);
  box-shadow:0 5px 14px rgba(0,0,0,.08);
  font-size:12px;font-weight:700;
}
.media-card i{font-size:22px;color:#fff}
.media-card:active{transform:scale(.97)}
.media-card input{display:none}
.bottom-settings{
  position:sticky;bottom:0;
  padding:12px 15px calc(12px + env(safe-area-inset-bottom));
  background:rgba(30,30,34,.58);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--border);
}
.setting-row{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
.setting-pill{
  flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-radius:28px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.11);
  font-size:14px;font-weight:650;
}
.setting-pill i{font-size:16px}
.setting-pill.active{
  background:rgba(0,245,155,.14);
  border-color:rgba(0,245,155,.45);
}
.toast{
  display:none;position:fixed;z-index:50;
  bottom:25px;left:50%;transform:translateX(-50%);
  max-width:90%;padding:12px 16px;border-radius:12px;
  border:1px solid var(--border);background:rgba(28,35,34,.96);
  font-size:13px;text-align:center;
}
.toast.show{display:block}
.modal{
  display:none;position:fixed;inset:0;z-index:40;
  align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.65);padding:12px;
}
.modal.open{display:flex}
.modal-box{
  width:100%;max-width:500px;padding:20px;border-radius:22px;
  background:linear-gradient(145deg,#67213e,#154c36);
  border:1px solid var(--border);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h3{font-size:19px}
.modal-close{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.12);border:1px solid var(--border);
}
.modal-box p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:15px}
.modal-box select{
  width:100%;padding:13px;border-radius:12px;color:white;
  background:#26352f;border:1px solid var(--border);margin-bottom:14px;
}
.publish-btn{
  width:100%;padding:14px;border:0;border-radius:12px;
  background:linear-gradient(110deg,#ff5369,#00bd78);
  color:white;font-weight:bold;
}
@media(min-width:651px){
  body{padding:0 12px}
  .app{border-left:1px solid var(--border);border-right:1px solid var(--border)}
}
@media(max-width:370px){
  .topbar{grid-template-columns:40px 1fr 70px;padding-left:9px;padding-right:9px}
  .page-title{font-size:19px}
  .next-btn{min-width:66px;padding:10px}
  main{padding-left:13px;padding-right:13px}
  #content{font-size:22px}
  .media-card{flex-basis:84px;min-height:76px}
}
</style>
</head>

<body>
<div class="app">
<header class="topbar">
  <button class="close-btn" onclick="cancelPost()" aria-label="Close">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <h1 class="page-title">New post</h1>
  <button id="nextButton" class="next-btn" onclick="openPublish()" disabled>Next</button>
</header>

<main>
  <div class="user-row">
    <img id="avatar" class="avatar"
      src="https://placehold.co/120x120/244b37/ffffff?text=FT" alt="Profile">
    <div>
      <div id="username" class="user-name">FreeTube User</div>
      <div class="user-sub">Share with your community</div>
    </div>
  </div>

  <div class="options">
    <button class="pill" type="button" onclick="showToast('Music attachment is not available yet.')">
      <i class="fa-solid fa-music"></i> Music
    </button>
    <button class="pill" type="button" onclick="showToast('Tag/collaborate is not available yet.')">
      <i class="fa-solid fa-user-plus"></i> Tag/collaborate
    </button>
    <button class="pill" type="button" onclick="showToast('Location sharing is not available yet.')">
      <i class="fa-solid fa-location-dot"></i> Location
    </button>
  </div>

  <textarea id="content" maxlength="5000"
    placeholder="What's on your mind?" aria-label="Post caption"></textarea>

  <div id="preview">
    <div id="previewMedia"></div>
    <div id="fileInfo" class="file-info"></div>
    <button class="remove-media" type="button" onclick="removeMedia()">
      <i class="fa-solid fa-trash"></i> Remove media
    </button>
  </div>

  <div class="media-area">
    <div class="media-options">
      <label class="media-card" for="mediaFile">
        <i class="fa-regular fa-image"></i><span>Gallery</span>
      </label>
      <button class="media-card" type="button" onclick="showToast('GIF selection is not available yet.')">
        <i class="fa-solid fa-file-image"></i><span>GIF</span>
      </button>
      <button class="media-card" type="button" onclick="showToast('Live video is not available yet.')">
        <i class="fa-solid fa-video"></i><span>Live</span>
      </button>
    </div>
    <input id="mediaFile" type="file"
      accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime"
      hidden>
  </div>
</main>

<footer class="bottom-settings">
  <div class="setting-row">
    <button id="audienceButton" class="setting-pill active" type="button" onclick="openAudience()">
      <i class="fa-solid fa-earth-americas"></i>
      <span id="audienceLabel">Public</span>
      <i class="fa-solid fa-chevron-down" style="font-size:11px"></i>
    </button>
  </div>
</footer>
</div>

<div id="audienceModal" class="modal">
  <section class="modal-box">
    <div class="modal-head">
      <h3>Post audience</h3>
      <button class="modal-close" onclick="closeAudience()" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <p>Choose who can see your post.</p>
    <select id="audienceSelect">
      <option value="public">🌎 Public</option>
      <option value="followers">👥 Followers</option>
      <option value="private">🔒 Only me</option>
    </select>
    <button class="publish-btn" onclick="saveAudience()">Save audience</button>
  </section>
</div>

<div id="publishModal" class="modal">
  <section class="modal-box">
    <div class="modal-head">
      <h3>Publish post</h3>
      <button class="modal-close" onclick="closePublish()" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <p>Review your post and publish it to FreeTube.</p>
    <button id="publishButton" class="publish-btn" onclick="publishPost()">
      <i class="fa-solid fa-paper-plane"></i> Share post
    </button>
  </section>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
"use strict";

const API_BASE="https://freetube-backend-a222.onrender.com/api";
const TOKEN_KEY="freetube_access_token";
const FALLBACK_AVATAR="https://placehold.co/120x120/244b37/ffffff?text=FT";
const MAX_FILE_SIZE=50*1024*1024;

let selectedFile=null;
let previewUrl=null;
let toastTimer=null;
let audience="public";
let publishing=false;

function go(page){location.href=page}
function getToken(){
  try{return localStorage.getItem(TOKEN_KEY)||""}
  catch(_){return ""}
}
function showToast(message){
  const el=document.getElementById("toast");
  el.textContent=String(message||"Something went wrong.");
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),3200);
}
function requireLogin(){
  if(getToken())return true;
  go("auth.html?mode=login");
  return false;
}
function cancelPost(){
  const content=document.getElementById("content").value.trim();
  if(content||selectedFile){
    if(!confirm("Discard this post? Your changes will be lost."))return;
  }
  go("home.html");
}

async function api(path,options={}){
  const headers=new Headers(options.headers||{});
  const t=getToken();
  if(t)headers.set("Authorization","Bearer "+t);

  const isForm=options.body instanceof FormData;
  if(options.body&&!isForm&&!headers.has("Content-Type")){
    headers.set("Content-Type","application/json");
  }

  let response;
  try{
    response=await fetch(API_BASE+path,{...options,headers,cache:"no-store"});
  }catch(_){
    throw new Error("Backend-এর সঙ্গে সংযোগ হচ্ছে না। আবার চেষ্টা করো।");
  }

  const raw=await response.text();
  let data={};
  try{data=raw?JSON.parse(raw):{}}
  catch(_){data={message:raw}}

  if(response.status===401){
    try{localStorage.removeItem(TOKEN_KEY)}catch(_){}
    go("auth.html?mode=login");
    throw new Error("Login session শেষ হয়েছে। আবার লগইন করো।");
  }
  if(!response.ok){
    throw new Error(data.message||data.error||("API error "+response.status));
  }
  return data;
}

async function loadUser(){
  if(!requireLogin())return;
  try{
    const data=await api("/auth/me");
    const user=data.user||data;
    document.getElementById("username").textContent=
      user.display_name||user.username||"FreeTube User";
    document.getElementById("avatar").src=
      user.avatar_url||user.avatar||FALLBACK_AVATAR;
    document.getElementById("avatar").onerror=function(){
      this.onerror=null;
      this.src=FALLBACK_AVATAR;
    };
  }catch(error){
    showToast(error.message||"Could not load profile.");
  }
}

function updateNextButton(){
  const hasContent=document.getElementById("content").value.trim().length>0;
  document.getElementById("nextButton").disabled=!(hasContent||Boolean(selectedFile));
}
document.getElementById("content").addEventListener("input",updateNextButton);

function removeMedia(){
  if(previewUrl){
    URL.revokeObjectURL(previewUrl);
    previewUrl=null;
  }
  selectedFile=null;
  document.getElementById("mediaFile").value="";
  document.getElementById("previewMedia").replaceChildren();
  document.getElementById("fileInfo").textContent="";
  document.getElementById("preview").style.display="none";
  updateNextButton();
}

document.getElementById("mediaFile").addEventListener("change",event=>{
  const file=event.target.files&&event.target.files[0];
  if(!file)return;

  const allowed=[
    "image/jpeg","image/png","image/webp","image/gif",
    "video/mp4","video/webm","video/quicktime"
  ];

  if(!allowed.includes(file.type)){
    showToast("Unsupported file type.");
    removeMedia();
    return;
  }
  if(file.size>MAX_FILE_SIZE){
    showToast("File must be 50 MB or smaller.");
    removeMedia();
    return;
  }

  removeMedia();
  selectedFile=file;
  previewUrl=URL.createObjectURL(file);

  const preview=document.getElementById("previewMedia");
  if(file.type.startsWith("video/")){
    const video=document.createElement("video");
    video.src=previewUrl;
    video.controls=true;
    video.playsInline=true;
    preview.appendChild(video);
  }else{
    const image=document.createElement("img");
    image.src=previewUrl;
    image.alt="Selected media";
    preview.appendChild(image);
  }

  document.getElementById("fileInfo").textContent=
    file.name+" · "+(file.size/1024/1024).toFixed(2)+" MB";
  document.getElementById("preview").style.display="block";
  updateNextButton();
});

function openAudience(){
  document.getElementById("audienceSelect").value=audience;
  document.getElementById("audienceModal").classList.add("open");
}
function closeAudience(){
  document.getElementById("audienceModal").classList.remove("open");
}
function saveAudience(){
  audience=document.getElementById("audienceSelect").value;
  const labels={public:"Public",followers:"Followers",private:"Only me"};
  document.getElementById("audienceLabel").textContent=labels[audience];
  closeAudience();
}

function openPublish(){
  if(!requireLogin())return;
  if(!document.getElementById("content").value.trim()&&!selectedFile){
    showToast("Write something or choose media first.");
    return;
  }
  document.getElementById("publishModal").classList.add("open");
}
function closePublish(){
  document.getElementById("publishModal").classList.remove("open");
}

async function publishPost(){
  if(publishing||!requireLogin())return;

  const content=document.getElementById("content").value.trim();
  if(!content&&!selectedFile){
    showToast("Write something or choose media first.");
    closePublish();
    return;
  }

  publishing=true;
  const button=document.getElementById("publishButton");
  button.disabled=true;
  button.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Publishing...';

  try{
    let media=null;

    if(selectedFile){
      const formData=new FormData();
      formData.append("file",selectedFile);
      const uploadData=await api("/media/upload",{method:"POST",body:formData});
      media=uploadData.media||uploadData;

      if(!media.url&&!media.secure_url){
        throw new Error("Upload response-এ media URL পাওয়া যায়নি।");
      }
    }

    const mediaUrl=media?(media.url||media.secure_url):"";
    const mediaType=selectedFile
      ?(selectedFile.type.startsWith("video/")?"video":"image")
      :"";

    await api("/posts",{
      method:"POST",
      body:JSON.stringify({
        content,
        media_url:mediaUrl,
        media_type:mediaType,
        media_public_id:media?(media.public_id||""):""
      })
    });

    closePublish();
    showToast("Post published successfully!");
    document.getElementById("content").value="";
    removeMedia();
    setTimeout(()=>go("home.html"),700);
  }catch(error){
    showToast(error.message||"Could not publish post.");
  }finally{
    publishing=false;
    button.disabled=false;
    button.innerHTML='<i class="fa-solid fa-paper-plane"></i> Share post';
  }
}

document.querySelectorAll(".modal").forEach(modal=>{
  modal.addEventListener("click",event=>{
    if(event.target===modal)modal.classList.remove("open");
  });
});

window.addEventListener("beforeunload",()=>{
  if(previewUrl)URL.revokeObjectURL(previewUrl);
});

loadUser();
</script>
</body>
</html>
