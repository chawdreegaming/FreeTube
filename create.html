<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#242526">
<title>New post — Boys vs Girls 💙💗</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --bg:#242526;
  --panel:#303133;
  --border:rgba(255,255,255,.10);
  --text:#f5f5f7;
  --muted:#b0b1b7;
  --blue:#82b1ff;
  --purple:#bd8cff;
  --pink:#ff83b3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100dvh;overflow-x:hidden}
button,textarea,select{font:inherit}
button{color:inherit;cursor:pointer}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.topbar{
  position:sticky;top:0;z-index:20;
  display:grid;grid-template-columns:48px 1fr 76px;
  align-items:center;gap:8px;
  min-height:66px;padding:8px 15px;
  padding-top:max(8px,env(safe-area-inset-top));
  background:#242526;border-bottom:1px solid var(--border);
}
.close-btn{
  width:43px;height:43px;display:grid;place-items:center;
  border:0;border-radius:50%;background:transparent;font-size:28px;
}
.top-title{text-align:center;font-size:21px;font-weight:850}
.post-top-btn{
  height:42px;border:0;border-radius:13px;
  background:#3a3b3d;color:#85868b;font-size:14px;font-weight:850;
}
.post-top-btn.ready{background:#dce7ff;color:#1d2c48}

main{width:100%;max-width:650px;margin:auto;padding-bottom:20px}
.profile-area{padding:20px 17px 8px}
.profile-row{display:flex;align-items:center;gap:11px}
.avatar{
  width:52px;height:52px;flex-shrink:0;overflow:hidden;
  display:grid;place-items:center;border-radius:50%;
  background:linear-gradient(140deg,#678aff,#b45ce9,#f16cb0);
  font-size:20px;font-weight:850;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-details{min-width:0;flex:1}
.profile-name{font-size:16px;font-weight:850;overflow-wrap:anywhere}
.profile-caption{font-size:12px;color:var(--muted);margin-top:4px}
.privacy-select{
  max-width:135px;min-width:108px;
  padding:11px 10px;border:0;border-radius:13px;
  background:#3a3b3d;color:#fff;font-size:12px;font-weight:800;
  outline:none;
}
.privacy-select option{background:#303133;color:#fff}

/* Text grows naturally as the user types */
.composer{padding:7px 18px 0}
textarea{
  display:block;width:100%;
  height:3em;min-height:3em;max-height:none;
  resize:none;overflow:hidden;
  border:0;outline:0;background:transparent;color:var(--text);
  font-size:24px;line-height:1.5;padding:16px 0 8px;
}
textarea::placeholder{color:#b2b3b9}
.composer-bottom{
  display:flex;justify-content:flex-end;
  color:var(--muted);font-size:12px;padding:0 0 12px;
}

/* Media preview follows the text */
.media-preview{
  display:none;position:relative;margin:12px 15px 15px;
  overflow:hidden;border:1px solid var(--border);
  border-radius:14px;background:#151617;
}
.media-preview.show{display:block}
.preview-content img,.preview-content video{
  display:block;width:100%;max-height:350px;object-fit:contain;
}
.remove-media{
  position:absolute;right:8px;top:8px;z-index:2;
  width:34px;height:34px;border:1px solid #ffffff30;
  border-radius:50%;background:#000b;
}
.file-info{padding:8px 10px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}

.status{
  display:none;margin:10px 15px;padding:11px 12px;
  border-radius:11px;font-size:12px;line-height:1.5;overflow-wrap:anywhere;
}
.status.show{display:block}
.status.error{background:#642a32;color:#ffc5cd}
.status.success{background:#204b39;color:#a6f4ce}
.status.info{background:#293d5f;color:#c7d9ff}

.progress-wrap{display:none;margin:8px 15px 12px}
.progress-wrap.show{display:block}
.progress-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.progress-track{height:4px;border-radius:8px;background:#454648;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#80aaff,#c28bff,#ff86b5);transition:width .2s}

/* Gallery/GIF/Live panel */
.media-section{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  z-index:15;width:100%;max-width:650px;
  padding:14px 14px calc(17px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(36,37,38,.92),#242526 24%);
  border-top:1px solid var(--border);
  transition:opacity .18s ease,visibility .18s ease;
}
.media-section.hidden{
  opacity:0;visibility:hidden;pointer-events:none;
}
.media-heading{font-size:15px;font-weight:850;margin:0 0 12px 2px}
.gallery-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.gallery-card{
  min-width:0;min-height:91px;padding:11px 5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--border);border-radius:16px;background:#303133;
  font-size:13px;font-weight:800;
}
.gallery-card i{font-size:25px;color:#b9a5ff}
.gallery-card.gif i{color:#8fc4ff}
.gallery-card.live i{color:#ff879c}
.gallery-card:active{transform:scale(.98)}
.gallery-card small{font-size:10px;color:var(--muted);font-weight:500}
.hidden-input{display:none}

/* Toast message */
.toast{
  position:fixed;z-index:60;bottom:165px;left:50%;transform:translateX(-50%);
  max-width:90%;padding:11px 15px;border-radius:12px;
  background:#3b3c3e;border:1px solid var(--border);
  box-shadow:0 8px 24px #0006;font-size:12px;
}
.toast[hidden]{display:none}

/* Custom dark discard dialog */
.dialog-overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(0,0,0,.72);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s ease,visibility .2s ease;
}
.dialog-overlay.show{
  opacity:1;visibility:visible;pointer-events:auto;
}
.dialog-card{
  width:100%;max-width:380px;
  padding:23px 21px 18px;
  background:#303133;border:1px solid #ffffff16;
  border-radius:22px;
  box-shadow:0 18px 60px #0009;
  transform:translateY(12px) scale(.97);
  transition:transform .2s ease;
}
.dialog-overlay.show .dialog-card{transform:translateY(0) scale(1)}
.dialog-title-row{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.dialog-icon{
  width:48px;height:48px;flex-shrink:0;
  display:grid;place-items:center;border-radius:50%;
  background:#49303a;color:#ff83b3;font-size:20px;
}
.dialog-title{font-size:20px;font-weight:850;margin:0}
.dialog-message{font-size:14px;line-height:1.65;color:#c8c9ce;margin:0 0 10px}
.dialog-warning{font-size:12px;line-height:1.6;color:#9698a0;margin:0 0 23px}
.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dialog-btn{
  min-height:46px;padding:11px 8px;border:0;border-radius:13px;
  font-size:13px;font-weight:800;
}
.dialog-keep{background:#414245;color:#f5f5f7}
.dialog-discard{background:#dce7ff;color:#1d2c48}
.dialog-btn:active{transform:scale(.98)}

@media(min-width:600px){
  .topbar{min-height:72px}
  .top-title{font-size:23px}
  .profile-area{padding-top:24px}
  textarea{font-size:26px}
  .media-section{padding-left:18px;padding-right:18px}
  .gallery-card{min-height:100px}
}
@media(max-width:360px){
  .topbar{grid-template-columns:40px 1fr 65px;padding-left:9px;padding-right:9px}
  .top-title{font-size:18px}
  .post-top-btn{font-size:12px}
  .profile-area{padding:16px 12px 6px}
  .avatar{width:46px;height:46px}
  .profile-name{font-size:14px}
  .privacy-select{min-width:98px;max-width:112px;padding:9px 6px;font-size:11px}
  .composer{padding-left:14px;padding-right:14px}
  textarea{font-size:21px}
  .media-section{padding:12px 10px calc(14px + env(safe-area-inset-bottom))}
  .gallery-options{gap:7px}
  .gallery-card{min-height:80px;font-size:12px;border-radius:13px}
  .gallery-card i{font-size:22px}
  .dialog-card{padding:20px 17px 16px}
  .dialog-title{font-size:18px}
}
</style>
</head>

<body>
<header class="topbar">
  <button class="close-btn" id="backBtn" type="button" aria-label="Close">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <div class="top-title">New post</div>
  <button class="post-top-btn" id="publishBtn" type="button" disabled>Post</button>
</header>

<main>
  <section class="profile-area">
    <div class="profile-row">
      <div class="avatar" id="userAvatar">💙</div>
      <div class="profile-details">
        <div class="profile-name" id="profileName">Your profile</div>
        <div class="profile-caption">Creating a new post</div>
      </div>
      <select class="privacy-select" id="audience" aria-label="Post privacy">
        <option value="public">🌍 Public</option>
        <option value="friends">👥 Friends</option>
      </select>
    </div>
  </section>

  <section class="composer">
    <textarea id="postContent" maxlength="5000" placeholder="What's on your mind?" aria-label="Post text" rows="1"></textarea>
    <div class="composer-bottom"><span id="charCount">0/5000</span></div>
  </section>

  <div class="media-preview" id="mediaPreview">
    <button class="remove-media" id="removeMediaBtn" type="button" aria-label="Remove selected media">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="preview-content" id="previewContent"></div>
    <div class="file-info" id="fileInfo"></div>
  </div>

  <div class="status" id="statusMessage" role="status" aria-live="polite"></div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-meta">
      <span id="progressLabel">Preparing post...</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  </div>
</main>

<section class="media-section" id="mediaSection" aria-label="Add media">
  <h2 class="media-heading">Add to your post</h2>
  <div class="gallery-options">
    <button class="gallery-card" id="galleryBtn" type="button">
      <i class="fa-regular fa-images"></i>
      <span>Gallery</span>
      <small>Photo or video</small>
    </button>
    <button class="gallery-card gif" type="button" data-feature="GIF">
      <i class="fa-solid fa-icons"></i>
      <span>GIF</span>
    </button>
    <button class="gallery-card live" type="button" data-feature="Live">
      <i class="fa-solid fa-video"></i>
      <span>Live</span>
    </button>
  </div>
  <input class="hidden-input" id="galleryInput" type="file" accept="image/*,video/*">
</section>

<div class="toast" id="toast" hidden></div>

<!-- Custom discard confirmation -->
<div class="dialog-overlay" id="discardDialog" aria-hidden="true">
  <section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="discardTitle" aria-describedby="discardMessage">
    <div class="dialog-title-row">
      <div class="dialog-icon"><i class="fa-solid fa-trash-can"></i></div>
      <h2 class="dialog-title" id="discardTitle">Discard post?</h2>
    </div>
    <p class="dialog-message" id="discardMessage">Are you sure you want to discard this post?</p>
    <p class="dialog-warning">Your written text and selected media will be lost.</p>
    <div class="dialog-actions">
      <button class="dialog-btn dialog-keep" id="keepEditingBtn" type="button">Keep editing</button>
      <button class="dialog-btn dialog-discard" id="confirmDiscardBtn" type="button">Discard</button>
    </div>
  </section>
</div>

<script>
"use strict";

const API_BASE="https://freetube-backend-a222.onrender.com/api";
const TOKEN_KEY="freetube_access_token";
const PROFILE_KEY="freetube_profile_data";
const DRAFT_KEY="boysvsgirls_post_draft";
const $=id=>document.getElementById(id);

let selectedFile=null;
let selectedMediaType=null;
let previewUrl=null;
let publishing=false;
let toastTimer=null;
let previousFocus=null;

function getToken(){
  try{
    return localStorage.getItem(TOKEN_KEY)||sessionStorage.getItem(TOKEN_KEY)||"";
  }catch(_){return "";}
}

function showStatus(message,type="info"){
  $("statusMessage").textContent=message;
  $("statusMessage").className="status show "+type;
}

function clearStatus(){
  $("statusMessage").textContent="";
  $("statusMessage").className="status";
}

function showToast(message){
  const el=$("toast");
  el.textContent=message;
  el.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.hidden=true,2800);
}

/* Automatically resize the text area as text changes */
function resizeComposer(){
  const textarea=$("postContent");
  textarea.style.height="auto";

  const styles=getComputedStyle(textarea);
  const lineHeight=parseFloat(styles.lineHeight)||36;
  const paddingTop=parseFloat(styles.paddingTop)||0;
  const paddingBottom=parseFloat(styles.paddingBottom)||0;
  const minimumHeight=lineHeight*2+paddingTop+paddingBottom;

  textarea.style.height=Math.max(minimumHeight,textarea.scrollHeight)+"px";
}

function updateComposer(){
  resizeComposer();

  const hasContent=Boolean($("postContent").value.trim()||selectedFile);
  const enabled=hasContent&&Boolean(getToken())&&!publishing;

  $("publishBtn").disabled=!enabled;
  $("publishBtn").classList.toggle("ready",enabled);
  $("charCount").textContent=$("postContent").value.length+"/5000";
}

function updateMediaSection(){
  $("mediaSection").classList.toggle("hidden",Boolean(selectedFile));
}

function displayProfile(profile){
  if(!profile||typeof profile!=="object")return;

  const name=profile.display_name||profile.displayName||
    profile.full_name||profile.fullName||profile.name||
    profile.username||profile.email||"Your profile";

  $("profileName").textContent=name;

  const avatarUrl=profile.avatar_url||profile.avatarUrl||
    profile.profile_picture||profile.profilePicture||
    profile.photo_url||profile.photoUrl||profile.avatar||"";

  const avatar=$("userAvatar");
  avatar.replaceChildren();

  if(avatarUrl){
    const img=document.createElement("img");
    img.src=avatarUrl;
    img.alt="Profile picture";
    img.onerror=()=>{
      avatar.textContent=String(name).trim().charAt(0).toUpperCase()||"💙";
    };
    avatar.appendChild(img);
  }else{
    avatar.textContent=String(name).trim().charAt(0).toUpperCase()||"💙";
  }
}

async function apiRequest(path,options={}){
  const headers=new Headers(options.headers||{});
  const token=getToken();

  if(token)headers.set("Authorization","Bearer "+token);

  if(options.body&&!(options.body instanceof FormData)&&!headers.has("Content-Type")){
    headers.set("Content-Type","application/json");
  }

  let response;

  try{
    response=await fetch(API_BASE+path,{...options,headers});
  }catch(_){
    throw new Error("Could not connect to the server. Check your internet connection.");
  }

  const raw=await response.text();
  let data={};

  try{
    data=raw?JSON.parse(raw):{};
  }catch(_){
    data={message:raw};
  }

  if(!response.ok){
    const error=new Error(data.error||data.message||"Request failed ("+response.status+").");
    error.status=response.status;
    throw error;
  }

  return data;
}

async function loadCurrentUser(){
  try{
    const cached=JSON.parse(localStorage.getItem(PROFILE_KEY)||"null");
    if(cached)displayProfile(cached);
  }catch(_){}

  if(!getToken()){
    showStatus("Please log in before publishing a post.","error");
    updateComposer();
    return;
  }

  try{
    const result=await apiRequest("/auth/me");
    const user=result.user||result.profile||result.data||result;

    displayProfile(user);

    try{
      localStorage.setItem(PROFILE_KEY,JSON.stringify(user));
    }catch(_){}
  }catch(error){
    if(error.status===401||error.status===403){
      showStatus("Your login session may have expired. Please log in again.","error");
    }
  }

  updateComposer();
}

function clearMedia(){
  if(previewUrl){
    URL.revokeObjectURL(previewUrl);
    previewUrl=null;
  }

  selectedFile=null;
  selectedMediaType=null;
  $("galleryInput").value="";
  $("previewContent").replaceChildren();
  $("fileInfo").textContent="";
  $("mediaPreview").classList.remove("show");

  updateMediaSection();
  updateComposer();
}

function formatFileSize(bytes){
  return bytes<1024*1024
    ?Math.max(1,Math.round(bytes/1024))+" KB"
    :(bytes/(1024*1024)).toFixed(2)+" MB";
}

function selectMedia(file){
  if(!file)return;

  clearStatus();

  if(!getToken()){
    showStatus("Please log in before creating a post.","error");
    $("galleryInput").value="";
    return;
  }

  if(file.size>50*1024*1024){
    showStatus("Maximum file size is 50 MB.","error");
    $("galleryInput").value="";
    return;
  }

  const type=file.type.startsWith("image/")?"image":
    file.type.startsWith("video/")?"video":"";

  if(!type){
    showStatus("Choose a supported photo or video.","error");
    $("galleryInput").value="";
    return;
  }

  clearMedia();

  selectedFile=file;
  selectedMediaType=type;
  previewUrl=URL.createObjectURL(file);

  const element=type==="image"
    ?document.createElement("img")
    :document.createElement("video");

  element.src=previewUrl;
  element.alt=type==="image"?"Selected photo preview":"";

  if(type==="video"){
    element.controls=true;
    element.playsInline=true;
    element.preload="metadata";
  }

  $("previewContent").appendChild(element);
  $("fileInfo").textContent=file.name+" · "+formatFileSize(file.size);
  $("mediaPreview").classList.add("show");

  updateMediaSection();
  updateComposer();
}

function saveDraft(){
  try{
    localStorage.setItem(DRAFT_KEY,JSON.stringify({
      content:$("postContent").value,
      audience:$("audience").value,
      saved_at:new Date().toISOString()
    }));
    showToast("Draft saved on this device.");
  }catch(_){
    showToast("Could not save the draft.");
  }
}

function loadDraft(){
  try{
    const draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
    if(!draft)return;

    if(typeof draft.content==="string"){
      $("postContent").value=draft.content;
    }

    if(["public","friends"].includes(draft.audience)){
      $("audience").value=draft.audience;
    }
  }catch(_){}
}

async function uploadMedia(){
  if(!selectedFile)return null;

  $("progressWrap").classList.add("show");
  $("progressBar").style.width="10%";
  $("progressLabel").textContent="Uploading media...";
  $("progressPercent").textContent="10%";

  const form=new FormData();
  form.append("file",selectedFile);

  const result=await apiRequest("/media/upload",{
    method:"POST",
    body:form
  });

  const media=result.media||result.data||result;
  const url=media.url||media.media_url||media.mediaUrl;

  if(!url){
    throw new Error("The server did not return a media URL.");
  }

  $("progressBar").style.width="65%";
  $("progressLabel").textContent="Media uploaded. Publishing post...";
  $("progressPercent").textContent="65%";

  return {
    media_url:url,
    media_type:selectedMediaType,
    media_public_id:media.public_id||media.media_public_id||null
  };
}

async function publishPost(){
  if(publishing)return;

  clearStatus();

  const content=$("postContent").value.trim();

  if(!content&&!selectedFile){
    showStatus("Write something or select a photo/video first.","error");
    $("postContent").focus();
    return;
  }

  if(!getToken()){
    showStatus("Please log in before publishing a post.","error");
    return;
  }

  publishing=true;
  $("publishBtn").disabled=true;

  try{
    const media=selectedFile?await uploadMedia():null;

    $("progressWrap").classList.add("show");
    $("progressBar").style.width=media?"80%":"35%";
    $("progressLabel").textContent="Publishing your post...";
    $("progressPercent").textContent=media?"80%":"35%";

    const audience=$("audience").value;

    const payload={
      content,
      media_url:media?media.media_url:null,
      media_type:media?media.media_type:null,
      media_public_id:media?media.media_public_id:null,
      audience,
      visibility:audience
    };

    const result=await apiRequest("/posts",{
      method:"POST",
      body:JSON.stringify(payload)
    });

    $("progressBar").style.width="100%";
    $("progressPercent").textContent="100%";
    $("progressLabel").textContent="Post published!";

    try{
      localStorage.removeItem(DRAFT_KEY);
    }catch(_){}

    showStatus(result.message||"Your post was published successfully.","success");
    $("postContent").value="";
    clearMedia();
    updateComposer();

    setTimeout(()=>{location.href="home.html";},900);
  }catch(error){
    $("progressWrap").classList.remove("show");

    if(error.status===401||error.status===403){
      showStatus("Your login session may have expired. Please log in again.","error");
    }else{
      showStatus(error.message||"Could not publish your post.","error");
    }
  }finally{
    publishing=false;
    updateComposer();
  }
}

/* Open the custom dialog instead of the Android confirm popup */
function openDiscardDialog(){
  previousFocus=document.activeElement;

  const dialog=$("discardDialog");
  dialog.classList.add("show");
  dialog.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";

  $("keepEditingBtn").focus();
}

function closeDiscardDialog(){
  const dialog=$("discardDialog");
  dialog.classList.remove("show");
  dialog.setAttribute("aria-hidden","true");
  document.body.style.overflow="";

  if(previousFocus&&typeof previousFocus.focus==="function"){
    previousFocus.focus();
  }
}

function confirmDiscard(){
  closeDiscardDialog();

  /* Do not keep an abandoned draft after explicit discard */
  try{
    localStorage.removeItem(DRAFT_KEY);
  }catch(_){}

  if(previewUrl){
    URL.revokeObjectURL(previewUrl);
    previewUrl=null;
  }

  selectedFile=null;
  selectedMediaType=null;

  if(history.length>1){
    history.back();
  }else{
    location.href="home.html";
  }
}

function goBack(){
  if(publishing){
    showToast("Please wait until publishing finishes.");
    return;
  }

  const hasContent=Boolean(
    $("postContent").value.trim()||selectedFile
  );

  if(hasContent){
    openDiscardDialog();
    return;
  }

  if(history.length>1){
    history.back();
  }else{
    location.href="home.html";
  }
}

function featureMessage(feature){
  if(feature==="GIF"){
    showToast("GIF search is not connected yet. You can select a GIF file from Gallery.");
  }else if(feature==="Live"){
    showToast("Live video needs streaming and backend support.");
  }
}

$("backBtn").addEventListener("click",goBack);
$("galleryBtn").addEventListener("click",()=>$("galleryInput").click());

$("galleryInput").addEventListener("change",event=>{
  const file=event.target.files&&event.target.files[0];
  if(file)selectMedia(file);
});

$("removeMediaBtn").addEventListener("click",clearMedia);
$("postContent").addEventListener("input",updateComposer);
$("publishBtn").addEventListener("click",publishPost);

$("keepEditingBtn").addEventListener("click",closeDiscardDialog);
$("confirmDiscardBtn").addEventListener("click",confirmDiscard);

$("discardDialog").addEventListener("click",event=>{
  if(event.target===$("discardDialog")){
    closeDiscardDialog();
  }
});

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&$("discardDialog").classList.contains("show")){
    closeDiscardDialog();
  }
});

document.querySelectorAll("[data-feature]").forEach(button=>{
  button.addEventListener("click",()=>featureMessage(button.dataset.feature));
});

window.addEventListener("beforeunload",()=>{
  if(previewUrl)URL.revokeObjectURL(previewUrl);
});

loadDraft();
updateMediaSection();
updateComposer();
loadCurrentUser();
</script>
</body>
</html>
