<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101329">
<title>Pulse — Boys vs Girls 💙💗</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --blue:#168cff;
  --pink:#ff248c;
  --purple:#862dff;
  --cyan:#37d7ff;
  --bg:#101329;
  --panel:#191b35;
  --panel2:#24203f;
  --text:#fff;
  --muted:#c8c9e3;
  --border:#ffffff20;
  --gradient:linear-gradient(120deg,#168cff,#862dff 48%,#ff248c);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html {
  min-height:100%;
  background:var(--bg);
  scroll-behavior:smooth;
}

body {
  min-height:100vh;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(ellipse at 0% 0%,#173e81 0,transparent 38%),
    radial-gradient(ellipse at 100% 30%,#741c65 0,transparent 38%),
    linear-gradient(145deg,#101329,#24152f 55%,#101c3b);
  background-attachment:fixed;
}

button,input {
  font:inherit;
}

button {
  cursor:pointer;
  color:inherit;
}

[hidden] {
  display:none!important;
}

.app {
  max-width:650px;
  margin:auto;
  min-height:100dvh;
  padding-bottom:90px;
  background:#101329b8;
  border-inline:1px solid #ffffff08;
}

/* Header */

.topbar {
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:14px 17px;
  background:linear-gradient(110deg,#102c54ee,#3a1a48ee,#641d4bee);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

.brand {
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
  background:var(--gradient);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.brand i {
  color:var(--blue);
  -webkit-text-fill-color:var(--blue);
}

.brand span {
  color:var(--pink);
  -webkit-text-fill-color:var(--pink);
}

.top-actions {
  display:flex;
  gap:9px;
}

.icon-btn {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:linear-gradient(145deg,#ffffff18,#168cff20);
  border:1px solid #ffffff26;
}

.love-messenger {
  font-size:19px;
  background:var(--gradient);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 5px #ff248c55);
}

/* Search */

.search-area {
  padding:17px 16px;
  background:linear-gradient(110deg,#162344d9,#321b3cd9);
  border-bottom:1px solid var(--border);
}

.page-title {
  font-size:25px;
  font-weight:900;
  margin-bottom:5px;
  letter-spacing:-.5px;
}

.page-subtitle {
  color:var(--muted);
  font-size:13px;
  margin-bottom:15px;
  line-height:1.5;
}

.search-box {
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:#11152ccc;
  border:1px solid #ffffff28;
  border-radius:16px;
  box-shadow:0 5px 18px #0002;
}

.search-box>i {
  color:var(--cyan);
}

.search-box input {
  flex:1;
  width:100%;
  min-width:0;
  padding:14px 0;
  background:transparent;
  color:var(--text);
  border:0;
  outline:0;
}

.search-box input::placeholder {
  color:var(--muted);
}

.clear-btn {
  width:32px;
  height:32px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  background:#ff248c20;
  color:var(--pink);
}

/* Filters */

.filters {
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:14px 16px 11px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar {
  display:none;
}

.filter-btn {
  white-space:nowrap;
  padding:9px 18px;
  border:1px solid var(--border);
  border-radius:24px;
  background:#ffffff0c;
  color:var(--text);
  font-size:13px;
  font-weight:700;
  transition:background .2s,transform .2s;
}

.filter-btn:active {
  transform:scale(.97);
}

.filter-btn.active {
  background:var(--gradient);
  border-color:transparent;
  color:#fff;
  box-shadow:0 4px 15px #862dff33;
}

.results-info {
  padding:2px 16px 12px;
  color:var(--muted);
  font-size:13px;
}

#results {
  padding:0 0 10px;
}

/* Video cards */

.card {
  background:linear-gradient(145deg,#191c35f5,#24203af5);
  margin-bottom:11px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  overflow:hidden;
  box-shadow:0 6px 22px #0002;
}

.card-head {
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 14px;
}

.avatar {
  width:42px;
  height:42px;
  flex-shrink:0;
  object-fit:cover;
  border-radius:50%;
  background:#22274b;
  border:2px solid var(--blue);
}

.user-info {
  flex:1;
  min-width:0;
}

.username {
  font-weight:700;
  font-size:14px;
  overflow-wrap:anywhere;
  color:var(--text);
}

.profile-link {
  display:flex;
  align-items:center;
  flex-shrink:0;
  color:inherit;
  text-decoration:none;
}

.profile-name {
  display:inline-block;
  overflow-wrap:anywhere;
  color:var(--text);
  text-decoration:none;
}

.profile-link:active,
.profile-name:active {
  opacity:.7;
}

.time {
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.content {
  padding:0 14px 12px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.5;
  font-size:14px;
}

.media {
  width:100%;
  background:#080914;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.media video {
  display:block;
  width:100%;
  max-height:75vh;
  object-fit:contain;
  background:#080914;
}

.stats {
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  padding:11px 14px;
  color:var(--muted);
  font-size:12px;
  border-top:1px solid var(--border);
}

.stats i {
  color:var(--blue);
}

.stats .comments-icon {
  color:var(--pink);
}

/* Native ad reservation: Android bridge remains active */

.native-ad-slot {
  display:none;
  width:100%;
  height:430px;
  min-height:430px;
  margin:10px 0 14px;
  padding:0;
  border:0;
  overflow:hidden;
  background:transparent;
  position:relative;
}

.native-ad-slot.android-ad-enabled {
  display:block;
}

.native-ad-label,
.native-ad-placeholder {
  display:none!important;
}


/* Adsterra 320x50 banner after each video */
.adsterra-banner-slot {
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  min-height:60px;
  margin:0 auto 14px;
  padding:5px 0;
  overflow:hidden;
  background:#10132980;
}
.adsterra-banner-frame {
  display:block;
  width:320px;
  max-width:100%;
  height:50px;
  border:0;
  overflow:hidden;
  background:transparent;
}

/* Status messages */

.state {
  text-align:center;
  padding:38px 18px;
  color:var(--muted);
  line-height:1.8;
  background:#191b3580;
  margin:0 10px 12px;
  border:1px solid var(--border);
  border-radius:16px;
}

.state>i {
  font-size:25px;
  color:var(--cyan);
  margin-bottom:8px;
}

.secondary {
  padding:10px 15px;
  border-radius:10px;
  background:linear-gradient(110deg,#168cff,#862dff,#ff248c);
  color:white;
  border:0;
  font-weight:700;
}

/* Bottom navigation */

.bottom-nav {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  width:100%;
  max-width:650px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:9px 3px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(110deg,#121a35f5,#29172ff5,#351735f5);
  backdrop-filter:blur(22px);
  border-top:1px solid var(--border);
}

.nav-item {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  background:transparent;
  border:0;
  color:#ffffffb8;
  font-size:11px;
}

.nav-item i {
  font-size:21px;
}

.nav-item.active {
  color:var(--pink);
}

.nav-item.active i {
  filter:drop-shadow(0 0 7px #ff248c77);
}

.toast {
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  display:none;
  background:#202345f5;
  padding:12px 16px;
  border-radius:12px;
  border:1px solid var(--border);
  max-width:90%;
  font-size:13px;
  text-align:center;
  box-shadow:0 6px 22px #0004;
}

.toast.show {
  display:block;
}

@media(max-width:360px) {
  .brand {
    font-size:20px;
  }

  .nav-item {
    font-size:10px;
  }

  .nav-item i {
    font-size:20px;
  }

  .filter-btn {
    padding:9px 15px;
  }

  .page-title {
    font-size:23px;
  }
}
</style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      Boys <span>vs</span> Girls 💙💗
    </div>

    <div class="top-actions">
      <button class="icon-btn"
        onclick="go('inbox.html')"
        aria-label="Love Messenger">

      </button>

  <section class="search-area">

      onclick="go('discover.html')"
      aria-current="page">

      <span>Pulse</span>
    </button>

    <button class="nav-item" onclick="go('friends.html')">

      <i class="fa-regular fa-user"></i>
      <span>Profile</span>
    </button>
  </nav>

</div>

<div id="toast" class="toast" role="status"></div>

<script>
"use strict";

const API_BASE = "https://freetube-backend-a222.onrender.com/api";
const TOKEN_KEY = "freetube_access_token";
const FALLBACK_AVATAR =
  "https://placehold.co/120x120/173d76/ffffff?text=BG";

let allVideos = [];
let activeFilter = "all";
let searchTimer = null;
let toastTimer = null;
let videoObserver = null;
let nativeAdRefreshTimer = null;

function go(page) {
  location.href = page;
}

function token() {
  try {
    return localStorage.getItem(TOKEN_KEY) || "";
  } catch (_) {
    return "";
  }
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function count(value) {
  const n = Number(value);
  return Number.isFinite(n) ? Math.max(0, n) : 0;
}

function showToast(message) {
  const el = document.getElementById("toast");
  el.textContent = String(message || "Something went wrong.");
  el.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove("show");
  }, 2800);
}

async function api(path) {
  const headers = {};
  const accessToken = token();

  if (accessToken) {
    headers.Authorization = "Bearer " + accessToken;
  }

  let response;

  try {
    response = await fetch(API_BASE + path, {
      headers,
      cache: "no-store"
    });
  } catch (_) {
    throw new Error(
      "Backend-এ সংযোগ করা যাচ্ছে না। ইন্টারনেট পরীক্ষা করে আবার চেষ্টা করুন।"
    );
  }

  const raw = await response.text();
  let data = {};

  try {
    data = raw ? JSON.parse(raw) : {};
  } catch (_) {
    data = { message: raw };
  }

  if (response.status === 401) {
    try {
      localStorage.removeItem(TOKEN_KEY);
    } catch (_) {}

    go("auth.html?mode=login");
    throw new Error("সেশন শেষ হয়েছে। আবার লগইন করুন।");
  }

  if (!response.ok) {
    throw new Error(
      data.message || data.error || ("API error " + response.status)
    );
  }

  return data;
}

function normalize(post) {
  const src = post.media_url || post.mediaUrl || post.src || "";
  let type = String(post.media_type || post.type || "").toLowerCase();
  const author = post.author || post.user || {};

  if (["photo","png","jpg","jpeg","webp","gif"].includes(type)) {
    type = "image";
  }

  if (["mp4","webm","quicktime","mov"].includes(type)) {
    type = "video";
  }

  if (!type && src) {
    type = /\.(mp4|webm|mov|m4v|ogv)(\?|$)/i.test(src)
      ? "video"
      : "image";
  }

  return {
    id: String(post.id ?? post.post_id ?? ""),
    userId: String(
      post.user_id ??
      post.author_id ??
      post.owner_id ??
      post.userId ??
      author.id ??
      ""
    ),
    profileUsername: String(
      post.username ||
      post.author_username ||
      post.profile_username ||
      author.username ||
      ""
    ).replace(/^@/, ""),
    username:
      post.display_name ||
      post.full_name ||
      post.username ||
      post.author_name ||
      author.display_name ||
      author.username ||
      "Boys vs Girls User",
    avatar:
      post.avatar_url ||
      post.avatar ||
      post.profile_picture ||
      author.avatar_url ||
      FALLBACK_AVATAR,
    content: post.content || post.text || "",
    src,
    type,
    likes: count(post.like_count ?? post.likes_count ?? post.likes),
    comments: count(
      post.comment_count ?? post.comments_count ?? post.comments
    ),
    views: count(post.view_count ?? post.views_count ?? post.views),
    created: post.created_at || post.createdAt || post.time || ""
  };
}

function timeAgo(value) {
  if (!value) return "Recently";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  const minutes = Math.max(
    0,
    Math.floor((Date.now() - date.getTime()) / 60000)
  );

  if (minutes < 1) return "Just now";
  if (minutes < 60) return minutes + "m ago";

  const hours = Math.floor(minutes / 60);
  if (hours < 24) return hours + "h ago";

  const days = Math.floor(hours / 24);
  if (days < 7) return days + "d ago";

  return date.toLocaleDateString();
}

/*
 * Keep the existing Android Native Ads bridge.
 * The app's MainActivity handles loading and positioning ads.
 */
function nativeAdsAvailable() {
  return !!(
    window.FreeTubeAds &&
    typeof window.FreeTubeAds.updateSlot === "function"
  );
}

function setupNativeAdSlots() {
  const slots = [
    ...document.querySelectorAll(".native-ad-slot")
  ];

  if (!nativeAdsAvailable()) {
    slots.forEach(slot => {
      slot.classList.remove("android-ad-enabled");
      slot.hidden = true;
    });
    return;
  }

  slots.forEach(slot => {
    slot.hidden = false;
    slot.classList.add("android-ad-enabled");
  });

  window.updateNativeAdSlots = function() {
    if (!nativeAdsAvailable()) return;

    document.querySelectorAll(".native-ad-slot").forEach(slot => {
      const rect = slot.getBoundingClientRect();

      const visible =
        rect.bottom > 0 &&
        rect.top < window.innerHeight &&
        rect.right > 0 &&
        rect.left < window.innerWidth;

      window.FreeTubeAds.updateSlot(
        slot.id,
        rect.left,
        rect.top,
        rect.width,
        rect.height,
        visible
      );
    });
  };

  window.updateNativeAdSlots();

  requestAnimationFrame(() => {
    if (window.updateNativeAdSlots) {
      window.updateNativeAdSlots();
    }
  });

  clearTimeout(nativeAdRefreshTimer);

  nativeAdRefreshTimer = setTimeout(() => {
    if (window.updateNativeAdSlots) {
      window.updateNativeAdSlots();
    }
  }, 350);
}

function makeAdSlot(index) {
  return `
    <section
      class="native-ad-slot"
      id="native-ad-slot-${index}"
      aria-label="Sponsored content"
      hidden>
      <div class="native-ad-label">ADVERTISEMENT</div>
      <div class="native-ad-placeholder">
        <span>Advertisement</span>
      </div>
    </section>`;
}

function makeAdsterraSlot(index) {
  return `
    <section class="adsterra-banner-slot" aria-label="Advertisement">
      <iframe
        class="adsterra-banner-frame"
        title="Advertisement"
        width="320"
        height="50"
        loading="lazy"
        scrolling="no"
        frameborder="0"
        sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
        data-adsterra-slot="${index}"></iframe>
    </section>`;
}

/* Each banner runs in its own iframe so the Adsterra atOptions global
   does not collide with the next banner's script. */
function initializeAdsterraBanners() {
  const slots = document.querySelectorAll("iframe[data-adsterra-slot]");
  slots.forEach(frame => {
    if (frame.dataset.loaded === "true") return;
    frame.dataset.loaded = "true";
    frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;width:320px;height:50px;overflow:hidden;background:transparent"><script>atOptions = { 'key' : 'ab837cf0ea9c26ae43b7bc4e05a0b5de', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };<\/script><script src="https://bicea.org/22/ab837cf0ea9c26ae43b7bc4e05a0b5de"><\/script></body></html>`;
  });
}

function getProfileUrl(video) {
  const params = new URLSearchParams();

  if (video.userId) {
    params.set("userId", video.userId);
  }

  if (video.profileUsername) {
    params.set("username", video.profileUsername);
  }

  if (!video.userId && !video.profileUsername) {
    return "";
  }

  return "profile.html?" + params.toString();
}

function render() {
  const query = document.getElementById("searchInput")
    .value.trim().toLowerCase();

  let filtered = allVideos.filter(video => {
    const searchable = (
      video.username + " " +
      video.profileUsername + " " +
      video.content
    ).toLowerCase();

    return !query || searchable.includes(query);
  });

  if (activeFilter === "recent") {
    filtered = filtered.slice().sort((a, b) => {
      const dateA = new Date(a.created || 0).getTime() || 0;
      const dateB = new Date(b.created || 0).getTime() || 0;
      return dateB - dateA;
    });
  }

  document.getElementById("resultsInfo").textContent =
    filtered.length + " video" +
    (filtered.length === 1 ? "" : "s");

  const root = document.getElementById("results");

  if (videoObserver) {
    videoObserver.disconnect();
    videoObserver = null;
  }

  if (nativeAdsAvailable()) {
    document.querySelectorAll(".native-ad-slot").forEach(slot => {
      try {
        window.FreeTubeAds.updateSlot(
          slot.id, 0, 0, 0, 0, false
        );
      } catch (_) {}
    });
  }

  if (!filtered.length) {
    root.innerHTML = `
      <div class="state">
        <i class="fa-solid fa-video-slash"></i><br>
        No videos found.<br>
        Try another search or check back later.
      </div>`;
    return;
  }

  let html = "";

  filtered.forEach((video, index) => {
    const profile = getProfileUrl(video);

    const avatar = profile
      ? `
        <a class="profile-link"
          href="${esc(profile)}"
          aria-label="Open ${esc(video.username)} profile">
          <img class="avatar"
            src="${esc(video.avatar)}"
            alt=""
            loading="lazy"
            onerror="this.onerror=null;this.src='${FALLBACK_AVATAR}'">
        </a>`
      : `
        <img class="avatar"
          src="${esc(video.avatar)}"
          alt=""
          loading="lazy"
          onerror="this.onerror=null;this.src='${FALLBACK_AVATAR}'">`;

    const name = profile
      ? `
        <a class="username profile-name"
          href="${esc(profile)}">${esc(video.username)}</a>`
      : `<div class="username">${esc(video.username)}</div>`;

    let media = "";

    if (video.src && video.type === "video") {
      media = `
        <div class="media">
          <video
            class="feed-video"
            controls
            playsinline
            webkit-playsinline
            muted
            autoplay
            loop
            preload="metadata"
            src="${esc(video.src)}"
            aria-label="Video by ${esc(video.username)}">
          </video>
        </div>`;
    } else {
      media = `
        <div class="state">
          <i class="fa-solid fa-video-slash"></i><br>
          This video is not available.
        </div>`;
    }

    html += `
      <article class="card" id="video-${esc(video.id)}">
        <header class="card-head">
          ${avatar}

          <div class="user-info">
            ${name}
            <div class="time">
              ${esc(timeAgo(video.created))}
              · <i class="fa-solid fa-earth-americas"></i>
            </div>
          </div>
        </header>

        ${video.content
          ? `<div class="content">${esc(video.content)}</div>`
          : ""}

        ${media}

        <div class="stats">
          <span>
            <i class="fa-solid fa-heart"></i>
            ${video.likes} likes
          </span>
          <span>
            <i class="fa-regular fa-eye"></i>
            ${video.views} views
          </span>
          <span>
            <i class="fa-regular fa-comment comments-icon"></i>
            ${video.comments} comments
          </span>
        </div>
      </article>`;

    const number = index + 1;

    /* Keep the Android native-ad bridge slots and add an Adsterra
       320x50 banner after every video card. */
    html += makeAdsterraSlot(number);

    /* Preserve the existing Android native ad placement. */
    if (number % 2 === 0 && number < filtered.length) {
      html += makeAdSlot(number / 2);
    }
  });

  root.innerHTML = html;

  initializeAdsterraBanners();
  setupVideoPlayback();
  setupNativeAdSlots();
}

function setupVideoPlayback() {
  if (videoObserver) {
    videoObserver.disconnect();
    videoObserver = null;
  }

  const feedVideos = [
    ...document.querySelectorAll(".feed-video")
  ];

  feedVideos.forEach(video => {
    video.muted = true;
    video.playsInline = true;
    video.loop = true;
  });

  if (!("IntersectionObserver" in window)) {
    feedVideos.forEach(video => {
      const promise = video.play();
      if (promise && promise.catch) {
        promise.catch(() => {});
      }
    });
    return;
  }

  videoObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const video = entry.target;

      if (
        entry.isIntersecting &&
        entry.intersectionRatio >= 0.55
      ) {
        feedVideos.forEach(other => {
          if (other !== video) {
            other.pause();
          }
        });

        const promise = video.play();

        if (promise && promise.catch) {
          promise.catch(() => {});
        }
      } else {
        video.pause();
      }
    });
  }, {
    threshold:[0,0.25,0.55,0.75,1]
  });

  feedVideos.forEach(video => {
    videoObserver.observe(video);
  });
}

async function loadVideos() {
  const root = document.getElementById("results");

  root.innerHTML = `
    <div class="state">
      <i class="fa-solid fa-spinner fa-spin"></i><br>
      Loading videos...
    </div>`;

  document.getElementById("resultsInfo").textContent =
    "Loading videos...";

  try {
    const data = await api("/posts");

    const posts = Array.isArray(data)
      ? data
      : (data.posts || data.items || []);

    allVideos = posts
      .map(normalize)
      .filter(post =>
        post.id &&
        post.src &&
        post.type === "video"
      );

    render();
  } catch (error) {
    root.innerHTML = `
      <div class="state">
        <i class="fa-solid fa-triangle-exclamation"></i><br>
        ${esc(error.message)}<br><br>
        <button class="secondary" onclick="loadVideos()">
          Retry
        </button>
      </div>`;

    document.getElementById("resultsInfo").textContent =
      "Unable to load videos";

    showToast(error.message);
  }
}

/* Search */

document.getElementById("searchInput")
  .addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 120);
  });

document.getElementById("searchForm")
  .addEventListener("submit", event => {
    event.preventDefault();
    render();
  });

document.getElementById("clearButton")
  .addEventListener("click", () => {
    const input = document.getElementById("searchInput");
    input.value = "";
    render();
    input.focus();
  });

/* Filters */

document.querySelectorAll("[data-filter]")
  .forEach(button => {
    button.addEventListener("click", () => {
      activeFilter = button.dataset.filter;

      document.querySelectorAll("[data-filter]")
        .forEach(item => {
          item.classList.toggle("active", item === button);
        });

      render();
    });
  });

/* Keep Android native ad positions updated */

window.addEventListener("scroll", () => {
  if (window.updateNativeAdSlots) {
    window.updateNativeAdSlots();
  }
}, {passive:true});

window.addEventListener("resize", () => {
  if (window.updateNativeAdSlots) {
    window.updateNativeAdSlots();
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    document.querySelectorAll(".feed-video")
      .forEach(video => video.pause());
  } else {
    setupVideoPlayback();

    if (window.updateNativeAdSlots) {
      window.updateNativeAdSlots();
    }
  }
});

loadVideos();
</script>
</body>
