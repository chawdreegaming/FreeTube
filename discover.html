
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10291f">
<title>Discover — FreeTube</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{--bg:#10291f;--panel:#172f24;--panel2:#20392d;--green:#00e991;--text:#f6fff9;--muted:#a9bdb2;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;color:inherit}
.app{max-width:650px;margin:auto;min-height:100dvh;padding-bottom:85px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:15px 17px;background:#10291ff5;border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.brand{font-size:25px;font-weight:900}.brand i,.brand span{color:var(--green)}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--border)}
.search-area{padding:16px;background:var(--panel);border-bottom:1px solid var(--border)}
.search-box{display:flex;align-items:center;gap:10px;background:#10291f;border:1px solid var(--border);border-radius:15px;padding:0 13px}
.search-box i{color:var(--green)}
.search-box input{width:100%;min-width:0;background:transparent;color:white;border:0;outline:0;padding:14px 0}
.filters{display:flex;gap:8px;overflow:auto;padding:13px 16px;scrollbar-width:none}
.filters button{white-space:nowrap;padding:9px 15px;border:1px solid var(--border);border-radius:22px;background:var(--panel2);font-size:13px}
.filters button.active{background:var(--green);color:#073421;font-weight:bold}
.results-info{padding:0 16px 12px;color:var(--muted);font-size:13px}
#results{padding:0 0 10px}
.card{background:var(--panel);margin-bottom:10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 14px}
.avatar{width:40px;height:40px;object-fit:cover;border-radius:50%;background:var(--panel2)}
.user-info{flex:1;min-width:0}
.username{font-weight:bold;font-size:14px;overflow-wrap:anywhere}
.time{font-size:12px;color:var(--muted);margin-top:4px}
.content{padding:0 14px 12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:14px}
.media{background:#000;display:flex;align-items:center;justify-content:center}
.media img,.media video{display:block;width:100%;max-height:450px;object-fit:contain}
.stats{padding:9px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
.open-post{display:block;text-decoration:none;text-align:center;color:var(--green);padding:12px;border-top:1px solid var(--border);font-size:13px}
.state{text-align:center;padding:35px 18px;color:var(--muted);line-height:1.7}
.secondary{padding:10px 15px;border-radius:10px;background:var(--panel2);color:white;border:1px solid var(--border)}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:20;width:100%;max-width:650px;display:flex;justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));background:#10291ff7;border-top:1px solid var(--border)}
.nav-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:var(--muted);font-size:11px}
.nav-item i{font-size:21px}.nav-item.active{color:var(--green)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:40;display:none;background:var(--panel2);padding:12px 16px;border-radius:10px;border:1px solid var(--border);max-width:90%;font-size:13px}
.toast.show{display:block}
@media(min-width:651px){body{background:#091710}.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i class="fa-solid fa-play"></i> Free<span>Tube</span></div>
    <button class="icon-btn" onclick="location.href='inbox.html'" aria-label="Messages">
      <i class="fa-brands fa-facebook-messenger"></i>
    </button>
  </header>

  <section class="search-area">
    <h2 style="font-size:20px;margin-bottom:12px">Discover</h2>
    <form id="searchForm" class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="searchInput" type="search" placeholder="Search posts, videos, people..." autocomplete="off">
      <button type="button" id="clearButton" class="icon-btn" style="width:32px;height:32px" aria-label="Clear search">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </form>
  </section>

  <div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="video">Videos</button>
    <button data-filter="image">Photos</button>
    <button data-filter="text">Text posts</button>
  </div>

  <div id="resultsInfo" class="results-info">Loading posts...</div>
  <main id="results"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><br>Loading Discover...</div></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" onclick="go('home.html')"><i class="fa-solid fa-house"></i><span>Home</span></button>
    <button class="nav-item active" onclick="go('discover.html')"><i class="fa-solid fa-compass"></i><span>Discover</span></button>
    <button class="nav-item" onclick="goCreate()"><i class="fa-solid fa-square-plus"></i><span>Create</span></button>
    <button class="nav-item" onclick="go('notifications.html')"><i class="fa-solid fa-bell"></i><span>Alerts</span></button>
    <button class="nav-item" onclick="go('profile.html')"><i class="fa-regular fa-user"></i><span>Profile</span></button>
  </nav>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
"use strict";
const API_BASE="https://freetube-backend-a222.onrender.com/api";
const TOKEN_KEY="freetube_access_token";
const FALLBACK_AVATAR="https://placehold.co/120x120/244b37/ffffff?text=FT";
let allPosts=[];
let activeFilter="all";
let searchTimer=null;
let toastTimer=null;

function go(page){location.href=page}
function token(){try{return localStorage.getItem(TOKEN_KEY)||""}catch(_){return ""}}
function goCreate(){
  if(!token()){go("auth.html?mode=login");return}
  go("create.html");
}
function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function count(value){
  const n=Number(value);
  return Number.isFinite(n)?Math.max(0,n):0;
}
function showToast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}
async function api(path){
  const headers={};
  const t=token();
  if(t)headers.Authorization="Bearer "+t;
  let response;
  try{response=await fetch(API_BASE+path,{headers,cache:"no-store"})}
  catch(_){throw new Error("Backend-এ সংযোগ করা যাচ্ছে না।")}
  const raw=await response.text();
  let data={};
  try{data=raw?JSON.parse(raw):{}}catch(_){data={message:raw}}
  if(response.status===401){
    try{localStorage.removeItem(TOKEN_KEY)}catch(_){}
    go("auth.html?mode=login");
    throw new Error("আবার লগইন করো।");
  }
  if(!response.ok)throw new Error(data.message||data.error||("API error "+response.status));
  return data;
}
function normalize(p){
  const src=p.media_url||p.mediaUrl||p.src||"";
  let type=String(p.media_type||p.type||"").toLowerCase();
  if(type==="photo")type="image";
  if(!type&&src)type=/\.(mp4|webm|mov|m4v)(\?|$)/i.test(src)?"video":"image";
  return {
    id:String(p.id??p.post_id??""),
    username:p.display_name||p.username||p.author_name||"FreeTube User",
    avatar:p.avatar_url||p.avatar||p.profile_picture||FALLBACK_AVATAR,
    content:p.content||p.text||"",
    src,type,
    likes:count(p.like_count??p.likes_count??p.likes),
    comments:count(p.comment_count??p.comments_count??p.comments),
    created:p.created_at||p.createdAt||p.time||""
  };
}
function timeAgo(value){
  if(!value)return "Recently";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return String(value);
  const m=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));
  if(m<1)return "Just now";
  if(m<60)return m+"m ago";
  if(m<1440)return Math.floor(m/60)+"h ago";
  if(m<10080)return Math.floor(m/1440)+"d ago";
  return d.toLocaleDateString();
}
function render(){
  const query=document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered=allPosts.filter(p=>{
    const text=(p.username+" "+p.content).toLowerCase();
    const matchText=!query||text.includes(query);
    const matchType=activeFilter==="all"||
      (activeFilter==="text"?!p.src:
      activeFilter==="video"?p.type==="video":
      activeFilter==="image"?p.type==="image":true);
    return matchText&&matchType;
  });

  document.getElementById("resultsInfo").textContent=
    filtered.length+" result"+(filtered.length===1?"":"s");

  const root=document.getElementById("results");
  if(!filtered.length){
    root.innerHTML='<div class="state"><i class="fa-solid fa-magnifying-glass"></i><br>No matching posts found.</div>';
    return;
  }

  root.innerHTML=filtered.map(p=>{
    let media="";
    if(p.src&&p.type==="video"){
      media='<div class="media"><video controls playsinline preload="metadata" src="'+esc(p.src)+'"></video></div>';
    }else if(p.src){
      media='<div class="media"><img loading="lazy" src="'+esc(p.src)+'" alt="Post image" onerror="this.parentElement.hidden=true"></div>';
    }
    return `
      <article class="card">
        <div class="card-head">
          <img class="avatar" src="${esc(p.avatar)}" alt=""
            onerror="this.onerror=null;this.src='${FALLBACK_AVATAR}'">
          <div class="user-info">
            <div class="username">${esc(p.username)}</div>
            <div class="time">${esc(timeAgo(p.created))}</div>
          </div>
        </div>
        ${p.content?`<div class="content">${esc(p.content)}</div>`:""}
        ${media}
        <div class="stats">
          <i class="fa-solid fa-thumbs-up"></i> ${p.likes} likes
          &nbsp; · &nbsp; ${p.comments} comments
        </div>
        <a class="open-post" href="home.html#post-${encodeURIComponent(p.id)}">
          View post <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </a>
      </article>`;
  }).join("");
}
async function loadPosts(){
  const root=document.getElementById("results");
  root.innerHTML='<div class="state"><i class="fa-solid fa-spinner fa-spin"></i><br>Loading posts...</div>';
  try{
    const data=await api("/posts");
    const posts=Array.isArray(data)?data:(data.posts||data.items||[]);
    allPosts=posts.map(normalize).filter(p=>p.id);
    render();
  }catch(error){
    root.innerHTML='<div class="state">'+esc(error.message)+'<br><br><button class="secondary" onclick="loadPosts()">Retry</button></div>';
    document.getElementById("resultsInfo").textContent="Unable to load";
  }
}
document.getElementById("searchInput").addEventListener("input",()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(render,120);
});
document.getElementById("searchForm").addEventListener("submit",event=>{
  event.preventDefault();
  render();
});
document.getElementById("clearButton").addEventListener("click",()=>{
  document.getElementById("searchInput").value="";
  render();
  document.getElementById("searchInput").focus();
});
document.querySelectorAll("[data-filter]").forEach(button=>{
  button.addEventListener("click",()=>{
    activeFilter=button.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b===button));
    render();
  });
});
loadPosts();
</script>
</body>
</html>
